<script>
/* ── v618 mobile/network: MIRROR intake.html ↔ portal.html ↔ book.html byte-for-byte (prove-portal · prove-public-mobile) ──
   (1) Sentry loads async (a slow/blocked CDN no longer holds the page) and never receives the
       link token (any 64-hex run is scrubbed from events and breadcrumbs) nor the page (replays off).
   (2) withTimeout: a hanging request on a weak mobile link ends in the retry screen, not an endless spinner. */
window.sentryOnLoad = function(){
  try {
    var scrub = function(o){ try { return JSON.parse(JSON.stringify(o).replace(/[0-9a-fA-F]{64}/g, '[token]')); } catch (e) { return null; } };
    Sentry.init({ sendDefaultPii: false, replaysSessionSampleRate: 0, replaysOnErrorSampleRate: 0,
      beforeSend: function(ev){ return scrub(ev); }, beforeBreadcrumb: function(b){ return scrub(b); } });
  } catch (e) {}
};
window.withTimeout = function(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
};
</script>

/* M181: theme — same key as the app (sydent_theme) so the owner's phone follows his choice; the patient's own choice persists on his phone */
(function(){
  var KEY = 'sydent_theme';
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#0a1628' : '#ffffff');
    var b = document.getElementById('themeBtn'); if (b) { b.textContent = t === 'dark' ? '☀️' : '🌙'; b.setAttribute('aria-label', t === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن'); }
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === 'dark' ? 'dark' : 'light');
  window.toggleTheme = function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  document.addEventListener('DOMContentLoaded', function(){ apply(document.documentElement.getAttribute('data-theme') || 'light'); });
})();
</script>

  return '<div class="card"><div class="sec-title"><span class="ic">📝</span>استمارة المريض</div>'
    + '<p class="sec-hint">لديك استمارة بانتظار التعبئة — تأخذ دقيقتين وتساعد الطبيب على علاجك بأمان.</p>'
    + '<a class="btn btn-go" href="/intake.html?t=' + tok + '">تعبئة الاستمارة الآن</a></div>';
}
function screenPortal(){
  var show = INFO.show || {};
  var h = '<div class="card"><h1>' + esc(clinicName()) + '</h1>'
    + '<p class="sub">مرحباً ' + esc(firstName() || 'بك') + ' 👋 — هذه صفحتك الخاصة' + (INFO.expires_at ? '، صالحة حتى ' + esc(fmtDateTime(INFO.expires_at).slice(0, 10)) : '') + '.</p>'
    + (waPhone() ? '<a class="btn btn-wa" href="' + waHref('مرحباً، أنا ' + ((INFO && INFO.patient_name) || '') + '.') + '" target="_blank" rel="noopener">📱 تواصل مع العيادة عبر واتساب</a>' : '')
    + '</div>';
  h += sectionIntake(INFO.intake);
  if (show.appts)   h += sectionAppts(INFO.appts);
  if (show.plan)    h += sectionPlan(INFO.plan);
  if (show.history) h += sectionHistory(INFO.history);   /* M187 */
  if (show.balance) h += sectionBalance(INFO.balance, INFO.installments);
  if (show.notes)   h += sectionNotes(INFO.notes);
  h += sectionXrays();   /* M193: يظهر فقط إن شاركت العيادة صوراً ومفتاحُها مفعّل (الخادمُ يقرّر) */
  app(h);
}

/* ── M193 · v638: صورُ الأشعة التي شاركها الطبيب — تأتي من Edge Function `portal-xray` (لا من portal_info):
   Storage لا يوقّع روابطَ لزائرٍ مجهول، فالدالةُ تتحقّق من الرابط ومفتاح العيادة وعلم المشاركة ثم توقّع كل صورة
   15 دقيقة. الأصلُ وحده (بلا تعليقات الطبيب). صفرُ كتابة. رابطٌ انتهى ⇒ «حدّث» يطلب روابطَ جديدة. ── */
var XR = null;   /* null = لم يُطلب · {loading} · {items, at} · {err} */
var XR_TYPES = { periapical: 'ذروية', bitewing: 'مجنّحة', panoramic: 'بانوراما', cephalometric: 'سيفالومترية', other: 'أخرى' };
async function loadXrays(){
  if (!sb || !sb.functions || !TOKEN) return;
  XR = { loading: true };
  try {
    var res = await withTimeout(sb.functions.invoke('portal-xray', { body: { t: TOKEN } }), 20000);
    var out = (res && res.data) || {};
    if (res && res.error) throw res.error;
    XR = out.ok ? { items: Array.isArray(out.items) ? out.items.slice(0, 40) : [], at: Date.now(), ttl: (Number(out.expires_in) || 900) * 1000 } : { off: true };
  } catch (e) { XR = { err: true }; }
  if (INFO) screenPortal();
}
function xrFresh(){ return XR && XR.items && (Date.now() - XR.at) < (XR.ttl - 60000); }
function sectionXrays(){
  if (!XR || XR.loading || XR.off) return '';
  if (XR.err) return '';
  var items = XR.items || [];
  if (!items.length) return '';
  var h = '<div class="card"><div class="sec-title"><span class="ic">🩻</span>صور الأشعة</div>'
    + '<p class="sec-hint">صورٌ شاركها معك طبيبك — اضغط صورةً لتكبيرها. للاستفسار عن أي صورة تواصل مع العيادة.</p>';
  if (!xrFresh()) return h + '<button type="button" class="btn btn-go" onclick="loadXrays()">عرض الصور</button></div>';
  h += '<div class="xr-grid">' + items.map(function(it, i){
    if (!/^https:\/\//.test(String(it.url || ''))) return '';
    var meta = [fmtYmd(String(it.date || '').slice(0, 10))];
    if (it.kind === 'xray' && XR_TYPES[it.type]) meta.push(XR_TYPES[it.type]);
    if (Array.isArray(it.teeth) && it.teeth.length) meta.push('سن ' + it.teeth.slice(0, 6).join('، ') + (it.teeth.length > 6 ? '…' : ''));
    return '<button type="button" class="xr-card" onclick="openXray(' + i + ')"><img src="' + esc(it.url) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
      + '<span class="meta">' + meta.map(esc).join(' · ') + '</span></button>';
  }).join('') + '</div>';
  return h + '</div>';
}
function openXray(i){
  if (!xrFresh()) { loadXrays(); return; }
  var it = XR.items[i]; if (!it || !/^https:\/\//.test(String(it.url || ''))) return;
  closeXray();
  document.body.insertAdjacentHTML('beforeend', '<div class="xr-ov" id="xrOv" role="dialog" aria-modal="true" onclick="if(event.target===this)closeXray()" onkeydown="if(event.key===\'Escape\')closeXray()">'
    + '<button type="button" class="xr-x" onclick="closeXray()" aria-label="إغلاق">✕</button>'
    + '<img src="' + esc(it.url) + '" alt="" referrerpolicy="no-referrer">'
    + '<a class="xr-full" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">فتح بالحجم الكامل ↗</a></div>');
  document.body.style.overflow = 'hidden';
  var x = document.querySelector('#xrOv .xr-x'); if (x && x.focus) x.focus();
}
function closeXray(){ var o = document.getElementById('xrOv'); if (o) o.remove(); document.body.style.overflow = ''; }

/* M182: the patient confirms his own unconfirmed upcoming appointment — the portal's single write */
var _confirmBusy = false;
async function confirmAppt(btn, id){
  if (_confirmBusy || !TOKEN || !INFO) return;
  _confirmBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التأكيد…'; }
  try {
    if (!sb) throw new Error('vendor');
    var res = await withTimeout(sb.rpc('portal_confirm', { p_token: TOKEN, p_appt: id }), 20000);
    if (res.error) throw res.error;
    var out = res.data || {};
    if (out.ok) {
      var list = (INFO.appts && INFO.appts.upcoming) || [];
      list.forEach(function(a){ if (a.id === id) { a.status = 'confirmed'; a.confirmation = 'confirmed'; } });
      screenPortal();
      flash('note', '✓ تم تأكيد موعدك — شكراً لك.');
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '✓ تأكيد الموعد'; }
      flash('warn', out.reason === 'not_confirmable' ? 'لا يمكن تأكيد هذا الموعد — تواصل مع العيادة.' : 'تعذّر التأكيد — أعد تحميل الصفحة أو تواصل مع العيادة.');
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '✓ تأكيد الموعد'; }
    flash('warn', 'تعذّر الاتصال — تحقق من الإنترنت ثم أعد المحاولة.');
  }
  _confirmBusy = false;
}
/* M187: cancel / change request — the portal's second narrow write */
function openChange(id, kind){
  OPEN_CHG = { id: id, kind: kind, day: null, time: null, note: '' };
  screenPortal();
  var p = document.getElementById('chgPanel'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (kind === 'change' && INFO.changes && INFO.changes.slots) loadSlots(id);
}
/* M189: the picker is used when the clinic has booking hours and the read returned days */
function slotMode(id){ var S = SLOTS[id]; return !!(INFO.changes && INFO.changes.slots && !(S && (S.err || (S.days && !S.days.length)))); }
async function loadSlots(id){
  SLOTS[id] = { loading: true };
  try {
    if (!sb) throw new Error('vendor');
    var res = await withTimeout(sb.rpc('portal_slots', { p_token: TOKEN, p_appt: id }), 20000);
    if (res.error) throw res.error;
    var out = res.data || {};
    SLOTS[id] = out.ok ? { days: Array.isArray(out.days) ? out.days : [], dur: out.dur } : { err: out.reason || 'unavailable' };
    if (!out.ok && out.reason === 'too_late') { var a = findAppt(id); if (a) a.can_change = false; OPEN_CHG = null; screenPortal(); if (a) flash('warn', tplMsg('too_late', a), true); return; }
  } catch (e) { SLOTS[id] = { err: 'network' }; }
  if (OPEN_CHG && OPEN_CHG.id === id) screenPortal();
}
function findAppt(id){ var r = null; ((INFO.appts && INFO.appts.upcoming) || []).forEach(function(x){ if (x.id === id) r = x; }); return r; }
/* the strip is rebuilt on every pick — keep the chosen day in view (it reset to the first days before) */
function keepDayVisible(){ var on = document.querySelector('#slotDays .chip.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
function pickDay(d){ if (!OPEN_CHG) return; OPEN_CHG.day = d; OPEN_CHG.time = null; screenPortal(); keepDayVisible(); var s = document.getElementById('slotTimes'); if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' }); }
function pickTime(t){ if (!OPEN_CHG) return; OPEN_CHG.time = t; screenPortal(); keepDayVisible(); var g = document.getElementById('chgGo'); if (g && g.scrollIntoView) g.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function closeChange(){ OPEN_CHG = null; screenPortal(); }
function pickChip(btn){
  var box = btn && btn.parentNode; if (!box) return;
  var on = btn.classList.contains('on');
  box.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
  if (!on) { btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true'); }
}
var _chgBusy = false;
async function submitChange(btn, id, kind){
  if (_chgBusy || !TOKEN || !INFO) return;
  var list = (INFO.appts && INFO.appts.upcoming) || [], a = null;
  list.forEach(function(x){ if (x.id === id) a = x; });
  if (!a) return;
  var useSlot = kind === 'change' && slotMode(id);
  if (useSlot && !(OPEN_CHG && OPEN_CHG.day && OPEN_CHG.time)) return;
  var slotD = useSlot ? OPEN_CHG.day : null, slotT = useSlot ? OPEN_CHG.time : null;
  var chip = document.querySelector('#chgChips .chip.on'), txt = document.getElementById('chgText');
  var pick = chip ? chip.getAttribute('data-v') : '', extra = txt ? String(txt.value || '').trim().slice(0, 300) : '';
  var reason = kind === 'cancel' ? [pick, extra].filter(Boolean).join(' — ').slice(0, 300) : '';
  var label = btn ? btn.textContent : '';
  _chgBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; }
  try {
    if (!sb) throw new Error('vendor');
    var res = await withTimeout(sb.rpc('portal_appt_change', { p_token: TOKEN, p_appt: id, p_kind: kind, p_reason: reason || null,
      p_pref: kind === 'change' && !useSlot ? (pick || null) : null, p_note: kind === 'change' ? (extra || null) : null,
      p_date: slotD, p_time: slotT }), 20000);
    if (res.error) throw res.error;
    var out = res.data || {};
    if (out.ok) {
      OPEN_CHG = null;
      if (out.applied) { a.status = 'cancelled'; a.confirmation = 'cancelled_by_pt'; }
      else { a.open_request = kind; if (slotD && slotT) a.open_request_at = slotD + ' ' + slotT; }
      screenPortal();
      flash('note', tplMsg(out.applied ? 'cancelled' : 'requested', a), true);
    } else if (out.reason === 'slot_taken') {
      if (btn) { btn.disabled = false; btn.textContent = label; }
      if (OPEN_CHG) OPEN_CHG.time = null;
      _chgBusy = false;
      await loadSlots(id);   /* re-render first — the notice is inserted into the fresh page */
      flash('warn', 'هذا الوقت لم يعد متاحاً — اختر وقتاً آخر.');
      return;
    } else if (out.reason === 'too_late') {
      OPEN_CHG = null; a.can_change = false; screenPortal();
      flash('warn', tplMsg('too_late', a), true);
    } else if (out.reason === 'disabled') {
      OPEN_CHG = null; INFO.changes = null; if (INFO.show) INFO.show.changes = false; screenPortal();
      flash('warn', 'هذه الخدمة غير مفعّلة حالياً — تواصل مع العيادة.');
    } else {
      if (btn) { btn.disabled = false; btn.textContent = label; }
      flash('warn', out.reason === 'rate_limited' ? 'وصلت إلى الحدّ اليومي من الطلبات — تواصل مع العيادة مباشرة.'
        : (out.reason === 'not_changeable' ? 'لا يمكن تعديل هذا الموعد من هنا — تواصل مع العيادة.' : 'تعذّر الإرسال — أعد تحميل الصفحة أو تواصل مع العيادة.'));
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    flash('warn', 'تعذّر الاتصال — تحقق من الإنترنت ثم أعد المحاولة.');
  }
  _chgBusy = false;
}
/* inline notice at the top of the page (no native dialogs — platform rule); keep ⇒ a clinic message stays until the next action */
function flash(kind, text, keep){
  var old = document.getElementById('flashNote'); if (old) old.remove();
  var top = document.getElementById('app'); if (!top) return;
  top.insertAdjacentHTML('afterbegin', '<div class="' + (kind === 'warn' ? 'warn' : 'note') + '" id="flashNote" style="margin:0 0 12px;">' + esc(text) + '</div>');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (!keep) setTimeout(function(){ var n = document.getElementById('flashNote'); if (n) n.remove(); }, 5000);
}

/* printing / «save as PDF» (Dentally offers the plan as a PDF): open the folded lists first so nothing is lost */
window.onbeforeprint = function(){ document.querySelectorAll('details').forEach(function(d){ d.open = true; }); };

/* ── Boot ── */
(async function boot(){
  var m = (location.search || '').match(/[?&]t=([0-9a-fA-F]{64})/);
  TOKEN = m ? m[1].toLowerCase() : null;
  if (!TOKEN) { screenDead('الرابط غير صالح', STATUS_MSG.unavailable, '🔗'); return; }
  /* v618: a weak mobile link — say so after 6s instead of a silent spinner */
  var slowT = setTimeout(function(){ var a = document.getElementById('app'); if (a && a.querySelector('.spin')) a.insertAdjacentHTML('beforeend', '<p class="sub center" id="slowNote">الاتصال بطيء — لحظات من فضلك…</p>'); }, 6000);
  try {
    if (!sb) throw new Error('vendor');
    var res = await withTimeout(sb.rpc('portal_info', { p_token: TOKEN }), 25000);
    clearTimeout(slowT);
    if (res.error) throw res.error;
    var row = res.data;
    if (!row || typeof row !== 'object') { screenDead('الرابط غير متاح', STATUS_MSG.unavailable, '🔗'); return; }
    INFO = row;
    document.title = 'بوابة المريض — ' + (row.clinic_name || '');
    if (row.status === 'expired') { screenDead('انتهت صلاحية الرابط', STATUS_MSG.expired, '⌛'); return; }
    if (row.status === 'revoked') { screenDead('الرابط موقوف', STATUS_MSG.revoked, '⛔'); return; }
    if (row.status !== 'ok') { screenDead('الرابط غير متاح', STATUS_MSG.unavailable, '🔗'); return; }
    screenPortal();
    loadXrays();   /* M193: ثانويّ — لا يؤخّر الصفحة */
  } catch (e) {
    clearTimeout(slowT);
    app('<div class="card center"><div class="big-icon">⚠️</div><h1>تعذّر التحميل</h1><p class="sub" style="margin-top:8px;">تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p>'
      + '<button type="button" class="btn btn-go" onclick="location.reload()">إعادة المحاولة</button></div>');
  }
})();
</script>
