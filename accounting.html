function renderSummaryCards(s, t, netProfit, profitMargin, adj, netRevenue, netProduction, collectionRate) {
  adj = adj || { chargeReductions: 0, refundsTotal: 0 };
  var netClass = netProfit >= 0 ? 'green' : 'red';
  var marginClass = (profitMargin === null) ? 'dim' : (profitMargin >= 0 ? 'green' : 'red');
  var cr = (typeof collectionRate === 'undefined') ? s.collectionRate : collectionRate;
  var collectionRateStr = (cr === null) ? '—' : fmtPctCard(cr);   /* v558 (#3) */
  var revSub  = (adj.refundsTotal > 0 && netRevenue >= 0)
    ? 'صافي بعد الاسترداد: ' + fmtSY(netRevenue)
    : 'مدفوعات مُخصّصة للإنتاج (cash basis)';
  var prodSub = (adj.chargeReductions > 0 && netProduction >= 0)
    ? 'صافي بعد الخصم: ' + fmtSY(netProduction)
    : 'الجلسات المكتملة في الفترة';
  var crSub = (cr === null) ? 'لا يوجد إنتاج'
            : pctOutOfRange(cr) ? 'تحصيلُ ذممٍ سابقة أكبرُ بكثير من إنتاج هذه الفترة — النسبة لا تعبّر عن أداء الفترة'
            : (adj.chargeReductions > 0 ? 'الإيراد ÷ صافي الإنتاج' : 'الإيراد ÷ الإنتاج');
  var netSub = (adj.refundsTotal > 0) ? 'صافي الإيراد − المصروفات' : 'الإيرادات − المصروفات';
  var marginSub = (profitMargin === null) ? 'لا يوجد إيراد'
                : pctOutOfRange(profitMargin) ? 'الإيرادُ ضئيلٌ جداً مقابل المصروفات — النسبة لا تعبّر عن أداء الفترة'
                : (adj.refundsTotal > 0 ? 'الصافي ÷ صافي الإيراد' : 'الصافي ÷ الإيراد');

  return '' +
    '<div class="summary-grid">' +
      // Revenue (cash collected, allocated) — gross; net shown in sub when refunds exist
      '<div class="card green">' +
        '<div class="label">💰 الإيرادات المحصّلة</div>' +
        '<div class="value">' + fmtSY(s.revenue) + '</div>' +
        '<div class="sub">' + revSub + '</div>' +
      '</div>' +
      // Production — gross; net (after discounts/write-offs) shown in sub when present
      '<div class="card blue">' +
        '<div class="label">💎 الإنتاج المنجز</div>' +
        '<div class="value">' + fmtSY(s.production) + '</div>' +
        '<div class="sub">' + prodSub + '</div>' +
      '</div>' +
      // Collection rate (collected ÷ net production)
      '<div class="card yellow">' +
        '<div class="label">📊 معدّل التحصيل</div>' +
        '<div class="value">' + collectionRateStr + '</div>' +
        '<div class="sub">' + crSub + '</div>' +
      '</div>' +
      // Total expenses
      '<div class="card red">' +
        '<div class="label">💸 المصروفات الإجمالية</div>' +
        '<div class="value">' + fmtSY(t.totalExpenses) + '</div>' +
        '<div class="sub">مصاريف + مدفوعات + مخابر</div>' +
      '</div>' +
      // Net profit (net revenue − expenses)
      '<div class="card ' + netClass + '">' +
        '<div class="label">' + (netProfit >= 0 ? '🟢 صافي الربح' : '🔴 صافي الخسارة') + '</div>' +
        '<div class="value">' + fmtSY(Math.abs(netProfit)) + '</div>' +

// ═══════════════════════════════════════════════════════════════════════════
// M126/M129 — الإجمالي الموحّد (للجرد فقط): سعرُ صرفٍ يدويّ خاصٌّ بالعيادة يُخزَّن
// في clinic_settings.usd_report_rate ويُستخدم حصراً لعرض مجموعٍ موحَّدٍ بعملةٍ واحدة
// أسفل طبقتَي العملة عند نشاطهما معاً — نمطُ الأدمن نفسه (Migration 105):
//   · لا يمسّ أي سعر علاج أو دفعة أو مصروف — الأرقام الأصلية بعملتها كما هي.
//   · يجمع مخرجاتِ الطبقتين الجاهزة (revenue / totalExpenses / netProfit) —
//     صفر استدعاء إضافي للمحرّك وصفر تعديل على أي معادلة.
//   · لا يظهر إلا عند نشاط العملتين معاً؛ عيادةُ العملة الواحدة لا ترى شيئاً.
//   · الرقم الموحّد لا يُغذّى للملخّص الذكي — قاعدةُ منع الجمع بين العملتين في
//     طبقة الـAI (buildDigestFactsAllLayers) تبقى مطلقة.
//
// 🔴 M129 — سعرٌ واحد باتجاهين، لا سعران: الطبيبُ يختار وحدةَ الإجمالي (ل.س أو $)
// والحسابُ ينقلب على السعر نفسه — ليرة: SYP + USD×السعر · دولار: USD + SYP÷السعر.
// وحقلُ الإدخال يبقى واحداً («1 دولار = كم ليرة؟») بالوضعين عمداً: سعرٌ ثانٍ مستقلّ
// كان سيسمح بانحرافٍ صامت ($1=13000 بينما 1ل.س=1/14000) وهو رقمٌ صحيحُ الشكل
// كاذبُ المعنى. والافتراضُ بغياب اختيارٍ صريح هو عملةُ العيادة لا الليرةُ المثبَّتة
// (سابقة v200): عيادةُ الدولار كانت مقفولةً على وحدةٍ ليست وحدتها.
// ═══════════════════════════════════════════════════════════════════════════
// عملةُ الإجمالي الفعّالة: المختارُ صراحةً، وإلا عملةُ العيادة، وإلا الليرة.
function _accUnifyCurEff() {
  if (ACC_UNIFY_CUR === 'USD' || ACC_UNIFY_CUR === 'SYP') return ACC_UNIFY_CUR;
  try {
    return (window.SyDentCurrency && window.SyDentCurrency.code() === 'USD') ? 'USD' : 'SYP';
  } catch (e) { return 'SYP'; }
}
// تحويلٌ عرضيّ باتجاهٍ واحدٍ لكل وضع — بسعرٍ موجبٍ محقَّقٍ عند نقطة النداء.
function _accToUnified(sypVal, usdVal, rate, cur) {
  return (cur === 'USD') ? (usdVal + sypVal / rate) : (sypVal + usdVal * rate);
}
function _accFmtUnified(n, cur) {
  var v = Math.round(Number(n) * 100) / 100;
  var st = (v % 1 === 0)
    ? Math.round(v).toLocaleString('en-US')
    : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return st + (cur === 'USD' ? ' $' : ' ل.س');
}
// مبدّلُ وحدة الإجمالي — نصوصٌ ثابتة حرفياً بلا أي إقحامٍ لمُدخَل (صفر سطح XSS).
function _accUnifySeg(cur) {
  function opt(c, lbl) {
    var on = (cur === c);
    return '<button type="button" role="radio" aria-checked="' + (on ? 'true' : 'false') + '" ' +
      'onclick="setAccUnifyCur(\'' + c + '\')" ' +
      'style="padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;' +
      'font-family:\'Cairo\', sans-serif;' +
      'font-weight:' + (on ? '800' : '600') + ';' +
      'border:1px solid ' + (on ? 'var(--purple)' : 'var(--border)') + ';' +
      'background:' + (on ? 'rgba(139,92,246,0.18)' : 'var(--bg3)') + ';' +
      'color:' + (on ? 'var(--purple)' : 'var(--text2,#8aa3b8)') + ';">' + lbl + '</button>';
  }
  return '<div role="radiogroup" aria-label="عملة الإجمالي الموحّد" style="display:inline-flex;gap:6px;">' +
    opt('SYP', 'ل.س') + opt('USD', '$') + '</div>';
}
function renderUnifiedReportCard(layers, act) {
  if (!act || act.length < 2) return '';   // عملة واحدة نشطة — لا توحيد ولا بطاقة
  var S = layers.SYP, U = layers.USD;
  if (!S || !U) return '';
  var rate = (isFinite(ACC_USD_RATE) && ACC_USD_RATE > 0) ? ACC_USD_RATE : 0;
  var uCur = _accUnifyCurEff();
  var body;
  if (rate > 0) {
    var uRev = _accToUnified(S.summary.revenue,      U.summary.revenue,      rate, uCur);
    var uExp = _accToUnified(S.totals.totalExpenses, U.totals.totalExpenses, rate, uCur);
    var uNet = _accToUnified(S.netProfit,            U.netProfit,            rate, uCur);
    // مجموع الاستردادات موحَّداً — الصافي محسوبٌ من صافي الإيراد (الإجمالي ناقص
    // الاسترداد) بينما المعروض أعلاه هو الإجمالي، تماماً كبطاقات الطبقة الواحدة.
    // فلولا هذا السطر يطرح الطبيبُ الرقمين وقتَ الجرد فيجد فرقاً بلا تفسير —
    // وهو نفس عقد revSub ببطاقة الإيرادات: الرقم الصحيح الذي يُقرأ خطأً خطأٌ.
    var uRefunds = _accToUnified(S.adj.refundsTotal, U.adj.refundsTotal, rate, uCur);
    var revSubU = (uRefunds > 0)
      ? '<div style="font-size:11px;color:var(--text2,#8aa3b8);margin-top:2px;">صافي بعد الاسترداد: ' + _accFmtUnified(uRev - uRefunds, uCur) + '</div>'
      : '';
    var netColor = uNet >= 0 ? 'var(--green)' : 'var(--red)';
    body =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px;">' +
        '<div><div style="font-size:12px;color:var(--text2,#8aa3b8);">💰 الإيرادات الموحّدة</div>' +
          '<div style="font-size:18px;font-weight:800;">' + _accFmtUnified(uRev, uCur) + '</div>' + revSubU + '</div>' +
        '<div><div style="font-size:12px;color:var(--text2,#8aa3b8);">💸 المصروفات الموحّدة</div>' +
          '<div style="font-size:18px;font-weight:800;">' + _accFmtUnified(uExp, uCur) + '</div></div>' +
        '<div><div style="font-size:12px;color:var(--text2,#8aa3b8);">📈 صافي الربح الموحّد</div>' +
          '<div style="font-size:18px;font-weight:800;color:' + netColor + ';">' + _accFmtUnified(uNet, uCur) + '</div></div>' +
      '</div>' +
      // سطرُ السعر بيانٌ عن السعر نفسه لا عن الإجمالي، فيبقى بصيغته الليرية
      // بالوضعين — هو السعرُ الواحد الذي ينقلب عليه الاتجاهان.
      '<div style="font-size:12px;color:var(--text2,#8aa3b8);margin-top:10px;">$1 = ' + _accFmtUnified(rate, 'SYP') + ' (سعر التقارير)</div>';
  } else {
    body = '<div style="font-size:13px;color:var(--yellow);margin-top:12px;">⚠️ حسابك يحوي حركة بالليرة والدولار معاً — اضبط سعر الصرف أدناه لرؤية المجموع الموحّد.</div>';
  }
  return '' +
    '<div class="section" id="accUnifiedCard">' +
      '<h2>🔗 الإجمالي الموحّد — ' + (uCur === 'USD' ? 'بالدولار' : 'بالليرة') + ' <span class="count">للجرد فقط</span></h2>' +
      '<div style="padding:14px 16px;background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.25);border-radius:12px;">' +
        '<div style="font-size:13px;color:var(--text2,#8aa3b8);line-height:1.6;">' +
          'تجميعٌ عرضيّ لطبقتَي الليرة والدولار بسعر صرفٍ تُدخله يدوياً. ' +
          '<strong style="color:var(--purple);">للتقارير والجرد فقط</strong> — لا يمسّ أي دفعة أو سعر أو مصروف مسجَّل، وكل طبقة أعلاه تبقى بعملتها كما هي.' +
        '</div>' +
        body +
        '<div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;">' +
          '<label style="font-size:13px;white-space:nowrap;">عملة الإجمالي</label>' +
          _accUnifySeg(uCur) +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">' +
          '<label for="accUsdRateInput" style="font-size:13px;white-space:nowrap;">1 دولار = كم ليرة؟</label>' +
          '<input type="number" id="accUsdRateInput" min="0" step="any" autocomplete="off" placeholder="مثلاً 15000" value="' + (rate > 0 ? rate : '') + '" ' +
            'style="width:140px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:\'Cairo\', sans-serif;font-size:13px;">' +
          '<button type="button" id="btnAccSaveUsdRate" onclick="saveAccUsdRate()" class="btn-apply">💾 حفظ السعر</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
async function saveAccUsdRate() {
  if (_accRateSaveInFlight) return;
  if (!window.sb || !currentUser) { if (window.showToast) showToast('الجلسة غير جاهزة — أعد تحميل الصفحة', true); return; }
  var inp = document.getElementById('accUsdRateInput');
  var btn = document.getElementById('btnAccSaveUsdRate');
  if (!inp) return;
  var val = String(inp.value || '').trim();
  var n = null;
  if (val !== '') {
    n = Number(val);
    if (!isFinite(n) || n <= 0) {
      if (window.showToast) showToast('سعر الصرف يجب أن يكون رقماً أكبر من صفر، أو اتركه فارغاً لإلغائه', true);
      return;
    }
  }
  _accRateSaveInFlight = true;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...'; }
  try {
    // نمط settings.html الحرفي: upsert على صف المالك (onConflict: owner_id).
    var payload = { owner_id: currentUser.id, usd_report_rate: n, updated_at: new Date().toISOString() };
    var res = await window.sb.from('clinic_settings').upsert(payload, { onConflict: 'owner_id' });
    if (res.error) {
      if (window.showToast) showToast('فشل الحفظ: ' + (res.error.message || ''), true);
      return;
    }
    ACC_USD_RATE = (n !== null && n > 0) ? n : null;
    if (window.showToast) showToast(n !== null ? '✅ تم حفظ سعر صرف التقارير' : 'أُلغي سعر الصرف');
    // تحديثٌ بالمكان لا إعادةَ رسمٍ كاملة: render() تُصفّر lastDigest عمداً (ملخّصٌ
    // قديم فوق أرقام جديدة أسوأ من لا ملخّص — عقد v143)، لكن ذلك عقدُ *تغيّر
    // البيانات*؛ وهنا لم تتغيّر جلسةٌ ولا دفعة، بل رقمُ عرضٍ وحده. وإسقاطُ ملخّصٍ
    // مولَّدٍ يكلّف الطبيب نداءَ AI ثانياً من سقفه الشهري بلا سبب.
    _accRepaintUnifiedCard();
  } catch (ex) {
    if (window.showToast) showToast('خطأ غير متوقع: ' + (ex && ex.message ? ex.message : String(ex)), true);
  } finally {
    _accRateSaveInFlight = false;
    var b2 = document.getElementById('btnAccSaveUsdRate');
    if (b2) { b2.disabled = false; b2.textContent = '💾 حفظ السعر'; }
  }
}
// تحديثٌ بالمكان معلَّقٌ بالغلاف المُعرَّف لا بالموضع (عقد v193): مصدرٌ واحدٌ
// يخدم مساري الحفظ معاً فيستحيل أن ينحرف أحدهما عن الآخر.
function _accRepaintUnifiedCard() {
  var _uc = document.getElementById('accUnifiedCard');
  if (_uc) {
    var _L = computeLayersByCurrency();
    _uc.outerHTML = renderUnifiedReportCard(_L, _L._active);
  } else {
    var _f = $('fromDate'), _t = $('toDate');
    if (_f && _t && !_blocked()) render(_f.value, _t.value);  // ارتداد دفاعي (null-safe — F2)
  }
}
// M129: اختيارُ وحدة الإجمالي الموحّد. كتابةُ عمودِ عرضٍ وحده — صفر مبلغ بالحمولة
// وصفر مساسٍ بأي صفٍّ ماليّ؛ والقيمةُ enum مغلق يفرضه قيدُ القاعدة كذلك.
async function setAccUnifyCur(cur) {
  var n = (cur === 'USD') ? 'USD' : 'SYP';
  if (n === _accUnifyCurEff()) return;              // نفسُ الوضع — صفر نداء وصفر رسم
  if (_accUnifySaveInFlight) return;
  if (!window.sb || !currentUser) { if (window.showToast) showToast('الجلسة غير جاهزة — أعد تحميل الصفحة', true); return; }
  _accUnifySaveInFlight = true;
  try {
    // نمط settings.html الحرفي: upsert على صف المالك (onConflict: owner_id).
    var payload = { owner_id: currentUser.id, report_unify_currency: n, updated_at: new Date().toISOString() };
    var res = await window.sb.from('clinic_settings').upsert(payload, { onConflict: 'owner_id' });
    if (res.error) {
      if (window.showToast) showToast('فشل حفظ عملة الإجمالي: ' + (res.error.message || ''), true);
      return;                                        // الحالةُ لم تُلمس ⇒ لا شيء يُرجَّع
    }
    // 🔴 الإسنادُ بعد تأكيد الكتابة حصراً — لا قبلها ولا بتفاؤل: واجهةٌ تعرض ما ليس
    // محفوظاً أسوأ من واجهةٍ تنتظر (ثابت v211). وبهذا يستحيل وجودُ حالةٍ تحتاج
    // ترجيعاً، فلا سطرَ ترجيعٍ ميتاً يوهم قارئَه بحمايةٍ لا يقدّمها.
    ACC_UNIFY_CUR = n;
    if (window.showToast) showToast(n === 'USD' ? '✅ الإجمالي الموحّد بالدولار' : '✅ الإجمالي الموحّد بالليرة');
  } catch (ex) {
    if (window.showToast) showToast('خطأ غير متوقع: ' + (ex && ex.message ? ex.message : String(ex)), true);
  } finally {
    _accUnifySaveInFlight = false;
    _accRepaintUnifiedCard();
  }
}

// ═══ v509: الاتجاهُ الشهري — الإنتاجُ مقابل التحصيل، آخرُ 12 شهراً (Curve «Production vs Collections by month») ═══

      (stRs[j].data || []).forEach(function (row) { tStatuses[row.id] = row.status || 'completed'; });

// يُعيد صفوفَ الأشهر لطبقة عملة — بتبديل السياق على دوالّ الصفحة نفسها ثم إرجاعه.
function computeTrend(cur) {
  if (!trendData) return null;
  var keep = { sessions: sessions, payments: payments, paymentSplits: paymentSplits, splitSessionStatus: splitSessionStatus, adjustments: adjustments };
  var rows = [];
  try {
    var td = trendData;
    var inM = function (r, m) { var d = String(r.date || '').slice(0, 10); return d >= m.from && d <= m.to; };
    td.months.forEach(function (m) {
      sessions = td.sessions.filter(function (r) { return _rowCur(r) === cur && inM(r, m); });
      payments = td.payments.filter(function (r) { return _rowCur(r) === cur && inM(r, m); });
      var pidSet = {}; payments.forEach(function (p) { pidSet[p.id] = true; });
      paymentSplits = td.splits.filter(function (sp) { return _rowCur(sp) === cur && pidSet[sp.payment_id]; });
      splitSessionStatus = td.statuses;
      adjustments = td.adjustments.filter(function (r) { return _rowCur(r) === cur && inM(r, m); });
      var s = computeSummary(), adj = computeAdjustmentTotals();
      var netProduction = s.production - adj.chargeReductions;
      rows.push({ ym: m.ym, label: m.label, production: s.production, revenue: s.revenue, netProduction: netProduction,
                  collectionRate: (netProduction > 0) ? (s.revenue / netProduction) * 100 : null });
    });

}
function renderTrendSection(cur) {

  var goal = (TREND_GOALS && TREND_GOALS[cur] > 0) ? TREND_GOALS[cur] : null;   // v521: خطُّ الهدف (M159)
  var max = goal || 0; rows.forEach(function (r) { max = Math.max(max, r.production, r.revenue); });
  var W = 720, H = 220, padL = 8, padR = 8, padT = 14, padB = 26, n = rows.length;

  return '<details class="section tr-section" data-tr-cur="' + escapeHtml(cur) + '">' +

    '<div class="tr-legend"><span><i style="background:var(--blue)"></i>الإنتاج المنجز</span><span><i style="background:var(--green)"></i>الإيرادات المحصّلة</span>' +

    try { _dsQ = new URLSearchParams(window.location.search || '').get('ds') || ''; } catch (e) { _dsQ = ''; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(_dsQ)) _dsQ = '';
    window.SyDentDaySheet.mount(host, window.sb, currentUser.id, dsFmt).then(function () {
      if (!_dsQ) return;
      return window.SyDentDaySheet.pick(_dsQ).then(function () { try { host.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} });
    }).catch(function (e) { console.warn('daysheet (non-critical):', e); });
  } catch (e) { console.warn('daysheet (non-critical):', e); }
}

// v507: تقادمُ ذمم المرضى — المحرّك بـacc-aging.js (مرآةُ رصيد اللوحة، بلا كتابة).
async function loadAging() {
  agingResult = null;
  try {
    if (!window.SyDentAging || !currentUser) return;
    var r = await window.SyDentAging.load(window.sb, currentUser.id);
    if (r && r.ok) agingResult = window.SyDentAging.compute(r.data, todayISO());
  } catch (e) { console.warn('loadAging (non-critical):', e); agingResult = null; }
}
function renderAgingSection(cur) {
  if (!agingResult || !window.SyDentAging) return '';   // فشلٌ/غياب ⇒ لا شيء، ولا أثر على أي رقم آخر
  return window.SyDentAging.renderSection(agingResult[cur], cur, fmtSY);
}

function renderUnearnedSection(s) {
  if (s.unearnedTotal <= 0) return '';
  return '' +
    '<div class="section" style="border-color:var(--yellow-bd);">' +
      '<h2 style="color:var(--yellow-ink);">💳 رصيد مدفوعات مقدّمة (غير مُكتسَب)</h2>' +
      '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">' +
        '<div style="font-size:24px;font-weight:700;color:var(--yellow);">' + fmtSY(s.unearnedTotal) + '</div>' +
        '<div style="font-size:12px;color:var(--text2);line-height:1.6;flex:1;min-width:200px;">' +
          'مدفوعات استلمتها العيادة في هذه الفترة لكن لم تُخصَّص لإنتاج بعد ' +
          '(prepayments / credits). محاسبياً هذه التزام على العيادة، وليست إيراداً. ' +
          'تظهر هنا للشفافية ولا تدخل في صافي الربح.' +
        '</div>' +
      '</div>' +
    '</div>';
}

// ─── Debug panel ───────────────────────────────────────────────────────────
function toggleDebugPanel() {
  var p = $('debugPanel');
  p.classList.toggle('show');
  if (p.classList.contains('show')) refreshDebugPanel();
}

function refreshDebugPanel() {
  if (!$('debugPanel').classList.contains('show')) return;
  if (!lastIdentities) return;
  var html = '';
  lastIdentities.forEach(function(t){
    var cls = t.pass ? 'pass' : 'fail';
    var icon = t.pass ? '✓' : '✗';
    html += '<div class="row"><span class="' + cls + '">' + icon + ' ' + escapeHtml(t.name) + '</span></div>';
    html += '<div class="row" style="font-size:10px;color:var(--text3);padding-right:14px;">' + escapeHtml(t.detail) + '</div>';
  });
  $('debugBody').innerHTML = html;
}

// ─── Boot ──────────────────────────────────────────────────────────────────
// زر hamburger للـ page-header (Phase 7.6H follow-up: live test كشف أن
// accounting.html ينقصها hamburger. الصفحة تستعمل .page-header بدلاً من
// .topbar، لذا تطلّب canonical pattern معدّل: querySelector('.page-header').
// كل صفحات tenant الأخرى تستعمل .topbar — لكن accounting.html design مختلف.)
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.createElement('button');
  btn.className = 'sb-hamburger';
  btn.id = 'sbHamburgerBtn';
  btn.setAttribute('aria-label', 'القائمة');
  btn.innerHTML = '<span></span><span></span><span></span>';
  btn.onclick = function() { window.sbToggle(); };
  window._sbBtn = btn;
  var header = document.querySelector('.page-header');
  if (header) header.insertBefore(btn, header.firstChild);
});

init();
