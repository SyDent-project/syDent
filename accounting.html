<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="https://js-de.sentry-cdn.com/6cdd92ae975b03d5b4b86e0406b91ebc.min.js" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SyDent">
<meta name="theme-color" content="#0d8577">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>SyDent — المحاسبة</title>
<!-- Theme system: MUST load before inline <style> to apply data-theme synchronously and prevent FOUC. -->
<script src="theme.js?v=20261002d"></script>
<style>
:root {
  --bg:        #0a1628;
  --bg2:       #0f2038;
  --bg3:       #132840;
  --border:    rgba(var(--green-rgb),0.15);
  --green-dim: rgba(var(--green-rgb),0.12);
  --red:       #ef5350;
  --red-dim:   rgba(239,83,80,0.12);
  --yellow:    #f5c842;
  --yellow-dim:rgba(245,200,66,0.12);
  --blue:      #63b3ed;
  --blue-dim:  rgba(99,179,237,0.12);
  --orange:    #ffa726;
  --purple:    #a78bfa;
  --text:      #e7eef9;
  --text2:     #8da0bd;
  --text3:     #5d748f;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; }
body { min-height: 100vh; }

.main {
  margin-right: var(--sb-width, 240px);
  min-height: 100vh;
  padding: 24px 28px;
  transition: margin-right 0.25s ease;
}
@media (max-width: 820px) {
  .main { margin-right: 0; padding: 16px 14px; }
}

/* ─── Header ─── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
}
.page-header h1 { margin: 0; font-size: 24px; font-weight: 700; }
.page-header > div:first-of-type { flex: 1; min-width: 0; }
.page-header .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ─── Filter bar ─── */
.filter-bar {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 18px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text2); font-weight: 500; }
.field input[type="date"], .field input.sy-df-in {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: 8px;
  font-family: 'Cairo', sans-serif; font-size: 13px;
}
.field input:focus { outline: 1px solid var(--green); }

.quick-btns { display: flex; gap: 6px; }
.qb {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 7px 12px; border-radius: 8px;
  font-family: 'Cairo', sans-serif; font-size: 13px; cursor: pointer;
  transition: all 0.15s;
}
.qb:hover { background: var(--green-dim); border-color: var(--green); }
.qb.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

.btn-apply {
  background: var(--green); color: #001a0d; border: 0;
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 13px;
}
.btn-apply:hover { filter: brightness(1.1); }
.btn-apply:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }

/* ─── Summary cards ─── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.card .label {
  font-size: 12px; color: var(--text2); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.card .value {
  font-size: 22px; font-weight: 700; margin-top: 8px;
  letter-spacing: -0.3px;
}
.card .sub {
  font-size: 11px; color: var(--text3); margin-top: 4px;
}
.card.green .value { color: var(--green); }
.card.red .value { color: var(--red); }
.card.yellow .value { color: var(--yellow); }
.card.blue .value { color: var(--blue); }
.card.dim .value { color: var(--text); }

/* ─── Section ─── */
.section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 18px;
}
.section h2 {
  margin: 0 0 14px 0; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.section h2 .count {
  background: var(--bg3); color: var(--text2);
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  font-weight: 500;
}

/* ─── v507: تقادم ذمم المرضى ─── */
.ag-buckets { display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:10px; margin-bottom:12px; }
.ag-bucket { background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
.ag-bucket .ag-lbl { font-size:11px; color:var(--text2); }
.ag-bucket .ag-val { font-size:16px; font-weight:800; margin-top:4px; white-space:nowrap; }
.ag-bucket .ag-sub { font-size:11px; color:var(--text3); margin-top:2px; }
.ag-total { border-color:var(--yellow-bd); background:var(--yellow-dim); }
.ag-total .ag-val { color:var(--yellow-ink); }
.ag-b2 .ag-val { color:var(--yellow-ink); }
.ag-b3 { border-color:var(--red-bd); }
.ag-b3 .ag-val { color:var(--red-ink); }
.ag-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.ag-chip { border:1px solid var(--border); background:var(--bg3); color:var(--text); border-radius:20px; padding:4px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
.ag-chip.active { background:var(--green); color:#fff; border-color:var(--green); }
.ag-table td.num { white-space:nowrap; }   /* المبلغُ ورمزُ عملته سطرٌ واحد (لقطةُ الفحص: كان ينكسر «2,925,000 / ل.س») */
.ag-table td:first-child { min-width:130px; }
.ag-link { color:var(--text); text-decoration:none; } .ag-link:hover { color:var(--green); text-decoration:underline; }
.ag-table td.ag-strong { font-weight:800; }
.ag-table td.ag-zero { color:var(--text3); }
.ag-table td.ag-c2 { color:var(--yellow-ink); font-weight:700; }
.ag-table td.ag-c3 { color:var(--red-ink); font-weight:700; }
.ag-plan { color:var(--red-ink); font-size:12px; }
.ag-credits { margin-top:12px; }
.ag-credits summary { cursor:pointer; font-weight:700; color:var(--green); }
.ag-note { font-size:12px; color:var(--text2); line-height:1.6; margin-top:10px; }
@media (max-width: 700px) { .ag-buckets { grid-template-columns: repeat(2, minmax(0,1fr)); } .ag-total { grid-column: 1 / -1; } }

/* ─── v509: الاتجاه الشهري ─── */
.tr-section summary { cursor:pointer; list-style:none; }
.tr-section summary::-webkit-details-marker { display:none; }
.tr-section summary h2 { display:inline-block; margin:0; }
.tr-section summary h2::before { content:'◂ '; color:var(--text3); font-size:14px; }
.tr-section[open] summary h2::before { content:'▾ '; }
.tr-section[open] summary { margin-bottom:10px; }
.tr-chart { width:100%; min-width:560px; height:auto; display:block; margin:6px 0 4px; }
.tr-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text2); margin-bottom:6px; }
.tr-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-inline-end:5px; vertical-align:middle; }
.tr-table td.tr-rate { white-space:nowrap; }
.tr-table td.tr-low { color:var(--red-ink); }
.tr-table td.tr-hit { color:var(--green); font-weight:700; }   /* v521: شهرٌ بلغ الهدف */
.tr-legend i.tr-goal-key { height:0; border-top:2px dashed var(--orange); border-radius:0; }
.tr-note { font-size:12px; color:var(--text2); line-height:1.6; margin-top:8px; }

/* ─── v508: كشف اليوم ─── */
.ds-section { margin-bottom: 18px; }
.ds-head-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.ds-head-row h2 { margin:0; }
.ds-ctl { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.ds-ctl input[type="date"], .ds-ctl input.sy-df-in { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; font-family:inherit; font-size:13px; }
.ds-qb { border:1px solid var(--border); background:var(--bg3); color:var(--text); border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
.ds-qb:hover { background:var(--green-dim); border-color:var(--green); }
.ds-cards { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; margin:12px 0; }
.ds-card { background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
.ds-card .ds-lbl { font-size:11px; color:var(--text2); }
.ds-card .ds-val { font-size:17px; font-weight:800; margin-top:4px; white-space:nowrap; }
.ds-card .ds-note { font-size:11px; color:var(--text3); margin-top:2px; line-height:1.5; }
.ds-blue .ds-val { color:var(--blue); } .ds-green .ds-val { color:var(--green); } .ds-red .ds-val { color:var(--red-ink); } .ds-yellow { border-color:var(--yellow-bd); background:var(--yellow-dim); } .ds-yellow .ds-val { color:var(--yellow-ink); }
table.providers.ds-table { min-width:0; }   /* الكشفُ عمودان فيلائم عرضَ الهاتف بلا تمرير (لقطةُ الفحص: كانت المبالغ مقصوصة) */
.ds-table td:first-child { white-space:normal; word-break:break-word; }
.ds-table td.num { white-space:nowrap; width:1%; }
.ds-table tr.ds-head td { background:var(--bg3); font-weight:700; }
.ds-table tr.ds-m2 td { color:var(--text2); font-size:12px; }
.ds-table tr.ds-total td { font-weight:800; border-top:2px solid var(--border); }
.ds-table tr.ds-cash td { color:var(--yellow-ink); }
.ds-table td.ds-empty, .ds-empty { color:var(--text3); padding:10px; }
.ds-sub { font-size:11px; color:var(--text3); font-weight:400; }
.ds-curhead { font-weight:800; margin:14px 0 4px; color:var(--text2); }
.ds-note-foot { font-size:12px; color:var(--text2); line-height:1.6; margin-top:10px; }
/* M158: إقفال الصندوق */
.ds-close { margin-top:12px; border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--bg3); }
.ds-close-head { font-weight:800; margin-bottom:8px; }
.ds-close-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; }
.ds-val-s { font-weight:800; font-size:15px; white-space:nowrap; }
.ds-var-ok { color:var(--green); } .ds-var-over { color:var(--yellow-ink); } .ds-var-short { color:var(--red-ink); }
.ds-close-note { font-size:12px; color:var(--text2); margin-top:8px; }
.ds-close-warn { font-size:12px; color:var(--yellow-ink); margin-top:8px; }
.ds-close-row { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr) auto; gap:8px; align-items:end; }
.ds-close-row label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text2); min-width:0; }
.ds-close-row input { background:var(--bg2, var(--bg)); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 9px; font-family:inherit; font-size:14px; min-width:0; width:100%; box-sizing:border-box; }
.ds-close-btn { background:var(--green); color:#fff; border-color:var(--green); padding:8px 16px; white-space:nowrap; }
.ds-close .ds-noprint { margin-top:8px; }
@media (max-width: 700px) { .ds-cards { grid-template-columns: repeat(2, minmax(0,1fr)); } .ds-close-row { grid-template-columns: minmax(0,1fr); } .ds-close-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }

/* ─── فاصل المعلومات التكميلية ─── */
.supp-head {
  margin: 30px 0 16px; padding-top: 20px;
  border-top: 1px dashed var(--border);
}
.supp-head .ttl {
  font-size: 15px; font-weight: 700; color: var(--text2);
  margin-bottom: 6px;
}
.supp-head .sub {
  font-size: 12px; color: var(--text2); line-height: 1.6; opacity: .85;
}

/* ─── AI digest (بند #8 — الملخّص الذكي للفترة) ─── */
.digest-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.digest-btn {
  background: var(--green); color: #062018;
  border: none; border-radius: 8px;
  padding: 8px 16px; font-size: 13px; font-weight: 700;
  font-family: 'Cairo', sans-serif; cursor: pointer;
  transition: opacity .15s;
}
.digest-btn:hover { opacity: .88; }
.digest-btn:disabled { opacity: .55; cursor: default; }
.digest-hint { font-size: 11.5px; color: var(--text3); margin-top: 10px; line-height: 1.8; }
.digest-out {
  margin-top: 14px; padding: 14px 16px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13.5px; line-height: 2.05; color: var(--text);
  white-space: pre-wrap;
}
.digest-out.err { color: var(--red); }
.digest-warn {
  margin-top: 14px; padding: 9px 12px;
  background: var(--orange-soft); border: 1px solid var(--orange-bd);   /* v375: unified tokens */
  border-radius: 10px;
  font-size: 12px; font-weight: 700; line-height: 1.8; color: var(--orange-ink);
  white-space: pre-wrap;
}

/* ─── Warning banner ─── */
.warn-banner {
  background: var(--yellow-soft);
  border: 1px solid var(--yellow-bd);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--yellow-ink);
  font-size: 12px;
  margin-bottom: 14px;
  display: flex; align-items: flex-start; gap: 8px;
  line-height: 1.6;
}
.warn-banner .ico { font-size: 16px; flex-shrink: 0; }
.warn-banner b { color: var(--yellow-ink); }

/* ─── Expense breakdown rows ─── */
.exp-row {
  display: grid;
  grid-template-columns: 24px 1fr 110px 60px;
  gap: 10px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.exp-row:last-child { border-bottom: 0; }
.exp-row .ico { font-size: 18px; text-align: center; }
.exp-row .name {
  font-size: 13px; display: flex; align-items: center; gap: 6px;
}
.exp-row .name .warn-chip {
  background: var(--yellow-bg);
  color: var(--yellow-ink);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 8px;
  border: 1px solid var(--yellow-bd);
}
.exp-row .amt {
  font-size: 13px; text-align: left; font-variant-numeric: tabular-nums;
}
.exp-row .pct {
  font-size: 12px; color: var(--text2); text-align: left;
  font-variant-numeric: tabular-nums;
}
.exp-row .bar-track {
  grid-column: 2 / 5;
  height: 4px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
/* v298: press feedback */
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .6; cursor: wait; }
.exp-row .bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width 0.3s;
}

.exp-total {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.exp-total .lbl { font-weight: 600; font-size: 14px; }
.exp-total .val { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }

/* ─── Provider table ─── */
.tbl-wrap { overflow-x: auto; }
table.providers {
  width: 100%; border-collapse: collapse; font-size: 13px;
  min-width: 700px;
}
table.providers th, table.providers td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: right;
}
table.providers th {
  color: var(--text2); font-weight: 600; font-size: 12px; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
table.providers td.num, table.providers th.num {
  font-variant-numeric: tabular-nums; text-align: left;   /* v513: رأسُ العمود الرقمي يُحاذي أرقامَه (لقطة المالك: الرؤوسُ كانت يميناً والأرقامُ يساراً) */
}
table.providers tr:hover td { background: var(--bg3); }
@media (max-width:820px){
  table.providers { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap; }
}
/* DeepCode #9 (v562): على الهاتف كانت جداول المحاسبة الستّ (الأطباء · الاتجاه الشهري · أعمار الذمم…) بعرض 700px تُمرَّر
   أفقياً داخل 320px — تصير بطاقات: الخليةُ الأولى عنوانُ البطاقة، وكلُّ خليةٍ بعدها سطرٌ «اسمُ العمود … القيمة»
   (data-label من رأس الجدول — accLabelCells). كشفُ اليوم (عمودان) يبقى جدولاً. */
@media (max-width:640px){
  .tbl-wrap { overflow-x: visible; }
  table.providers.acc-mcards { min-width:0; display:block; white-space:normal; overflow:visible; }
  table.providers.acc-mcards thead { display:none; }
  table.providers.acc-mcards tbody, table.providers.acc-mcards tfoot { display:block; }
  table.providers.acc-mcards tr { display:block; background:var(--bg3); border:1px solid var(--border); border-radius:10px; margin:8px 0; padding:8px 12px; }
  table.providers.acc-mcards tr:hover td { background:transparent; }
  table.providers.acc-mcards td { display:flex; justify-content:space-between; align-items:baseline; gap:12px; border:none; padding:4px 0; text-align:left; min-width:0; }
  table.providers.acc-mcards td::before { content:attr(data-label); color:var(--text2); font-size:12px; font-weight:600; text-align:right; }
  table.providers.acc-mcards td:first-child { font-weight:800; font-size:14px; justify-content:flex-start; }
  table.providers.acc-mcards td:first-child::before { display:none; }
}

/* ملاحظات طريقة الاحتساب — مطوية افتراضياً (قرار المالك: كانت تزحم الشاشة).
   <details> أصلية: تعمل بلا JS وتفتح بالكيبورد وتطبع مفتوحة إن طلبها المتصفّح. */
.calc-note { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg3); }
.calc-note > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; font-size: 11.5px; font-weight: 600; color: var(--text2);
}
.calc-note > summary::-webkit-details-marker { display: none; }
.calc-note > summary::after { content: '▾'; margin-inline-start: auto; font-size: 13px; transition: transform .18s ease; }
.calc-note[open] > summary::after { transform: rotate(180deg); }
.calc-note > summary:hover { color: var(--text); }
.calc-note > summary:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; border-radius: 10px; }
.calc-note-body {
  padding: 10px 12px 11px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text2); line-height: 1.7;
}
@media (prefers-reduced-motion: reduce) { .calc-note > summary::after { transition: none; } }
.prov-name {
  display: flex; align-items: center; gap: 8px;
}
.prov-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.prov-name .badge {
  font-size: 10px; padding: 1px 5px;
  background: var(--gray-bg); color: var(--gray-fg);
  border: 1px solid var(--gray-bd);
  border-radius: 6px;
}
.net-pos { color: var(--green); font-weight: 600; }
.net-neg { color: var(--red); font-weight: 600; }

/* ─── Empty state ─── */
.empty {
  text-align: center; padding: 40px 20px; color: var(--text2);
}
.empty .icon { font-size: 36px; margin-bottom: 10px; }
.empty .ttl { font-size: 15px; margin-bottom: 6px; color: var(--text); }
.empty .sub { font-size: 12px; }

/* ─── Loading ─── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 60px 20px;
  color: var(--text2);
  font-size: 13px;
}
.loading .spinner {
  width: 18px; height: 18px; border: 2px solid var(--border);
  border-top-color: var(--green); border-radius: 50%;
  animation: spin 0.6s linear infinite; margin-left: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

    // الـAI أعلاه: لو غاب العمود لأي سبب يفشل هذا وحده والبوابة سليمة). عرض فقط.
    try {
      var csR = _accT(await _csRP);   /* v557 */
      // M129: عمودٌ غائب يُفشل الـselect كاملاً بـPostgREST ⇒ إعادةُ محاولةٍ بالعمود
      // القديم وحده، فيصل السعرُ وتبقى العملةُ على الافتراضي (سابقة SyDentCurrency.load).

    try {

    if (_blocked()) return;   // F2: body قد استُبدل أثناء الجلب — لا كتابة على عناصرٍ زالت

// Concurrency guard: when the Owner clicks Apply (or a quick-range button)
// repeatedly while a load is in flight, ignore subsequent calls. This avoids
// a race where the older async call's render() overwrites the newer one's
// loading state with stale data.
var _applyInFlight = false;
async function applyFilter() {
  if (_applyInFlight) return;
  var from = $('fromDate').value;
  var to   = $('toDate').value;
  if (!from || !to) {
    showToast('الرجاء تحديد الفترة', true);
    return;
  }
  if (from > to) {
    showToast('"من تاريخ" يجب أن يكون قبل "إلى تاريخ"', true);
    return;
  }

  _applyInFlight = true;
  var _ba = $('btnApply'); if (_ba) _ba.disabled = true;
  _setBody('<div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>');

  try {
    await loadAllInRange(from, to);
    if (_blocked()) return;   // F2: الحجب وقع أثناء الطيران — الشاشةُ للبوابة لا للتقرير
    render(from, to);
  } catch (e) {
    console.error('[accounting] applyFilter error:', e);
    _setBody('<div class="empty"><div class="icon">⚠️</div><div class="ttl">فشل تحميل البيانات</div><div class="sub">' + escapeHtml(e.message || 'غير معروف') + '</div></div>');
  } finally {
    _applyInFlight = false;
    var _bb = $('btnApply'); if (_bb) _bb.disabled = false;
  }
}

async function loadAllInRange(from, to) {
  // 5 parallel queries, then payment_splits sequentially (it depends on
  // the payments array). Each tolerates migration-missing gracefully so
  // a freshly-installed clinic still gets a usable (mostly-empty) report.
  await Promise.all([
    loadSessions(from, to),
    loadPayments(from, to),
    loadExpenses(from, to),
    loadPayouts(from, to),
    loadLabOrders(from, to),
    loadAdjustments(from, to),
    loadMaterialCost(from, to),
    loadLabPayable(),          // Migration 118: all-time عمداً — الذمة لا تتبع النافذة
    loadAging(),               // v507: تقادمُ ذمم المرضى — all-time كذلك، قراءةٌ محضة خارج كل المعادلات
    loadTrend(),               // v509: الاتجاهُ الشهري — آخرُ 12 شهراً، يُحمَّل مرةً ويُحسب بمعادلات الصفحة نفسها
    loadAppointmentStats(from, to)
  ]);

  // After payments load, fetch their splits (filtered by payment_id).
  await loadPaymentSplits(from, to);
}

// v547 (الفحص الشامل لجولة التقارير): حدُّ PostgREST 1000 صفّ للطلب — قراءاتُ الفترة كانت بطلبٍ واحد فتُقصّ بصمت
// فوق 1000 (سنةُ عيادةٍ مشغولة · الاتجاهُ 12 شهراً). هذا الجالب يصفّح بـorder('id').range ويرجع الشكلَ نفسَه
// { data, error } فيبقى كلُّ فرعِ خطأٍ/هجرةٍ مفقودة كما هو حرفياً (قاعدة #630 مُعمَّمةً على النوافذ).
async function _pagedAcc(build) {
  var PAGE = 1000, out = [], off = 0;
  for (;;) {
    var res = await build().order('id').range(off, off + PAGE - 1);
    if (res.error) return { data: null, error: res.error };
    var rows = res.data || [];
    out = out.concat(rows);
    if (rows.length < PAGE) break;
    off += PAGE;
  }
  return { data: out, error: null };
}

async function loadPaymentSplits(from, to) {
  // payment_splits: per-session/per-provider allocation of each payment.
  //
  // We filter by payment_id (the in-range payments we just loaded) rather
  // than by payment_date. Two reasons:
  //   1. payment_date can be NULL on legacy splits (when payment.date was
  //      empty at split-creation time) — PostgREST .gte/.lte exclude NULLs,
  //      so a payment-date filter would silently drop those rows.
  //   2. Filtering by payment_id is exact: every split's parent payment is
  //      already in our `payments` array (loaded by date), so this covers
  //      every split we care about for the period.
  //
  // Pre-Migration-3 fallback: empty array (raw payments serve as the source).
  paymentSplits = [];
  splitSessionStatus = {};
  splitsLoadFailed = false;
  if (!payments.length) return;
  try {
    var paymentIds = payments.map(function(p){ return p.id; });
    // F1: مقطَّعٌ بـ150 معرّفاً كما loadSplitSessionStatuses — نداءٌ واحد بكل معرّفات
    // فترةٍ طويلة كان يتجاوز حدَّ طول عنوان GET فيرجع خطأٌ لا يحمل اسم الجدول ⇒ كان
    // يُصنَّف «غير مفقود» ويُبتلع ⇒ ارتدادٌ صامت لمجموع الدفعات الخام (تضخيم إيراد).
    var CHUNK = 150, acc = [];
    for (var c = 0; c < paymentIds.length; c += CHUNK) {
      var res = await _pagedAcc(function(){ return window.sb.from('payment_splits')
        .select('payment_id, session_id, provider_id, amount, is_unearned, payment_date, currency')
        .eq('doctor_id', currentUser.id)
        .in('payment_id', paymentIds.slice(c, c + CHUNK)); });
      if (res.error) {
        var msg = (res.error.message || '').toLowerCase();
        var missing = res.error.code === '42P01' || res.error.code === 'PGRST205' ||
                      msg.indexOf('payment_splits') !== -1;
        if (missing) return;   // ما قبل Migration 3: الدفعاتُ الخام هي المصدر بالتصميم
        console.error('loadPaymentSplits:', res.error);
        splitsLoadFailed = true;   // يُعلَن بشريطٍ داخل التقرير (render) — لا صمت
        return;                    // مجموعةٌ ناقصة أسوأ من فارغة: الارتدادُ كاملٌ ومُعلَن
      }
      acc = acc.concat(res.data || []);
    }
    paymentSplits = acc;
    // Fetch the status of every session referenced by these splits so revenue can
    // exclude allocations sitting on planned (not-yet-done) sessions.
    await loadSplitSessionStatuses();
  } catch(e) {
    console.error('loadPaymentSplits threw:', e);
    paymentSplits = [];
    splitsLoadFailed = true;
  }
}

// Populate splitSessionStatus for every distinct session_id referenced by the
// loaded splits. Fetched independently of the in-range `sessions` array because a
// split's session may be completed-but-out-of-range (must still count as earned) or
// planned (must count as unearned) — neither is reliably present in `sessions`.
// Chunked to keep the PostgREST .in() URL within length limits.
async function loadSplitSessionStatuses() {
  var idSet = {};
  for (var i = 0; i < paymentSplits.length; i++) {
    var sid = paymentSplits[i].session_id;
    if (sid) idSet[sid] = true;
  }
  var ids = Object.keys(idSet);
  if (!ids.length) return;
  var CHUNK = 150;
  for (var c = 0; c < ids.length; c += CHUNK) {
    var slice = ids.slice(c, c + CHUNK);
    try {
      var res = await window.sb.from('ledger_sessions')
        .select('id, status')
        .eq('doctor_id', currentUser.id)
        .in('id', slice);
      if (res.error) {
        // On error, leave these ids unmapped. splitIsEarned() then treats them as
        // NOT-completed (conservative: avoids inflating revenue). A migration-missing
        // DB has no splits anyway, so this path is benign.
        if (!isMigrationMissing(res.error)) console.warn('loadSplitSessionStatuses:', res.error);
        continue;
      }
      (res.data || []).forEach(function(row){
        // Legacy sessions with empty/null status fold to 'completed' (system-wide convention).
        splitSessionStatus[row.id] = row.status || 'completed';
      });
    } catch(e) {
      console.warn('loadSplitSessionStatuses threw:', e);
    }
  }
}

// Canonical earned-split test (parity with patient-profile.html computeFinancials):
// a split is EARNED revenue only when it is not unearned AND it is allocated to a
// COMPLETED session. Non-unearned splits on planned sessions (or with no session_id)
// are treated as unearned credit — money received for work not yet done.
function splitIsEarned(sp) {
  if (!sp || sp.is_unearned) return false;
  return !!sp.session_id && splitSessionStatus[sp.session_id] === 'completed';
}

// P3-C1: تكلفة المواد المستهلكة في الفترة (تقديري — عرض فقط).
// = Σ (كمية الاستهلاك × سعر شراء الصنف) لحركات reason='consume'.
// معزولة تماماً: لا تدخل computeExpenseTotals ولا netProfit ولا اختبارات الهوية.
// graceful: لو جداول المخزون مفقودة (Migration 52/53 غير مشغّل) → 0 بلا كسر.
// ملاحظة: inventory_movements يستخدم created_at (timestamptz)، نفلتر بالنطاق
// عبر inLocalRange مثل بقية المصادر الزمنية.
async function loadMaterialCost(from, to) {
  materialCost = 0;
  materialCostBag = { SYP: 0, USD: 0 };
  try {
    // 1) أسعار الأصناف (id → purchase_price)
    var itemsRes = await _pagedAcc(function(){ return window.sb.from('inventory_items')
      .select('id, purchase_price, currency')
      .eq('owner_id', currentUser.id); });
    if (itemsRes.error || !itemsRes.data) return;  // graceful
    var priceById = {};
    itemsRes.data.forEach(function(it){ priceById[it.id] = { p: Number(it.purchase_price) || 0, cur: _rowCur(it) }; });

    // 2) حركات الاستهلاك: created_at من نوع TIMESTAMPTZ — نجلب نافذة UTC موسّعة (±يوم)
    //    ثم نقصّ محلياً بـ inLocalRange (نفس نمط loadPayouts/loadLabOrders). التقييد يمنع
    //    مسح كل حركات الاستهلاك مدى عمر العيادة؛ النتيجة الرقمية لا تتغيّر (الفلتر المحلي ذاته).
    var loUtc = widenStartUtc(from), hiUtc = widenEndUtc(to);
    var movRes = await _pagedAcc(function(){ return window.sb.from('inventory_movements')
      .select('item_id, change, reason, created_at')
      .eq('owner_id', currentUser.id)
      .eq('reason', 'consume')
      .gte('created_at', loUtc)
      .lte('created_at', hiUtc); });
    if (movRes.error || !movRes.data) return;  // graceful

    movRes.data.forEach(function(m){
      if (!inLocalRange(m.created_at, from, to)) return;
      var qty = Math.abs(Number(m.change) || 0);
      var it = priceById[m.item_id];
      if (!it) return;
      materialCostBag[it.cur] += qty * it.p;   // M125: التكلفة بعملة الصنف — صفر جمع عابر
    });
  } catch (e) {
    console.warn('loadMaterialCost (non-critical):', e);
    materialCost = 0;  // أي خطأ → 0، لا يؤثّر على أي رقم مالي آخر
    materialCostBag = { SYP: 0, USD: 0 };
  }
}

// Migration 118: ذمم المخابر — رصيد ميزانية all-time (لا يتبع نافذة الفترة عمداً:
// الذمة التزام قائم بمعزل عن أي فترة تقرير). عرض فقط عبر renderLabPayableSection —
// لا يُقرأ في computeTotals ولا أي معادلة، فTests A–E وnetProfit بلا مساس بالبناء.
// graceful: جدول lab_payments غائب أو أي فشل → null → البطاقة تُخفى بلا كسر.
function _labIsDraft(o) {
  return !!(o && o.status === 'draft');
}

async function loadLabPayable() {
  labPayable = null;
  labPayableBag = null;
  labPayableGrossBag = null;
  try {
    var loRes = await _pagedAcc(function(){ return window.sb.from('lab_orders')
      .select('cost, status, currency, lab_id')
      .eq('doctor_id', currentUser.id); });
    if (loRes.error || !loRes.data) return;  // graceful
    var payRes = await _pagedAcc(function(){ return window.sb.from('lab_payments')
      .select('amount, currency, lab_id')
      .eq('doctor_id', currentUser.id); });
    if (payRes.error || !payRes.data) return;  // graceful (قبل الترحيل → تُخفى)
    /* 🔴 الرصيد يُحسب **لكل مخبر داخل كل عملة**، والإجمالي يُشتقّ منه بعد ذلك.
       المُراكم الواحد لكل عملة كان يطرح رصيدَ مخبرٍ دائنٍ من ذمّة مخبرٍ آخر —
       ومقاصّةُ مورّدٍ بمورّدٍ لا تصحّ محاسبياً: ذمّةُ كل مخبر التزامٌ قائمٌ
       بذاته، والرصيدُ عند مخبرٍ آخر أصلٌ مستقل. وأثرُه ليس تجميلياً: عيادةٌ
       عليها 210 لمخبرٍ ولها 10 عند آخر كانت تقرأ «200» ويختفي العشرة كلياً
       من الصفحة لأنها لا تحمل أي سطحٍ لكل مخبر (بخلاف صفحة المخابر).
       والمفتاح lab_id، والصفوفُ التي فقدت مخبرها (ON DELETE SET NULL) تُجمَع
       بمجموعةٍ واحدة مسمّاة فلا تسقط ولا تُقاصَّ بغيرها. */
    var per = { SYP: {}, USD: {} };
    loRes.data.forEach(function(o){
      if (o.status === 'rejected' || _labIsDraft(o)) return;
      var c = _rowCur(o), k = String(o.lab_id || '__unlinked');
      if (per[c][k] === undefined) per[c][k] = 0;
      per[c][k] += Number(o.cost) || 0;
    });
    payRes.data.forEach(function(p){
      var c = _rowCur(p), k = String(p.lab_id || '__unlinked');
      if (per[c][k] === undefined) per[c][k] = 0;
      per[c][k] -= Number(p.amount) || 0;
    });
    var bag   = { SYP: 0, USD: 0 };
    var gross = { SYP: { due: 0, credit: 0 }, USD: { due: 0, credit: 0 } };
    ['SYP', 'USD'].forEach(function(c){
      Object.keys(per[c]).forEach(function(k){
        var v = per[c][k];
        bag[c] += v;
        if (v > 0) gross[c].due += v;
        else if (v < 0) gross[c].credit += -v;
      });
    });
    labPayableBag = bag;              // الصافي — يبقى كما كان لمن يقرؤه
    labPayableGrossBag = gross;
  } catch (e) {
    console.warn('loadLabPayable (non-critical):', e);
    labPayable = null;  // أي خطأ → إخفاء، لا يؤثّر على أي رقم مالي آخر
    labPayableBag = null;
    labPayableGrossBag = null;
  }
}

// account_adjustments (Migration 45): discount / write_off / refund. DATE column
// (direct compare, no timezone widening). Graceful on a pre-Migration-45 DB.

async function loadPayouts(from, to) {
  // provider_payouts: filter by paid_at (the date the money actually left
  // the clinic, regardless of which period the payout covered). This is
  // cash-basis correct: a payout "covering April" but paid on May 5 hits
  // May's books.
  //
  // paid_at is TIMESTAMPTZ — query a widened UTC window (±1 day around the
  // Owner-picked dates) to be timezone-safe, then trim client-side using
  // local-date matching via inLocalRange(). A payout entered at 02:00 local
  // on 21/05 in Syria is stored as ~23:00 UTC on 20/05 — naively filtering
  // by UTC would drop it from a "21/05 → 21/05" query.
  //
  // Try Migration 18 schema (employee_id), fall back to Migration 17, then
  // pre-Migration-17 minimal columns.
  var lo = widenStartUtc(from), hi = widenEndUtc(to);
  var res = await _pagedAcc(function(){ return window.sb.from('provider_payouts')
    .select('id, provider_id, employee_id, paid_at, amount, payment_method, currency')
    .eq('owner_id', currentUser.id)
    .gte('paid_at', lo)
    .lte('paid_at', hi); });

  if (res.error && /42703|employee_id/i.test((res.error.message || '') + ' ' + (res.error.code || ''))) {
    res = await _pagedAcc(function(){ return window.sb.from('provider_payouts')
      .select('id, provider_id, paid_at, amount, payment_method, currency')
      .eq('owner_id', currentUser.id)
      .gte('paid_at', lo)
      .lte('paid_at', hi); });
  }
  if (res.error && /42703|payment_method/i.test((res.error.message || '') + ' ' + (res.error.code || ''))) {
    res = await _pagedAcc(function(){ return window.sb.from('provider_payouts')
      .select('id, provider_id, paid_at, amount, currency')
      .eq('owner_id', currentUser.id)
      .gte('paid_at', lo)
      .lte('paid_at', hi); });
  }
  if (res.error) {
    if (isMigrationMissing(res.error)) { payouts = []; return; }
    console.warn('loadPayouts:', res.error);
    payouts = [];
    return;
  }
  // Strict local-date trim — drops any rows that fell into the ±1 day buffer.
  payouts = (res.data || []).filter(function(p){
    return inLocalRange(p.paid_at, from, to);
  });
}

async function loadLabOrders(from, to) {
  // lab_orders: cost is incurred at date_sent (cash-basis: outflow happens
  // when the work is commissioned, not when delivered). status='rejected'
  // means the order was cancelled before the lab worked on it — exclude.
  //
  // date_sent is TIMESTAMPTZ — same timezone-safe pattern as loadPayouts.
  //
  // Note: lab_orders uses doctor_id (legacy ownership column), same pattern
  // as labs.html and provider-reports.html.
  var lo = widenStartUtc(from), hi = widenEndUtc(to);
  var res = await _pagedAcc(function(){ return window.sb.from('lab_orders')
    .select('id, patient_id, tooth_num, cost, status, date_sent, provider_id, currency')
    .eq('doctor_id', currentUser.id)
    .gte('date_sent', lo)
    .lte('date_sent', hi); });
  if (res.error) {
    if (isMigrationMissing(res.error)) { labOrders = []; return; }
    console.warn('loadLabOrders:', res.error);
    labOrders = [];
    return;
  }
  // Strict local-date trim + exclude rejected.
  labOrders = (res.data || []).filter(function(loRow){
    if (loRow.status === 'rejected' || _labIsDraft(loRow)) return false;
    return inLocalRange(loRow.date_sent, from, to);
  });
}

// ─── Computation layer (Equations 1-7 from spec) ───────────────────────────

// EQUATION 1: Revenue (cash collected, excluding unearned).
// EQUATION 2: Production (completed work).
// EQUATION 3: Collection rate.
// ═══ بند #8 — إحصاء المواعيد للفترة (لنسبة الغياب) ═══
// قراءة فقط، عدّ فقط: صفر أسماء وصفر بيانات مريض. تُستعمل حصراً ببناء
// حقائق الملخّص. الفشل صامت (المصفوفة تبقى صفرية) فلا يتأثّر أي رقم مالي.
async function loadAppointmentStats(from, to) {
  apptStats = { total: 0, noShow: 0 };
  try {
    var res = await _pagedAcc(function(){ return window.sb.from('appointments')
      .select('status')
      .eq('doctor_id', currentUser.id)
      .gte('date', from)
      .lte('date', to); });
    if (res.error) { if (!isMigrationMissing(res.error)) console.warn('loadAppointmentStats:', res.error); return; }
    var rows = res.data || [];
    for (var i = 0; i < rows.length; i++) {
      apptStats.total++;
      if (rows[i].status === 'no_show') apptStats.noShow++;
    }
  } catch (e) { /* graceful — الملخّص يتخطّى البند ويكتب «غير متاح» */ }
}

function computeSummary() {
  // 1a. Splits-based revenue (preferred). is_unearned splits are prepayments
  // and don't count as earned revenue.
  var splitsRevenue = 0;
  var unearnedTotal = 0;
  var splitPaymentIds = {};
  for (var i = 0; i < paymentSplits.length; i++) {
    var sp = paymentSplits[i];
    splitPaymentIds[sp.payment_id] = true;   // mark for legacy de-dup regardless of earned/unearned
    if (splitIsEarned(sp)) {
      splitsRevenue += Number(sp.amount) || 0;
    } else {
      // is_unearned OR allocated to a planned session → mobile credit (liability), NOT revenue.
      unearnedTotal += Number(sp.amount) || 0;
    }
  }

  // 1b. Legacy payments (no splits). Sum the raw amount.
  var legacyRevenue = 0;
  for (var j = 0; j < payments.length; j++) {
    var p = payments[j];
    if (!splitPaymentIds[p.id]) {
      legacyRevenue += Number(p.amount) || 0;
    }
  }

  var revenue = splitsRevenue + legacyRevenue;

  // 2. Production
  var production = 0;
  for (var k = 0; k < sessions.length; k++) {
    production += Number(sessions[k].cost) || 0;
  }

  // 3. Collection rate (with division-by-zero guard)
  var collectionRate = (production > 0) ? (revenue / production) * 100 : null;

  return {
    revenue: revenue,
    splitsRevenue: splitsRevenue,
    legacyRevenue: legacyRevenue,
    unearnedTotal: unearnedTotal,
    production: production,
    collectionRate: collectionRate
  };
}

// EQUATION 4: Total expenses.
function computeExpenseTotals() {
  var expensesTotal = 0;
  for (var i = 0; i < expenses.length; i++) {
    expensesTotal += Number(expenses[i].amount) || 0;
  }
  var payoutsTotal = 0;
  for (var j = 0; j < payouts.length; j++) {
    payoutsTotal += Number(payouts[j].amount) || 0;
  }
  var labsTotal = 0;
  for (var k = 0; k < labOrders.length; k++) {
    labsTotal += Number(labOrders[k].cost) || 0;
  }
  return {
    expensesTotal: expensesTotal,
    payoutsTotal: payoutsTotal,
    labsTotal: labsTotal,
    totalExpenses: expensesTotal + payoutsTotal + labsTotal
  };
}

// EQUATION 5 + 6: Net profit + per-category breakdown.
function computeExpenseBreakdown(totals) {
  // Group by category_id for the expenses table portion. Combine with two
  // synthetic categories: "رواتب وحصص" (payouts) and "تكاليف المخابر" (labs).
  var byCategory = {};
  for (var i = 0; i < expenses.length; i++) {
    var e = expenses[i];
    var cid = e.category_id || '_uncat';
    if (!byCategory[cid]) byCategory[cid] = 0;
    byCategory[cid] += Number(e.amount) || 0;
  }

  // Heuristic detector for suspected double-counted salary expenses (rule:
  // employee salaries SHOULD go in provider_payouts, not expenses). If an
  // expense category name hints at "salary/wages/employee/doctor", flag it.
  var SALARY_HINT_RE = /راتب|رواتب|أجر|أجور|اجر|اجور|موظف|موظفين|طبيب|أطباء|اطباء|حصة|حصص|تعويض/i;

  var rows = [];

  // Synthetic: payouts (always shown if > 0)
  if (totals.payoutsTotal > 0) {
    rows.push({
      key: '_payouts',
      icon: '💼',
      name: 'رواتب وحصص الأطباء والموظفين',
      color: 'var(--purple)',
      amount: totals.payoutsTotal,
      isSynthetic: true,
      warnDup: false
    });
  }

  // Synthetic: labs
  if (totals.labsTotal > 0) {
    rows.push({
      key: '_labs',
      icon: '🥽',
      name: 'تكاليف المخابر',
      color: 'var(--blue)',
      amount: totals.labsTotal,
      isSynthetic: true,
      warnDup: false
    });
  }

  // expense_categories rows
  Object.keys(byCategory).forEach(function(cid){
    var amt = byCategory[cid];
    if (amt <= 0) return;
    var cat = (cid === '_uncat') ? null : expenseCategories.find(function(c){ return c.id === cid; });
    var name = cat ? cat.name : 'بدون تصنيف';
    rows.push({
      key: 'cat_' + cid,
      icon: cat ? (cat.icon || '📋') : '📋',
      name: name,
      color: cat ? (cat.color || 'var(--text3)') : 'var(--text3)',
      amount: amt,
      isSynthetic: false,
      // Warn if name hints at salary — likely double-counted with payouts.
      warnDup: SALARY_HINT_RE.test(name)
    });
  });

  // Sort descending by amount
  rows.sort(function(a, b){ return b.amount - a.amount; });

  // Add percentages (guard against zero total)
  var total = totals.totalExpenses;
  for (var i = 0; i < rows.length; i++) {
    rows[i].pct = (total > 0) ? (rows[i].amount / total) * 100 : 0;
  }

  return rows;
}

// EQUATION 7: Per-provider performance.
//
// Re-uses the same allocation logic as provider-reports.html for consistency.
// For each clinic_doctor:
//   - production_p = Σ sessions.cost where provider_id matches
//   - labCost_p    = Σ matching lab_orders.cost (de-duped via shared set)
//   - collection_p = Σ payment_splits.amount where provider_id matches
//                     + proportional fallback for legacy payments
//   - paidOut_p    = Σ provider_payouts.amount where provider_id matches
//   - clinicNet_p  = collection_p - labCost_p - paidOut_p
//
// Note: provSessions can include sessions on inactive doctors (historical
// data). That's correct — we want full P&L visibility.
function computeProviderPerformance() {
  var rows = [];

  // Lookup helpers
  var paymentIdsWithSplits = {};
  for (var i = 0; i < paymentSplits.length; i++) {
    paymentIdsWithSplits[paymentSplits[i].payment_id] = true;
  }
  var legacyPayments = payments.filter(function(p){ return !paymentIdsWithSplits[p.id]; });

  // Build per-patient totals for legacy proportional allocation
  var byPatientTotals = {};
  for (var j = 0; j < sessions.length; j++) {
    var s = sessions[j];
    if (!byPatientTotals[s.patient_id]) byPatientTotals[s.patient_id] = { total: 0 };
    byPatientTotals[s.patient_id].total += Number(s.cost) || 0;
  }
  var legacyPaymentsByPatient = {};
  legacyPayments.forEach(function(p){
    legacyPaymentsByPatient[p.patient_id] =
      (legacyPaymentsByPatient[p.patient_id] || 0) + (Number(p.amount) || 0);
  });

  // Audit-critical: identify legacy payments whose patient has NO sessions
  // in the period. These can't be proportionally allocated to any provider,
  // so they must flow into _unassigned to preserve Test A (revenue
  // conservation). Without this, Σ per-provider collection < total revenue.
  var orphanLegacyRevenue = 0;
  Object.keys(legacyPaymentsByPatient).forEach(function(pid){
    if (!byPatientTotals[pid] || byPatientTotals[pid].total <= 0) {
      orphanLegacyRevenue += legacyPaymentsByPatient[pid];
    }
  });

  // Iterate providers (only those present in sessions, splits, OR payouts to
  // keep the table relevant — empty rows would clutter). Then add _unassigned.
  //
  // Including splits provider_ids handles the edge case where an old split
  // references a doctor whose clinic_doctors row was later deleted (FK is
  // ON DELETE SET NULL) or whose only activity in this period is on
  // somebody else's session via a manual split allocation. Without this,
  // those amounts would silently fail to attribute and break Test A.
  var providerIdsInData = {};
  sessions.forEach(function(s){ if (s.provider_id) providerIdsInData[s.provider_id] = true; });
  payouts.forEach(function(p){ if (p.provider_id) providerIdsInData[p.provider_id] = true; });
  paymentSplits.forEach(function(sp){
    if (splitIsEarned(sp) && sp.provider_id) providerIdsInData[sp.provider_id] = true;
  });
  // Lab orders also anchor a provider (Migration 73): a doctor may have an in-window
  // lab cost even with no in-window sessions/splits/payouts (e.g. lab sent this month
  // for a session done last month). Including them here ensures that doctor's row is
  // rendered and the lab cost is attributed, so the per-provider lab split reconciles
  // exactly to labsTotal (Test E equality rather than a strict inequality).
  labOrders.forEach(function(lo){ if (lo.provider_id) providerIdsInData[lo.provider_id] = true; });

  // Track which provider_ids are matched by a doctor row. Splits referencing
  // a provider_id with no current clinic_doctors row contribute to a special
  // "محذوف" bucket so Test A still passes.
  var knownDoctorIds = {};
  doctors.forEach(function(doc){ knownDoctorIds[doc.id] = true; });

  doctors.forEach(function(doc){
    if (!providerIdsInData[doc.id]) return;
    rows.push(computeOneProviderRow(doc, byPatientTotals,
                                     legacyPaymentsByPatient, paymentIdsWithSplits));
  });

  // Orphan provider_ids from splits/sessions/payouts where the doctor row
  // has been deleted. Aggregate as one synthetic "deleted doctor" bucket.
  //
  // Conservation note: this bucket must absorb three streams to preserve
  // Test A:
  //   1. Splits attributed directly to orphan provider_ids.
  //   2. Legacy-payment proportional share for any orphan sessions
  //      (without this, the legacy proportional only fires for known
  //      doctors and 'tax' the orphan share into a black hole).
  //   3. Direct payouts logged against orphan provider_ids.
  var orphanCollection = 0;
  var orphanProduction = 0;
  var orphanPaidOut    = 0;
  var orphanLabCost    = 0;
  var orphanSessionCount = 0;
  Object.keys(providerIdsInData).forEach(function(pid){
    if (knownDoctorIds[pid]) return;
    // Sessions
    sessions.forEach(function(s){
      if (s.provider_id !== pid) return;
      orphanProduction += Number(s.cost) || 0;
      orphanSessionCount++;
    });
    // Lab cost for this orphan (deleted) provider — explicit provider_id
    // (Migration 73). Counted once by construction; no session matching.
    labOrders.forEach(function(lo){
      if (lo.provider_id === pid) orphanLabCost += Number(lo.cost) || 0;
    });
    // Splits — direct attribution to orphan provider_id (earned only).
    paymentSplits.forEach(function(sp){
      if (!splitIsEarned(sp)) return;
      if (sp.provider_id === pid) orphanCollection += Number(sp.amount) || 0;
    });
    // Legacy proportional — for each in-range patient with sessions on this
    // orphan provider, route the orphan's share of legacy (split-less)
    // payments into the bucket. Without this, the known-doctor proportional
    // loop only divides the legacy payment among known providers and the
    // deleted doctor's share quietly vanishes, breaking Test A.
    Object.keys(byPatientTotals).forEach(function(patId){
      var patTotal = byPatientTotals[patId].total;
      if (patTotal <= 0) return;
      var orphanProvTotal = 0;
      sessions.forEach(function(s){
        if (s.patient_id !== patId) return;
        if (s.provider_id === pid) orphanProvTotal += Number(s.cost) || 0;
      });
      if (orphanProvTotal <= 0) return;
      var ratio = orphanProvTotal / patTotal;
      orphanCollection += (legacyPaymentsByPatient[patId] || 0) * ratio;
    });
    // Payouts — direct attribution.
    payouts.forEach(function(p){
      if (p.provider_id === pid) orphanPaidOut += Number(p.amount) || 0;
    });
  });
  if (orphanCollection > 0 || orphanProduction > 0 || orphanPaidOut > 0 || orphanLabCost > 0) {
    rows.push({
      id: '_deleted_doctors',
      name: 'أطباء محذوفون',
      color: '#5d748f',
      isOwner: false,
      isActive: false,
      isUnassigned: false,
      isDeleted: true,
      sessionCount: orphanSessionCount,
      production: orphanProduction,
      labCost: orphanLabCost,
      collection: orphanCollection,
      paidOut: orphanPaidOut,
      clinicNet: orphanCollection - orphanLabCost - orphanPaidOut
    });
  }

  // _unassigned bucket — shown whenever there's something to report under it:
  //   - sessions without provider_id (orphan sessions), OR
  //   - splits with null provider_id (rare but possible after data edits), OR
  //   - lab orders with null provider_id (Migration 73 — must be counted so the
  //     per-provider lab split still reconciles to labsTotal / Test E), OR
  //   - orphan legacy payments (patient has no in-range sessions).
  var hasUnassignedSessions = sessions.some(function(s){ return !s.provider_id; });
  var hasUnassignedSplits = paymentSplits.some(function(sp){
    return splitIsEarned(sp) && !sp.provider_id;
  });
  var hasUnassignedLab = labOrders.some(function(lo){ return !lo.provider_id; });
  if (hasUnassignedSessions || hasUnassignedSplits || hasUnassignedLab || orphanLegacyRevenue > 0) {
    var unassignedRow = computeOneProviderRow(
      { id: '_unassigned', name: 'غير محدد', color: '#5d748f', is_owner: false },
      byPatientTotals, legacyPaymentsByPatient, paymentIdsWithSplits
    );
    // Add orphan legacy revenue (patients with payments but no in-range sessions).
    unassignedRow.collection += orphanLegacyRevenue;
    rows.push(unassignedRow);
  }

  return rows;
}

function computeOneProviderRow(doc, byPatientTotals,
                                legacyPaymentsByPatient, paymentIdsWithSplits) {
  var provId = doc.id;
  var isUnassigned = (provId === '_unassigned');

  // Sessions for this provider
  var provSessions = sessions.filter(function(s){
    return isUnassigned ? !s.provider_id : s.provider_id === provId;
  });
  var production = 0;
  for (var i = 0; i < provSessions.length; i++) {
    production += Number(provSessions[i].cost) || 0;
  }

  // Lab cost: explicit per-provider attribution via provider_id (Migration 73).
  // Each lab_order carries exactly one provider_id, so it is counted once by
  // construction — no session matching, no shared dedup set needed. labOrders is
  // already filtered to the window by date_sent at load time.
  var labCost = 0;
  for (var li = 0; li < labOrders.length; li++) {
    var loRow = labOrders[li];
    var matchLab = isUnassigned ? !loRow.provider_id : loRow.provider_id === provId;
    if (matchLab) labCost += Number(loRow.cost) || 0;
  }

  // Collection (exact via splits + proportional fallback for legacy)
  var collection = 0;
  for (var k = 0; k < paymentSplits.length; k++) {
    var sp = paymentSplits[k];
    if (!splitIsEarned(sp)) continue;   // unearned OR on a planned session → not collected revenue
    var matchesProv = isUnassigned ? !sp.provider_id : (sp.provider_id === provId);
    if (matchesProv) collection += Number(sp.amount) || 0;
  }
  // Legacy proportional
  Object.keys(byPatientTotals).forEach(function(pid){
    var patTotals = byPatientTotals[pid];
    if (patTotals.total <= 0) return;
    // Compute provider share of this patient's production
    var provTotal = 0;
    sessions.forEach(function(s){
      if (s.patient_id !== pid) return;
      if (isUnassigned ? !s.provider_id : s.provider_id === provId) {
        provTotal += Number(s.cost) || 0;
      }
    });
    if (provTotal <= 0) return;
    var ratio = provTotal / patTotals.total;
    collection += (legacyPaymentsByPatient[pid] || 0) * ratio;
  });

  // Payouts (only those with provider_id matching — employee_id payouts are
  // separate and shown in totals, not per-provider).
  var paidOut = 0;
  if (!isUnassigned) {
    for (var m = 0; m < payouts.length; m++) {
      if (payouts[m].provider_id === provId) {
        paidOut += Number(payouts[m].amount) || 0;
      }
    }
  }

  // Clinic net from this provider's activity:
  //   what they collected - lab they consumed - what we paid them.
  var clinicNet = collection - labCost - paidOut;

  return {
    id: provId,
    name: doc.name || '—',
    color: doc.color || '#5d748f',
    isOwner: !!doc.is_owner,
    isActive: doc.is_active !== false,
    isUnassigned: isUnassigned,
    sessionCount: provSessions.length,
    production: production,
    labCost: labCost,
    collection: collection,
    paidOut: paidOut,
    clinicNet: clinicNet
  };
}

// Identity tests — run after each render to verify accounting integrity.
// Stored in lastIdentities; viewable via Ctrl+Shift+D debug panel.
//
// Tolerance: 0.01 ل.س is too tight when legacy proportional allocation
// involves many patients (each contributes a floating-point ratio).
// We use 1 ل.س cumulative tolerance — generous for FP error, strict
// enough to catch real bugs (which would diff by hundreds or more).
// F9 (M125): الدولارُ يُحفَظ بالسنت فتسامحُ 1$ = مئةُ سنتٍ تفلت منه أخطاءٌ حقيقية —
// طبقتُه تأخذ 0.01 (خطأُ FP للنِّسَب بحدود 1e-9، بعيدٌ عنها بمراتب).
function runIdentityTests(summary, totals, providerRows, cur) {
  var results = [];
  var TOLERANCE = (cur === 'USD') ? 0.01 : 1;

  // Test A: Revenue conservation.
  //   Σ per-provider collection should equal total revenue.
  var sumProvCollection = 0;
  providerRows.forEach(function(r){ sumProvCollection += r.collection; });
  var diffA = Math.abs(sumProvCollection - summary.revenue);
  results.push({
    name: 'A. Revenue conservation',
    pass: diffA < TOLERANCE,
    detail: 'Σ providers: ' + Math.round(sumProvCollection) +
            ' vs total: ' + Math.round(summary.revenue) +
            ' (Δ=' + diffA.toFixed(2) + ')'
  });

  // Test B: Production conservation.
  var sumProvProduction = 0;
  providerRows.forEach(function(r){ sumProvProduction += r.production; });
  var diffB = Math.abs(sumProvProduction - summary.production);
  results.push({
    name: 'B. Production conservation',
    pass: diffB < TOLERANCE,
    detail: 'Σ providers: ' + Math.round(sumProvProduction) +
            ' vs total: ' + Math.round(summary.production) +
            ' (Δ=' + diffB.toFixed(2) + ')'
  });

  // Test C: Expense sum identity (no FP risk, additive integers).
  var sumC = totals.expensesTotal + totals.payoutsTotal + totals.labsTotal;
  var diffC = Math.abs(sumC - totals.totalExpenses);
  results.push({
    name: 'C. Expense sum',
    pass: diffC < TOLERANCE,
    detail: 'exp+pay+lab: ' + Math.round(sumC) +
            ' vs total: ' + Math.round(totals.totalExpenses)
  });

  // Test D: Net profit identity (always exact by construction).
  var netCheck = summary.revenue - totals.totalExpenses;
  results.push({
    name: 'D. Net profit identity',
    pass: true,
    detail: 'rev - exp = ' + Math.round(netCheck)
  });

  // Test E: Lab attribution conservation.
  //   Σ per-provider labCost = total labsTotal exactly. Since Migration 73 every
  //   lab_order carries one explicit provider_id and lands in exactly one row
  //   (known doctor · deleted-doctor bucket · unassigned), so the sum reconciles
  //   to the total by construction. F4: كان «≤» من عهد الاستدلال بالنافذة (±90 يوم)
  //   فلا يمسك نقصاً بالإسناد — صار مساواةً كما يدّعي تعليقُ providerIdsInData.
  var sumProvLab = 0;
  providerRows.forEach(function(r){ sumProvLab += r.labCost; });
  var diffE = Math.abs(sumProvLab - totals.labsTotal);
  results.push({
    name: 'E. Lab attribution',
    pass: diffE < TOLERANCE,
    detail: 'Σ providers: ' + Math.round(sumProvLab) +
            ' vs total: ' + Math.round(totals.labsTotal) +
            ' (Δ=' + diffE.toFixed(2) + ')'
  });

  return results;
}

// ─── Rendering ─────────────────────────────────────────────────────────────
// Account adjustments (Migration 45). discount/write_off reduce the charge
// (net production); refunds reduce collected cash (net revenue + net profit).
// These are CLINIC-LEVEL deductions shown separately — they are NOT attributed
// per provider, so the gross per-provider conservation (Test A/B) is untouched.
function computeAdjustmentTotals() {
  var chargeReductions = 0;  // discount + write_off
  var refundsTotal     = 0;  // refund
  for (var i = 0; i < adjustments.length; i++) {
    var a = adjustments[i];
    var amt = Number(a.amount) || 0;
    if (amt <= 0) continue;
    if (a.kind === 'refund')                                  refundsTotal     += amt;
    else if (a.kind === 'discount' || a.kind === 'write_off') chargeReductions += amt;
  }
  return {
    chargeReductions: chargeReductions,
    refundsTotal: refundsTotal,
    adjTotal: chargeReductions + refundsTotal
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// بند #8 — الملخّص الذكي للفترة (AI)
// ═══════════════════════════════════════════════════════════════════════════
// المبدأ (درس الجلسات السابقة): **الحساب deterministic والـAI للصياغة فقط.**
// كل رقم يصل الموديل مُنسَّقاً مسبقاً بنفس دوال العرض (fmtSY/fmtPct) التي
// تبني البطاقات ⇒ يستحيل أن يخالف الملخّص ما يراه المالك على الشاشة.
//
// 🔒 عزل مالي مطلق: قراءة فقط — صفر كتابة في ledger_*/payment_splits/realloc.
// 🔒 صفر PII: أرقام مجمّعة + أسماء علاجات من الكتالوج. لا اسم مريض ولا طبيب
//    ولا معرّف يغادر المتصفح.
var digestFacts = '';   // آخر حقائق مبنيّة (تُعاد بناؤها مع كل render)

// أعلى العلاجات تكراراً في الفترة — من ledger_sessions.type (اسم من كتالوج
// العيادة، ليس بياناً شخصياً). تجميع deterministic بلا أي AI.
function digestTopTreatments(limit) {
  var map = {}, i, t;
  for (i = 0; i < sessions.length; i++) {
    t = String(sessions[i].type || '').trim();
    if (!t) continue;
    if (!map[t]) map[t] = { n: 0, sum: 0 };
    map[t].n++;
    map[t].sum += Number(sessions[i].cost) || 0;
  }
  var arr = Object.keys(map).map(function(k){ return { name: k, n: map[k].n, sum: map[k].sum }; });
  arr.sort(function(a, b){ return (b.n - a.n) || (b.sum - a.sum); });
  return arr.slice(0, limit || 3);
}

// أعلى بنود المصروفات — `breakdown` مصفوفة مرتّبة تنازلياً أصلاً (نفس
// المصدر الذي يبني قسم «تفصيل المصروفات»)، فنأخذ رأسها بلا إعادة فرز.
function digestTopExpenses(breakdown, limit) {
  var rows = Array.isArray(breakdown) ? breakdown : [];
  return rows.slice(0, limit || 3);
}

// بناء نصّ الحقائق المُرسَل للموديل. كل قيمة منسّقة كما تُعرض حرفياً.
function buildDigestFacts(from, to, s, t, netProfit, profitMargin, adj, netRevenue, netProduction, collectionRate, breakdown) {
  var lines = [];
  var days = 0;
  try {
    var d1 = new Date(from + 'T00:00:00'), d2 = new Date(to + 'T00:00:00');
    days = Math.round((d2 - d1) / 86400000) + 1;
  } catch (e) { days = 0; }

  lines.push('الفترة: من ' + from + ' إلى ' + to + (days > 0 ? ' (' + days + ' يوماً)' : ''));
  lines.push('الإيرادات المحصّلة: ' + fmtSY(s.revenue));
  if (adj && adj.refundsTotal > 0) lines.push('صافي الإيراد بعد الاسترداد: ' + fmtSY(netRevenue));
  lines.push('الإنتاج المنجز: ' + fmtSY(s.production));
  if (adj && adj.chargeReductions > 0) lines.push('صافي الإنتاج بعد الخصومات: ' + fmtSY(netProduction));
  lines.push('معدّل التحصيل: ' + (collectionRate === null ? 'غير متاح' : fmtPct(collectionRate)));
  lines.push('المصروفات الإجمالية: ' + fmtSY(t.totalExpenses));
  lines.push((netProfit >= 0 ? 'صافي الربح: ' : 'صافي الخسارة: ') + fmtSY(Math.abs(netProfit)));
  lines.push('هامش الربح: ' + (profitMargin === null ? 'غير متاح' : fmtPct(profitMargin)));
  lines.push('الرصيد غير المكتسب (دفعات مقابل علاج لم يُنفَّذ بعد): ' + fmtSY(s.unearnedTotal));
  lines.push('عدد الجلسات المكتملة: ' + sessions.length);

  // الفارق بين الإنتاج والتحصيل + النسبة غير المحصّلة.
  // سببهما: الموديل احتاج هذين الرقمين للسرد فاشتقّهما بنفسه وأخطأ (طرَح
  // وقرّب فأنتج مبلغاً غير موجود). الحلّ ليس منعاً إضافياً بل تزويده بهما
  // محسوبَين — نفس مبدأ «الحساب deterministic والـAI للصياغة».
  var _gap = (Number(s.production) || 0) - (Number(s.revenue) || 0);
  if (_gap > 0) {
    lines.push('الفارق بين الإنتاج المنجز والإيراد المحصّل في هذه الفترة: ' + fmtSY(_gap) +
               ' (فارق توقيت وتحصيل ضمن حدود الفترة — ليس بالضرورة ديوناً مستحقة على المرضى)');
  }
  if (collectionRate !== null && collectionRate < 100) {
    lines.push('النسبة غير المحصّلة من الإنتاج: ' + fmtPct(100 - collectionRate));
  }

  // نسبة الغياب — تُذكر فقط إن وُجدت مواعيد بالفترة
  if (apptStats.total > 0) {
    var nsPct = (apptStats.noShow / apptStats.total) * 100;
    lines.push('المواعيد في الفترة: ' + apptStats.total + ' موعداً، منها ' + apptStats.noShow +
               ' عدم حضور — نسبة الغياب: ' + fmtPct(nsPct));
  } else {
    lines.push('نسبة الغياب: غير متاح');
  }

  var tops = digestTopTreatments(3);
  if (tops.length) {
    lines.push('العلاجات الأكثر تكراراً في الفترة (مرتّبة حسب عدد الجلسات، لا حسب القيمة):');
    for (var i = 0; i < tops.length; i++) {
      lines.push('  - ' + tops[i].name + ': ' + tops[i].n + ' جلسة بقيمة ' + fmtSY(tops[i].sum));
    }
  } else {
    lines.push('العلاجات الأكثر تكراراً: غير متاح');
  }

  var texp = digestTopExpenses(breakdown, 3);
  if (texp.length) {
    lines.push('أعلى بنود المصروفات (مرتّبة حسب المبلغ):');
    for (var j = 0; j < texp.length; j++) {
      var pctTxt = (texp[j].pct === null || texp[j].pct === undefined || isNaN(texp[j].pct))
        ? '' : ' (' + fmtPct(texp[j].pct) + ' من إجمالي المصروفات)';
      lines.push('  - ' + (texp[j].name || 'غير مصنّف') + ': ' + fmtSY(texp[j].amount) + pctTxt);
    }
  }

  return lines.join('\n');
}

// بطاقة الملخّص — تظهر فقط عند فتح البوابتين (opt-in + الخطة).
function renderDigestCard() {
  if (!ACC_AI_ON) return '';
  var body = lastDigest
    ? '<div class="digest-out" id="digestOut">' + escapeHtml(lastDigest) + '</div>'
    : '';
  // شريط الحارس يُرسَم دائماً (مخفيّاً عند الفراغ) كي تجده digestGenerate.
  var warnBody = '<div class="digest-warn" id="digestWarn"' +
    (lastDigestWarn ? '' : ' style="display:none"') + '>' +
    escapeHtml(lastDigestWarn || '') + '</div>';
  return '' +
    '<div class="section">' +
      '<div class="digest-head">' +
        '<h2 style="margin:0">🤖 ملخّص الفترة الذكي</h2>' +
        '<button type="button" class="digest-btn" id="digestBtn" onclick="digestGenerate()">' +
          (lastDigest ? '🔄 إعادة التوليد' : '✨ اقرأ لي الفترة') +
        '</button>' +
      '</div>' +
      warnBody +
      body +
      '<div class="digest-hint">قراءة سريعة للأرقام المعروضة أعلاه — تُبنى من نفس القيم حرفياً ' +
      'ولا تُحتسب من جديد. تُرسَل أرقام مجمّعة فقط بلا أي اسم مريض أو بيانات شخصية، ' +
      'والملخّص للعرض فقط ولا يُحفَظ ولا يُعدّل أي رقم محاسبي.</div>' +
    '</div>';
}

// F5: خريطةُ أخطاء ai-assist (مرآة prmAiErrText بـpatients.html) — «حاول بعد قليل»
// كانت الرسالةَ الوحيدة حتى لسقفٍ شهريّ بلغ أو خطةٍ لا تشمل الميزة، فتُضلّل القارئ.
function _accAiErrText(code) {
  var map = {
    ai_not_enabled: 'فعّل مساعد الذكاء الاصطناعي من الإعدادات أولاً',
    ai_plan_not_included: 'مساعد الذكاء الاصطناعي غير متاح في خطتك الحالية',

    account_not_active: 'الحساب غير مفعّل حالياً — تواصل مع إدارة المنصة',

    quota_exceeded: 'بلغت الحد الشهري لمساعد الذكاء الاصطناعي — يتجدّد مطلع الشهر',

    ai_empty_response: 'لم يصل ملخّص — حاول مجدداً',
    empty_input: 'لا أرقام كافية بالفترة لتلخيصها'
  };
  return map[code] || 'تعذّر توليد الملخّص الآن. حاول بعد قليل.';
}
async function _accAiErrCode(resp) {
  try {
    if (resp && resp.error && resp.error.context && typeof resp.error.context.json === 'function') {
      var j = await resp.error.context.json();
      return (j && j.error) ? String(j.error) : '';
    }
  } catch (e) {}
  return '';
}
// التوليد — نداء واحد لـai-assist، والفرض النهائي سيرفر-سايد.
async function digestGenerate() {
  if (digestBusy) return;
  if (!digestFacts) { return; }
  var btn = $('digestBtn');
  digestBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جارٍ التحليل...'; }
  // تصفير التحذير مع كل توليد.
  lastDigestWarn = '';
  var wEl = $('digestWarn');
  if (wEl) { wEl.textContent = ''; wEl.style.display = 'none'; }
  var out = $('digestOut');
  if (!out) {
    var host = btn ? btn.parentNode.parentNode : null;
    if (host) {
      var div = document.createElement('div');
      div.className = 'digest-out';
      div.id = 'digestOut';
      host.insertBefore(div, btn.parentNode.nextSibling);
      out = div;
    }
  }
  if (out) { out.className = 'digest-out'; out.textContent = 'جارٍ قراءة أرقام الفترة...'; }

  try {
    var resp = await window.sb.functions.invoke('ai-assist', {
      body: { feature: 'monthly_digest', input: { facts: digestFacts } }
    });
    if (resp && resp.error) {
      var _code = await _accAiErrCode(resp);
      if (out) { out.className = 'digest-out err'; out.textContent = _accAiErrText(_code); }
    } else {
      var txt = (resp && resp.data && resp.data.text) ? String(resp.data.text).trim() : '';
      if (!txt) {
        if (out) { out.className = 'digest-out err'; out.textContent = 'تعذّر توليد الملخّص الآن. حاول بعد قليل.'; }
      } else {
        lastDigest = txt;
        if (out) { out.className = 'digest-out'; out.textContent = txt; }
        // حارس الأرقام الحتميّ — تدهور صامت لو غاب المشترك.
        try {
          if (window.SyDentAiGuard) lastDigestWarn = window.SyDentAiGuard.check(txt, digestFacts);
        } catch (_e) { lastDigestWarn = ''; }
        if (wEl) { wEl.textContent = lastDigestWarn; wEl.style.display = lastDigestWarn ? 'block' : 'none'; }
      }
    }
  } catch (e) {
    if (out) { out.className = 'digest-out err'; out.textContent = 'تعذّر توليد الملخّص الآن. حاول بعد قليل.'; }
  }
  digestBusy = false;
  if (btn) { btn.disabled = false; btn.textContent = lastDigest ? '🔄 إعادة التوليد' : '✨ اقرأ لي الفترة'; }
}

// ═══════════════════════════════════════════════════════════════════════════
// M125 — تعدد العملات (ل.س / $): طبقة القسمة
// ═══════════════════════════════════════════════════════════════════════════
// المبدأ: العملة بُعد قسمة (partition) فوق المعادلات السبع كلها. لا نعيد كتابة
// أي دالة حساب — المحرّك الحرفي (computeSummary/computeExpenseTotals/
// computeProviderPerformance/runIdentityTests/computeAdjustmentTotals) يعمل
// مرةً لكل عملة نشطة على مدخلات مفلترة بعملتها، بتبديل المصفوفات العامة ثم
// إرجاعها. النتائج بالبناء لا بالانضباط:
//   · صفر انحدار: عيادة أحادية العملة = طبقة واحدة بمدخلات كاملة = مخرجات
//     مطابقة رقمياً للنسخة السابقة حرفياً.
//   · التخصيص النسبي للـlegacy والـorphan على مستوى (مريض، عملة) تلقائياً —
//     كل طبقة لا ترى إلا صفوف عملتها، فدفعة legacy دولارية لمريض جلساته
//     بالليرة تسقط orphan بطبقة الدولار (حفظ Test A داخل كل طبقة).
//   · Tests A–E تجري داخل كل طبقة، وصفر عملية جمع عابرة للعملات بالملف كله.
function _rowCur(r) { return (r && r.currency === 'USD') ? 'USD' : 'SYP'; }
function _defCurAcc() { return SyDentCurBag.defCur(); }
function _filterCur(arr, cur) {
  return (arr || []).filter(function(r){ return _rowCur(r) === cur; });
}
function computeLayersByCurrency() {
  var full = {
    sessions: sessions, payments: payments, paymentSplits: paymentSplits,
    expenses: expenses, payouts: payouts, labOrders: labOrders, adjustments: adjustments
  };
  var layers = {};
  var active = [];
  ['SYP', 'USD'].forEach(function(cur){
    sessions      = _filterCur(full.sessions, cur);
    payments      = _filterCur(full.payments, cur);
    paymentSplits = _filterCur(full.paymentSplits, cur);
    expenses      = _filterCur(full.expenses, cur);
    payouts       = _filterCur(full.payouts, cur);
    labOrders     = _filterCur(full.labOrders, cur);
    adjustments   = _filterCur(full.adjustments, cur);

    var summary      = computeSummary();
    var totals       = computeExpenseTotals();
    var breakdown    = computeExpenseBreakdown(totals);
    var providerRows = computeProviderPerformance();
    var adj          = computeAdjustmentTotals();
    var identities   = runIdentityTests(summary, totals, providerRows, cur);

    // كتلة هوية صافي الربح — منقولة من render() بايت-بايت (مرساة الحارس H).
    var grossRevenue    = summary.revenue;
  var grossProduction = summary.production;
  // Net figures (cash-basis): refunds are cash out → reduce revenue + profit.
  // Discounts/write-offs are NOT cash → reduce only the charge (net production
  // and thus the collection-rate denominator), never net profit directly.
  var netRevenue    = grossRevenue - adj.refundsTotal;
  var netProduction = grossProduction - adj.chargeReductions;

  var netProfit = netRevenue - totals.totalExpenses;
  var profitMargin = (netRevenue > 0) ? (netProfit / netRevenue) * 100 : null;
  // Collection rate = collected cash ÷ NET charge (you can't collect a discount).
  var collectionRate = (netProduction > 0) ? (grossRevenue / netProduction) * 100 : null;

    var hasRows = !!(sessions.length || payments.length || paymentSplits.length ||
                     expenses.length || payouts.length || labOrders.length ||
                     adjustments.length || (materialCostBag[cur] || 0) > 0 ||
                     // 🔴 الإجمالي لا الصافي: طبقةٌ عليها 50 عند مخبرٍ ولها 50
                     // عند آخر صافيها صفر — وكانت تختفي كلياً وهي حركةٌ حقيقية.
                     (labPayableGrossBag && (labPayableGrossBag[cur].due > 0 ||
                                             labPayableGrossBag[cur].credit > 0)));
    layers[cur] = {
      summary: summary, totals: totals, breakdown: breakdown,
      providerRows: providerRows, adj: adj, identities: identities,
      netRevenue: netRevenue, netProduction: netProduction, netProfit: netProfit,
      profitMargin: profitMargin, collectionRate: collectionRate,
      hasRows: hasRows
    };
    if (hasRows) active.push(cur);
  });
  // إرجاع المصفوفات الكاملة — إلزامي قبل أي مسار آخر يقرؤها.
  sessions = full.sessions; payments = full.payments; paymentSplits = full.paymentSplits;
  expenses = full.expenses; payouts = full.payouts; labOrders = full.labOrders;
  adjustments = full.adjustments;

  // ترتيب الطبقات يتبع عملة العيادة الافتراضية (سابقة v200) لا قائمةً مثبّتة.
  // الحسابُ أعلاه يمشي على العملتين دائماً وهو مستقلٌّ عن الترتيب تماماً، فالترتيبُ
  // يُشتقّ عند الإخراج وحده من المصدر الواحد `SyDentCurBag.active`. أيُّ خطأ ⇒
  // يبقى الترتيبُ المثبَّت (سلوكُ ما قبل التغيير حرفياً).
  try {
    var _bagOrd = { SYP: 0, USD: 0 };
    active.forEach(function(c){ _bagOrd[c] = 1; });
    active = window.SyDentCurBag.active(_bagOrd);
  } catch (e) {}

  if (!active.length) {
    // عيادة بلا أي حركة بالفترة → طبقة واحدة بعملة العيادة (حالة الفراغ كما كانت).
    active = [ (typeof curLbl === 'function' && String(curLbl()).indexOf('$') !== -1) ? 'USD' : 'SYP' ];
  }
  layers._active = active;
  return layers;
}

// رأس طبقة العملة — يظهر فقط عند نشاط العملتين معاً.

// حقائق الملخّص الذكي متعددة الطبقات — buildDigestFacts الحرفية تُستدعى لكل
// طبقة على جلساتها المفلترة (نفس نمط تبديل/إرجاع المصفوفات)، وقاعدة حديدية
// تسبق الطبقتين عند التعدد: يُمنع أي جمع أو مقارنة أو تحويل بين العملتين.
function buildDigestFactsAllLayers(from, to, layers, act) {
  var parts = [];
  if (act.length > 1) {
    parts.push('تنبيه بنيوي: حسابات هذه العيادة بعملتين منفصلتين (ليرة سورية ودولار أمريكي). ' +
               'كل قسم أدناه طبقة عملة مستقلة تماماً — يُمنع منعاً باتاً جمع أو طرح أو مقارنة أو تحويل أي رقم بين الطبقتين، ' +
               'ويُنسب كل رقم لعملته كما هو موسوم حرفياً.');
  }
  for (var i = 0; i < act.length; i++) {
    var cur = act[i];
    var L = layers[cur];
    _renderCur = cur;
    if (act.length > 1) {
      parts.push('— طبقة ' + (cur === 'USD' ? 'الدولار ($)' : 'الليرة السورية (ل.س)') + ' —');
    }
    var fullSessions = sessions;
    sessions = _filterCur(fullSessions, cur);
    try {
      parts.push(buildDigestFacts(from, to, L.summary, L.totals, L.netProfit, L.profitMargin,
                                  L.adj, L.netRevenue, L.netProduction, L.collectionRate, L.breakdown));
    } finally {
      sessions = fullSessions;
      _renderCur = null;
    }
  }
  return parts.join('\n');
}

var _accLastRange = null;   // v546: الفترةُ المرسومة فعلاً — التصديرُ يتبعها لا حقلي التاريخ غير المطبَّقين

  // بند #8 — بطاقة واحدة (معرّفاتها فريدة)؛ الحقائق تحمل كل الطبقات النشطة

  // قديم فوق أرقام جديدة أسوأ من لا ملخّص.
  lastDigest = '';
  lastDigestWarn = '';
  digestFacts = buildDigestFactsAllLayers(from, to, layers, act);

  // M126/M129: بطاقة الإجمالي الموحّد — تظهر فقط عند نشاط العملتين معاً. تجمع مخرجاتِ
  // الطبقتين الجاهزة (لا مدخلاتهما) بسعرٍ يدويّ للتقارير حصراً — المحرّك لا
  // يُلمس، والرقم الموحّد لا يدخل حقائق الملخّص الذكي (قاعدة منع الخلط سارية).
  // موضعُها فوق فاصل «معلومات إضافية» بقرار المالك بعد استعمالٍ حيّ: دفنُها خلف
  // كل البطاقات المرجعية كان يفرض السكرول لآخر الصفحة لبلوغ رقم الجرد. وعقد
  // v160 محفوظ لا مخروق: هذه **إعادةُ عرضٍ للقوائم الأساسية** بوحدةٍ واحدة، لا
  // حسابَ مذكّرة — وحساباتُ المذكّرة الحقيقية (المواد · ذمم المخابر · الرصيد
  // غير المكتسب) تبقى وحدها تحت الفاصل.
  html += renderUnifiedReportCard(layers, act);

  // المعلومات التكميلية — ثلاث بطاقات خارج معادلة الربح تماماً، لكل طبقة
  // قيمُها بعملتها. كلٌّ منها يُرجِع '' عند انعدام قيمته، فالفاصل يُطبع مرة
  // واحدة فقط إذا بقي منها محتوى (عقد v160 محفوظ حرفياً بالعيادة الأحادية).
  var suppAll = '';
  act.forEach(function(cur){

    var s1 = renderAgingSection(cur) +   // v507: ذمم المرضى (تقادم) — عرض فقط، خارج كل المعادلات
             renderMaterialCostSection() +

             renderUnearnedSection(layers[cur].summary);
    if (s1 && dual) s1 = renderCurrencyHeader(cur) + s1;
    suppAll += s1;
    _renderCur = null;
  });
  if (suppAll) html += renderSupplementaryDivider() + suppAll;

  _setBody(html);

  // Animate bars
  setTimeout(function(){
    document.querySelectorAll('.bar-fill').forEach(function(el){
      var w = el.getAttribute('data-w');

  // Update debug panel if open
  refreshDebugPanel();
}


// ═══ v546 — تصديرُ المحاسبة إلى Excel (جولة التقارير، البند 7) ═══════════════════
// لا معادلةَ ثانية (#684): كلُّ رقمٍ يُقرأ من computeLayersByCurrency() — الطبقاتُ نفسها التي ترسم الصفحة —
// ومن computeTrend(cur) وagingResult كما تُرسم؛ هذه الدالّة ترتّب الصفوف فقط. كلُّ صفٍّ موسومٌ بعملته، والنسبُ
// أرقامٌ بالمئة كما تُعرض. الفترةُ هي المطبَّقة (_accLastRange) لا حقلا التاريخ.
function _accNum(n) { return (n === null || n === undefined || isNaN(n)) ? '' : Math.round(Number(n) * 100) / 100; }
function _accCurLbl(cur) { try { return window.SyDentCurrency.labelOf(cur); } catch (e) { return cur === 'USD' ? '$' : 'ل.س'; } }
function buildAccSheets() {
  var R = _accLastRange, layers = computeLayersByCurrency(), act = layers._active;
  var sum = [], exp = [], prov = [], trend = [], aging = [], credit = [];
  act.forEach(function(cur){
    var L = layers[cur], s = L.summary, t = L.totals, a = L.adj || { chargeReductions: 0, refundsTotal: 0 }, c = _accCurLbl(cur);
    sum.push([c, 'الإيرادات المحصّلة', _accNum(s.revenue)]);
    if (a.refundsTotal > 0) sum.push([c, 'صافي الإيراد بعد الاسترداد', _accNum(L.netRevenue)]);
    sum.push([c, 'الإنتاج المنجز', _accNum(s.production)]);
    if (a.chargeReductions > 0) sum.push([c, 'صافي الإنتاج بعد الخصم', _accNum(L.netProduction)]);
    sum.push([c, 'معدّل التحصيل %', _accNum(L.collectionRate)]);
    sum.push([c, 'المصروفات الإجمالية', _accNum(t.totalExpenses)]);
    sum.push([c, L.netProfit >= 0 ? 'صافي الربح' : 'صافي الخسارة', _accNum(Math.abs(L.netProfit))]);
    sum.push([c, 'هامش الربح %', _accNum(L.profitMargin)]);
    if (a.chargeReductions > 0) sum.push([c, 'خصومات وإعفاءات', _accNum(a.chargeReductions)]);
    if (a.refundsTotal > 0) sum.push([c, 'مبالغ مستردّة', _accNum(a.refundsTotal)]);
    if (s.unearnedTotal > 0) sum.push([c, 'مدفوعات مقدّمة (غير مكتسبة)', _accNum(s.unearnedTotal)]);
    (L.breakdown || []).forEach(function(b){
      exp.push([c, b.name, _accNum(b.amount), t.totalExpenses > 0 ? _accNum(b.amount / t.totalExpenses * 100) : '']);
    });
    (L.providerRows || []).forEach(function(p){
      prov.push([c, p.isUnassigned ? 'بلا طبيب محدد' : p.name, p.sessionCount, _accNum(p.production), _accNum(p.labCost), _accNum(p.collection), _accNum(p.paidOut), _accNum(p.clinicNet)]);
    });
    (computeTrend(cur) || []).forEach(function(m){
      trend.push([c, m.label, _accNum(m.production), _accNum(m.revenue), _accNum(m.netProduction), _accNum(m.collectionRate)]);
    });
    var ag = agingResult && agingResult[cur];
    if (ag && ag.due) ag.due.rows.forEach(function(r){
      aging.push([c, r.name, r.phone || '', _accNum(r.total)].concat(r.b.map(_accNum)).concat([r.oldestDate || '']));
    });
    if (ag && ag.credit) ag.credit.rows.forEach(function(r){ credit.push([c, r.name, r.phone || '', _accNum(r.amount)]); });
  });
  var stamp = SyDT.numDate(new Date()) + ' ' + SyDT.hm(new Date().toISOString());
  sum.push([]); sum.push(['الفترة', R.from + ' ← ' + R.to, '']); sum.push(['أُنشئ', stamp, '']);
  var bk = (window.SyDentAging && window.SyDentAging.BUCKETS) ? window.SyDentAging.BUCKETS.map(function(b){ return b.label; }) : ['1', '2', '3', '4'];
  var sheets = [
    { name: 'الملخّص', headers: ['العملة', 'البند', 'القيمة'], rows: sum, cols: [{wch:7},{wch:30},{wch:18}] },

    { name: 'الأطباء', headers: ['العملة', 'الطبيب', 'الجلسات', 'الإنتاج', 'المخبر', 'التحصيل', 'المدفوع له', 'صافي العيادة'], rows: prov, cols: [{wch:7},{wch:22},{wch:9},{wch:14},{wch:12},{wch:14},{wch:14},{wch:14}] }
  ];
  if (trend.length) sheets.push({ name: 'الاتجاه الشهري', headers: ['العملة', 'الشهر', 'الإنتاج', 'الإيراد', 'صافي الإنتاج', 'معدّل التحصيل %'], rows: trend, cols: [{wch:7},{wch:14},{wch:14},{wch:14},{wch:14},{wch:16}] });
  if (aging.length) sheets.push({ name: 'تقادم الذمم', headers: ['العملة', 'المريض', 'الهاتف', 'المستحق'].concat(bk).concat(['أقدم استحقاق']), rows: aging });

var _accExportBusy = false;
