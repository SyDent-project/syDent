// ─── Payout modal ───
// Payout recording (paying a doctor their share/salary) is an owner-only
// financial action. Non-owners (doctor/secretary device modes) must never
// record, edit, or delete a payout. fail-open: if the lock system isn't
// present at all, treat as owner (single-owner install).
function poIsOwner() {
  return !window.SyDentLock || window.SyDentLock.isOwner();
}

function openPayoutModal(provId, cur) {
  if (cur) { withCurrencyLayer(cur, function(){ _openPayoutModalCore(provId); }); return; }
  _openPayoutModalCore(provId);
}
function _openPayoutModalCore(provId) {
  if (!poIsOwner()) { showToast('هذا الإجراء متاح للمالك فقط'); return; }
  var d = doctors.find(function(x){ return x.id === provId; });
  if (!d) return;
  if (d.is_owner) { showToast('المالك هو الدافع لا المستفيد — أرباحك ليست دفعة'); return; }

  // Calculate current stats and suggested amount (remaining unpaid)
  var stats = computeProviderStats(provId);
  var payout = computePayout(d, stats);
  var from = document.getElementById('fromDate').value;
  var to   = document.getElementById('toDate').value;
  // v306: المقترح = الرصيد الختامي التراكمي (مرحَّل + مستحق الفترة − مدفوع)،
  // فدفعةُ الشهر الماضي المسدَّدة هذا الشهر لا تُقترَح مرتين، والمتأخّر من قبل لا يضيع.
  // v382: «المدفوع» هنا بترتيب فترة الدفعة لا يوم تسديدها — دفعةُ أيلول المسجَّلة
  // 2 تشرين تخصّ أيلول فلا تُقترَح ثانيةً عند فتح أيلول بعدها (مرآةُ اقتراح
  // صفحة الرواتب)، وحصّةُ الإنتاج وحدها تُخصم (الراتبُ الثابت خارج هذا الدفتر).
  var openingDue = computeOpeningDue(d);
  var suggested;
  if (openingDue === null) {
    suggested = Math.max(0, payout - payoutsPaidInWindow(d.id, from, to));
  } else {
    var paidForPeriods = payouts.filter(function(po){
      return po.provider_id === d.id && po.period_start && po.period_start <= to;
    }).reduce(function(sum, po){ return sum + _payoutShareOf(po); }, 0);
    suggested = Math.max(0, openingDue + payout - paidForPeriods);
  }

  document.getElementById('payoutProviderId').value = d.id;
  document.getElementById('payoutProviderName').value = d.name + (d.is_active === false ? ' (معطل)' : '');
  document.getElementById('payoutFrom').value = from;
  document.getElementById('payoutTo').value = to;
  // Pre-fill with suggested amount (user can edit/clear)
  document.getElementById('payoutAmount').value = suggested > 0 ? (Math.round(suggested * 100) / 100) : '';
  document.getElementById('payoutAmount').placeholder = 'المقترح: ' + fmtSY(suggested);
  document.getElementById('payoutNotes').value = '';

  // F3: عملة المودال تُحفظ لحظة الفتح — الحفظ والحذف يعيدان رسم السجل خارج غلاف العملة،
  // وبدونها كانت القائمة تختلط بالعملتين وتُوسَم كلها بعملة العيادة (صنف v208).
  _payoutModalCur = _renderCur || null;
  renderPayoutHistory(provId);
  // M125: المودال يُفتح من داخل كتلة عملةٍ بعينها (غلاف withCurrencyLayer)،
  // فالعملة معروفة يقيناً ⇒ المبدّل يُقفَل عليها بدل أن يُترك للاختيار:
  // دفعةُ طبيبٍ محسوبةٌ من أرقام طبقةٍ لا يجوز أن تُسجَّل بعملة أخرى.
  try {
    window.SyDentCurPick.mount('payoutAmount');
    if (_renderCur) window.SyDentCurPick.lock('payoutAmount', _renderCur);
  } catch (e) {}
  openModal('payoutModal');
}

// F3: تنسيق مبلغ صفٍّ بوسم عملة الصف نفسه — مستقلٌّ عن طبقة الرسم النشطة.
function _fmtRowAmt(po) {
  var v = Math.round((Number(po.amount) || 0) * 100) / 100;
  var lbl = (_rowCur(po) === 'USD') ? '$' : 'ل.س';
  if (v % 1 === 0) return fmt(v) + ' ' + lbl;
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + lbl;
}
function renderPayoutHistory(provId) {
  // F3: فلترة بعملة المودال (إن عُرفت) — النداء من الحفظ/الحذف يقع خارج غلاف العملة
  // فمصفوفة payouts غير مفلترة هناك؛ والوسم يتبع عملة الصف نفسه لا عملة العيادة.
  var list = payouts.filter(function(po){
    if (po.provider_id !== provId) return false;
    if (_payoutModalCur && _rowCur(po) !== _payoutModalCur) return false;
    return true;
  });
  var el = document.getElementById('payoutHistoryList');
  if (!list.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text2);font-style:italic;text-align:center;padding:12px;">لا توجد دفعات سابقة</div>';
    return;
  }
  el.innerHTML = list.map(function(po){
    return '<div class="payout-history-item">'
      + '<div>'
        + '<div class="amt">' + _fmtRowAmt(po) + '</div>'
        + '<div class="meta">' + escapeHtml(SyDT.numDate(po.period_start)) + ' ← ' + escapeHtml(SyDT.numDate(po.period_end)) + (po.notes ? ' • ' + escapeHtml(po.notes) : '') + '</div>'
      + '</div>'
      + '<div class="phi-when">' + SyDT.cell(po.paid_at || po.created_at) + '</div>'   /* v477: متى دُفعت — تاريخاً ووقتاً */
      + '<div class="sy-acts"><button class="sy-act sy-act-danger" onclick="deletePayout(\'' + po.id + '\')" title="حذف الدفعة">🗑️ حذف</button></div>'
    + '</div>';
  }).join('');
}

/* ═══ v299 — قفلُ الأزرار الكاتبة (مرآةُ ppGuarded) ═══ */
var _rInFlight = {};
function rGuarded(name, inner, label) {
  return async function () {
    var k = name + ((arguments.length && (typeof arguments[0] === 'string' || typeof arguments[0] === 'number')) ? ':' + arguments[0] : '');
    if (_rInFlight[k]) return;
    var btn = null;
    try { var ev = window.event; var t = ev && (ev.currentTarget || ev.target); if (t && t.closest) btn = t.closest('button'); } catch (_) {}
    if (!btn && document.activeElement && document.activeElement.tagName === 'BUTTON') btn = document.activeElement;
    _rInFlight[k] = true;
    var old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; if (label) btn.textContent = (old.trim().length <= 3) ? '⏳' : label; }
    try { return await inner.apply(this, arguments); }
    finally { delete _rInFlight[k]; if (btn) { btn.disabled = false; btn.textContent = old; } }
  };
}
var savePayout = rGuarded('savePayout', _savePayout_inner, 'جارٍ الحفظ…');   /* v299 */
async function _savePayout_inner() {
  if (!poIsOwner()) { showToast('هذا الإجراء متاح للمالك فقط'); return; }
  var provId = document.getElementById('payoutProviderId').value;
  var from   = document.getElementById('payoutFrom').value;
  var to     = document.getElementById('payoutTo').value;
  var amount = parseFloat(document.getElementById('payoutAmount').value);
  var notes  = document.getElementById('payoutNotes').value.trim();

  if (!from || !to) { showToast('⚠️ اختر الفترة'); return; }
  if (!amount || amount <= 0) { showToast('⚠️ أدخل مبلغاً صحيحاً'); return; }

  var payload = {
    owner_id: currentUser.id,
    provider_id: provId,
    period_start: from,
    period_end: to,
    amount: amount,
    notes: notes || null,
    currency: window.SyDentCurPick.read('payoutAmount')   // M125
  };

  var res = await window.sb.from('provider_payouts').insert(payload).select().single();
  if (res.error) {
    if (res.error.code === '42P01' || (res.error.message && res.error.message.indexOf('provider_payouts') >= 0)) {
      showToast('⚙️ يجب تشغيل SQL أولاً (جدول provider_payouts)');
    } else {
      showToast('⚠️ فشل الحفظ: ' + res.error.message);
    }
    return;
  }
  if (res.data) payouts.unshift(res.data);
  renderPayoutHistory(provId);
  document.getElementById('payoutAmount').value = '';
  document.getElementById('payoutNotes').value = '';
  showToast('✅ تم تسجيل الدفعة');

  // Phase 7.2: audit log fires from both provider-reports (quick path)
  // and payouts.html (full path). Same action_type, same registry.
  try {
    if (window.logAudit) {
      var doc = doctors.find(function(x){ return x.id === provId; });
      var docName = doc ? doc.name : '—';
      window.logAudit('payout.create', {
        entity_type: 'payout',
        entity_id: res.data ? res.data.id : null,
        description: 'دفعة لـ ' + docName + ' (' + fmtSY(payload.amount) + ')',
        new_value: {
          provider_id: provId,
          provider_name: docName,
          period_start: payload.period_start,
          period_end: payload.period_end,
          amount: payload.amount
        }
      });
    }
  } catch (e) { console.warn('audit log failed:', e); }

  render();  // Refresh provider cards to show paid amount
}

var deletePayout = rGuarded('deletePayout', _deletePayout_inner, 'جارٍ الحذف…');   /* v299 */
async function _deletePayout_inner(id) {
  if (!poIsOwner()) { showToast('هذا الإجراء متاح للمالك فقط'); return; }
  if (!await SyDialog.confirm({ message: 'حذف هذه الدفعة؟', danger: true })) return;
  // Snapshot for audit BEFORE delete
  var snapshot = payouts.find(function(po){ return po.id === id; });
  var snapDoc  = snapshot ? doctors.find(function(x){ return x.id === snapshot.provider_id; }) : null;
  var snapName = snapDoc ? snapDoc.name : '—';
  var snapAmt  = snapshot ? Number(snapshot.amount) || 0 : 0;

  var res = await window.sb.from('provider_payouts').delete().eq('id', id);
  if (res.error) { showToast('⚠️ فشل الحذف: ' + res.error.message); return; }
  payouts = payouts.filter(function(po){ return po.id !== id; });
  // Find which provider we're showing
  var provId = document.getElementById('payoutProviderId').value;
  renderPayoutHistory(provId);
  showToast('🗑️ تم الحذف');

  // Audit log (fire-and-forget; snapshot from BEFORE the delete)
  try {
    if (window.logAudit) {
      window.logAudit('payout.delete', {
        entity_type: 'payout',
        entity_id: id,
        description: 'حذف دفعة لـ ' + snapName + ' (' + fmtSY(snapAmt) + ')',
        old_value: snapshot || null
      });
    }
  } catch (e) { console.warn('audit log failed:', e); }

  render();
}

/* v451: «تسجيل دفعة للطبيب» (ستةُ حقول) كان يُغلق بنقرةٍ خارجية فيمحو ما كُتب.
   أُزيل المستمعُ المستنديّ — والنقرُ الخارجي بقي لنافذتَي القراءة (تفاصيلُ
   الجلسات · كشفُ الحساب) بسمةٍ صريحةٍ على كلٍّ منهما. */

// ═══ v307 — حفظُ الفلتر بالرابط (قابلٌ للمشاركة/العودة) ═══
// الأساسُ يبقى بـlocalStorage (F6)؛ الرابطُ يحمل الفترة والطبيب والنوع والحالة والمعطّلين.
var _urlProvider = null;   // معرّفُ طبيبٍ من الرابط يُطبَّق بعد بناء القائمة (loadAll)
function syncUrl() {
  try {
    var q = new URLSearchParams();
    var preset = activePresetKey();
    if (preset) q.set('preset', preset);
    q.set('from', document.getElementById('fromDate').value);
    q.set('to',   document.getElementById('toDate').value);
    var prov = document.getElementById('providerFilter').value;
    if (prov && prov !== 'all') q.set('provider', prov);
    var pt = document.getElementById('providerTypeFilter'); if (pt && pt.value !== 'all') q.set('type', pt.value);
    var st = document.getElementById('statusFilter').value;  if (st !== 'completed') q.set('status', st);
    var ia = document.getElementById('inactiveFilter').value; if (ia !== 'hide') q.set('inactive', ia);
    if (rptTab !== 'prov') q.set('tab', rptTab);   // v539 · v540
    history.replaceState(null, '', location.pathname + '?' + q.toString());
  } catch (e) {}
}
// يُستدعى قبل loadAll — يُرجِع true إن حمل الرابطُ فترةً (فلا يُطبَّق افتراضيُّ «هذا الشهر»).
function applyUrlParams() {
  try {
    var q = new URLSearchParams(location.search);
    var ok = /^\d{4}-\d{2}-\d{2}$/;
    var from = q.get('from'), to = q.get('to'), preset = q.get('preset');
    var pt = q.get('type'), st = q.get('status'), ia = q.get('inactive');
    var _tq = q.get('tab');
    if (_tq && _tq !== 'prov' && Object.prototype.hasOwnProperty.call(RPT_SUB, _tq)) setRptTab(_tq, true);   // v539+
    if (pt && document.querySelector('#providerTypeFilter option[value="' + pt.replace(/[^a-z_]/g, '') + '"]')) document.getElementById('providerTypeFilter').value = pt;
    if (st === 'completed_planned') document.getElementById('statusFilter').value = st;
    if (ia === 'show') document.getElementById('inactiveFilter').value = ia;
    _urlProvider = q.get('provider') || null;
    // الفترةُ المسمّاة تُعاد حسابُها لليوم (رابطُ «هذا الشهر» المحفوظ أمس يعني هذا الشهر اليوم)
    if (preset && PRESETS.some(function(p){ return p.key === preset; })) {
      var r = presetRange(preset);
      document.getElementById('fromDate').value = r.from;
      document.getElementById('toDate').value   = r.to;
      markPreset(preset);
      return true;
    }
    if (from && to && ok.test(from) && ok.test(to) && from <= to) {
      document.getElementById('fromDate').value = from;
      document.getElementById('toDate').value   = to;
      markPreset('');
      return true;
    }
  } catch (e) {}
  return false;
}

// ═══ v307 — تصدير CSV (بطاقةٌ = صفّ، لكل طبقة عملة) ═══
// أرقامٌ خام بلا تنسيق (Excel يقرؤها أرقاماً)، BOM للعربية، CRLF.
function _csvCell(v) {

function _csvNum(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function buildCsvRows() {

  var to   = document.getElementById('toDate').value;

  var rows = [['العملة','الطبيب','النوع','النسبة %','عدد الجلسات','الإنتاج','تكلفة المخبر','الصافي بعد المخبر',

  var vis = getVisibleDoctors().list;
  var act = _activeCursPR();

  act.forEach(function(cur){
    var run = function(){

        var st = computeProviderStats(d.id);
        var due = computePayout(d, st);
        var paid = payoutsPaidInWindow(d.id, from, to);
        var opening = computeOpeningBalance(d, from);
        var closing = (opening === null) ? (due - paid) : (opening + due - paid);

        rows.push([cur || (window.SyDentCurrency && window.SyDentCurrency.code ? window.SyDentCurrency.code() : 'SYP'),
          d.name, d.provider_type || 'doctor', resolveSharePercent(d), st.sessionCount,

          _csvNum(getShareBase(st)), _csvNum(due), opening === null ? '' : _csvNum(opening), _csvNum(paid),
          d.is_owner ? '' : _csvNum(closing), d.is_owner ? 'مالك' : bs.txt]);

}

  ['SYP', 'USD'].forEach(function(cur){

        g.n += x.n; g.bag[cur] += x.prod;
      });

  var g = function(o, k){ return o ? o[k] : null; };
  var clinic = _newClinicScope();
  var sections = [
    { title: '💰 المال', rows: [
      { label: 'الإنتاج', kind: 'bag', cur: M.cur.prod, prev: g(M.prev, 'prod'), ly: g(M.ly, 'prod') },

    ] }
  ];
  var top = Object.keys(M.cur.rows).map(function(k){ return M.cur.rows[k]; })
    .sort(function(a, b){ return (b.n - a.n) || ((b.bag.SYP + b.bag.USD) - (a.bag.SYP + a.bag.USD)); }).slice(0, 5);
  var nd = function(d){ return SyDT.numDate(d); };
  var notes = [];
  if (W.ly && _sumData.lyFailed) notes.push('⚠️ تعذّر تحميل السنة الماضية — عمودُها «—».');

  var scope = _trtScopeLabel().replace(/^[^·]*· /, '');
  return {

      + (W.ly ? ' · السنة الماضية ' + nd(W.ly.from) + ' ← ' + nd(W.ly.to) : ''),
    cols: { cur: 'الفترة', prev: 'السابقة', ly: 'السنة الماضية' },

  };
}
function _sumVal(r, v) {
  if (v === null || v === undefined) return '—';
  if (r.kind === 'bag') return escapeHtml(_newBag(v));
  if (r.kind === 'pct') return '<bdi dir="ltr">' + Math.round(v * 100) + '%</bdi>';
  return escapeHtml(fmt(v));
}
function _sumPlain(r, v) {
  if (v === null || v === undefined) return '—';
  if (r.kind === 'bag') return _newBag(v);
  if (r.kind === 'pct') return Math.round(v * 100) + '%';
  return fmt(v);
}
function renderSum() {
  var host = document.getElementById('sumHost');
  if (!host || rptTab !== 'sum') return;
  if (!window.SyRptSum || !window.SyRptRet || !window.SyRptNew || !window.SyRptAtt || !window.SyRptTreat) {
    host.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div><div class="ttl">تعذّر تحميل التقرير — حدّث الصفحة</div></div>';
    return;
  }
  var loading = '<div class="empty-state"><div class="ic">⏳</div><div class="ttl">جارٍ التحميل…</div></div>';
  if (!_prLoaded || !currentUser || !trtCatalog) { host.innerHTML = loading; return; }
  if (!priorCtx) {
    host.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div><div class="ttl">تعذّر تحميل تاريخ العيادة قبل الفترة</div><div style="margin-top:6px;">حدّث الصفحة.</div></div>';
    return;
  }
  var key = _newKey();
  if (!_sumData || _sumData.key !== key) { host.innerHTML = loading; loadSumData(key); return; }
  if (_sumData.loading) { host.innerHTML = loading; return; }
  _sumLast = _sumModel();
  host.innerHTML = window.SyRptSum.render(_sumLast, { val: _sumVal, bag: function(b){ return escapeHtml(_newBag(b)); } });
}
async function _sumCopy() {
  if (!_sumLast) return;
  var txt = window.SyRptSum.text(_sumLast, { plain: _sumPlain });
  try { await navigator.clipboard.writeText(txt); showToast('📋 نُسخ الملخّص — الصقه بالواتساب'); return; } catch (e) {}
  try {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('📋 نُسخ الملخّص — الصقه بالواتساب');
  } catch (e2) { showToast('⚠️ تعذّر النسخ'); }
}
function _sumPrint() {
  document.body.classList.add('printing-sum');
  var done = function(){ document.body.classList.remove('printing-sum'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  try { window.print(); } finally { setTimeout(done, 1500); }
}
document.addEventListener('click', function(e){
  var b = e.target && e.target.closest && e.target.closest('#sumHost [data-rs]');
  if (!b) return;
  if (b.getAttribute('data-rs') === 'print') _sumPrint(); else _sumCopy();
});
async function exportSumExcel() {
  if (!_sumLast) { showToast('لا بيانات للتصدير بعد'); return; }
  var btn = document.getElementById('exportXlsxBtn');

  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التصدير…'; }
  try {
    var S = _sumLast, rows = [];
    S.sections.forEach(function(sec){
      sec.rows.forEach(function(r){ rows.push([sec.title.replace(/^[^\u0600-\u06FF]+/, ''), r.label, _sumPlain(r, r.cur), _sumPlain(r, r.prev), _sumPlain(r, r.ly)]); });
    });
    rows.push([]);
    rows.push(['', S.sub, '', '', '']);
    var from = document.getElementById('fromDate').value, to = document.getElementById('toDate').value;
    var kind = await window.SyDentXlsx.save({
      headers: ['القسم', 'البند', S.cols.cur, S.cols.prev, S.cols.ly], rows: rows,
      filename: 'ملخص-الفترة-' + from + '_' + to, sheetName: 'ملخص الفترة',
      cols: [{wch:12},{wch:20},{wch:24},{wch:24},{wch:24}]

  } catch (e) { console.error('exportSumExcel:', e); showToast('⚠️ تعذّر التصدير'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

  if (rptTab === 'treat') return exportTreatExcel();   // v539: التصديرُ يتبع التبويبَ الظاهر
  if (rptTab === 'new') return exportNewExcel();       // v540

  // v309: xlsx حقيقي عبر المصدر الواحد SyDentXlsx (تحميلٌ كسول للمكتبة + احتياط TSV بلا إنترنت).

(async function init() {
  initSidebar('provider-reports');

  var user = await window.sbRequireAuth();
  if (!user) return;
  currentUser = user;

  // Phase 4: Lock guard — Owner + Doctor only (Secretary blocked)
  if (window.SyDentLock && !window.SyDentLock.guardPage(['owner', 'doctor'])) return;

  // F6: استرجاع أساس الحساب المحفوظ (المالك يعمل على «الصافي» — كان يرجع «الإنتاج» بكل تحميل).
  try {
    var savedBasis = localStorage.getItem('sydent_pr_basis');
    if (savedBasis === 'net' || savedBasis === 'collection' || savedBasis === 'production') {
      basis = savedBasis;
      document.querySelectorAll('.basis-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.getAttribute('data-basis') === savedBasis);
      });
      var _bh = document.getElementById('basisHelp');
      if (_bh) _bh.innerHTML = BASIS_HELP[savedBasis] || BASIS_HELP.production;
    }
  } catch (e) {}

  try { if (localStorage.getItem('sydent_rt_sort') === 'count') rptSort = 'count'; } catch (e) {}   // v539
  document.body.setAttribute('data-rpt-tab', rptTab);
  // v307: الفترات من الجدول؛ الرابطُ (إن حمل فلتراً) يغلب الافتراضي «هذا الشهر».
  renderPresetRow();
  if (!applyUrlParams()) {
    var _r0 = presetRange('this_month');
    document.getElementById('fromDate').value = _r0.from;
    document.getElementById('toDate').value   = _r0.to;
    markPreset('this_month');
  }

  _prStartEarly();   /* v553: بياناتُ الفترة تبدأ الآن — الرسمُ ينتظر الفحص أدناه وقائمةَ الأطباء */
  _prDocsEarly = _prSettle(_prDoctorsQuery());   /* v553: وقائمةُ الأطباء معها */

  // Ensure SyDentLock's employee+doctor caches are loaded BEFORE the
  // inactive check — otherwise the check returns false on null cache and
  // the guard silently passes. autoInit preloads these in parallel — await
  // them explicitly here so timing is deterministic.
  if (window.SyDentLock) {
    /* DeepCode #1 (v552): الذاكرتان مستقلتان — تُنتظران معاً (جولةٌ لا جولتان)؛ كلتاهما قبل الفحص كما كان. */
    await Promise.all([
      (typeof window.SyDentLock.loadEmployees === 'function') ? Promise.resolve().then(function(){ return window.SyDentLock.loadEmployees(); }).catch(function(){}) : null,
      (typeof window.SyDentLock.loadDoctors === 'function') ? Promise.resolve().then(function(){ return window.SyDentLock.loadDoctors(); }).catch(function(){}) : null
    ]);
  }

  // HARD GUARD: if the locked doctor's employee account is inactive,
  // replace the main content with an empty state BEFORE loadAll runs.
  // The autoInit banner+pill handle the rest of the device-wide UX.
  if (window.SyDentLock && window.SyDentLock.isDoctor()
      && typeof window.SyDentLock.isDoctorAccountInactive === 'function'
      && window.SyDentLock.isDoctorAccountInactive()) {
    var mainEl = document.getElementById('sbMainContent') || document.querySelector('.main');
    if (mainEl) {
      mainEl.innerHTML =
        '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;font-family:\'Cairo\',sans-serif;">' +
          '<div style="font-size:72px;line-height:1;margin-bottom:20px;">🔒</div>' +
          '<div style="font-size:20px;font-weight:800;color:#e1f4ee;margin-bottom:12px;">' +
            'تقارير الأطباء غير متاحة' +
          '</div>' +
          '<div style="font-size:13px;color:#8a9ab5;line-height:1.8;max-width:420px;">' +
            'حسابك معطّل من قِبَل صاحب العيادة. ' +
            'الرجاء التواصل معه لإعادة التفعيل.' +
          '</div>' +
          '<a href="index.html" style="margin-top:28px;padding:12px 28px;background:var(--green);border-radius:10px;color:var(--on-accent);font-size:14px;font-weight:800;text-decoration:none;">' +
            '↩ العودة للصفحة الرئيسية' +
          '</a>' +
        '</div>';
    }
    _prCancelEarly();   /* v553 */
    return;
  }

  await loadAll();

  // Phase 4: Doctor mode auto-filter (lock the provider dropdown to the doctor's own id)
  applyDoctorModeFilter();
})();

// Phase 4: When in Doctor mode, force the provider filter to the doctor's id
// and disable the dropdown. Visible-but-locked pattern (transparency for the
// doctor: "I see why I can't change this — I'm in Doctor mode").
function applyDoctorModeFilter() {
  if (!window.SyDentLock || !window.SyDentLock.isDoctor()) return;
  var sel = document.getElementById('providerFilter');
  if (!sel) return;
  // Phase 5: resolve effective doctor id (LS_DOCTOR_ID or employee.doctor_id)
  var did = (typeof window.SyDentLock.getEffectiveDoctorId === 'function')
    ? window.SyDentLock.getEffectiveDoctorId()
    : window.SyDentLock.getDoctorId();
  if (!did) return;

  // Also lock the inactive filter — in Doctor mode, viewing only your own
  // data means the inactive-doctors toggle is irrelevant + could trigger
  // rebuilds that drop your locked id from the options.
  var inactiveSel = document.getElementById('inactiveFilter');
  if (inactiveSel && !inactiveSel.disabled) {
    inactiveSel.value = 'show'; // always include the doctor's own id in dropdown
    inactiveSel.disabled = true;
    inactiveSel.style.opacity = '0.7';
    inactiveSel.style.cursor = 'not-allowed';
    inactiveSel.title = 'مقفول في وضع الطبيب';
  }

  // Ensure the option exists (in case the filter dropdown was repopulated)
  var hasOpt = false;
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === did) { hasOpt = true; break; }
  }
  if (hasOpt) {
    sel.value = did;
    sel.disabled = true;
    sel.style.opacity = '0.7';
    sel.style.cursor = 'not-allowed';
    sel.title = 'الفلتر مقفول على إنتاجك في وضع الطبيب';
    onFilterChange();
  } else {
    // Doctor id not found in clinic_doctors list (deactivated or deleted).
    // CRITICAL: don't let the doctor see other providers' data. Inject a
    // hidden invalid option so render() finds nothing.
    // The global "حسابك معطّل" banner is shown by supabase-init.js
    // (Phase 4.1 applyInactiveDoctorUI). No need to duplicate it here.
    console.warn('[SyDentLock] Doctor mode: doctor id not in clinic_doctors list — forcing empty state');
    var opt = document.createElement('option');
    opt.value = did;
    opt.textContent = 'حسابك معطّل — لا تظهر بيانات';
    sel.appendChild(opt);
    sel.value = did;
    sel.disabled = true;
    sel.style.opacity = '0.7';
    sel.style.cursor = 'not-allowed';
    sel.title = 'حسابك غير نشط — تواصل مع المالك';
    onFilterChange();
  }
}
