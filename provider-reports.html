<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>التقارير — SyDent</title>
<!-- Theme system: MUST load before inline <style>
/* ── Modal ── v451: التعريف المحلي حُذف — الصفحة على عُدّة SyDent الموحّدة
   (SYDENT MODAL KIT بـtheme.css بالفئة sy-m، والسلوك بـsidebar.js). */
 to apply data-theme synchronously and prevent FOUC. -->
<script src="theme.js?v=20261005a"></script>
<script src="/vendor/supabase-2.110.8.min.js"></script>
<script src="supabase-init.js?v=20261005a"></script>
<script src="sy-modal.js?v=20261005a"></script>
<script src="sidebar.js?v=20261005a"></script>
<script src="rpt-treat.js?v=20261005a"></script>
<script src="rpt-newpt.js?v=20261005a"></script>
<script src="rpt-att.js?v=20261005a"></script>
<script src="rpt-ret.js?v=20261005a"></script>
<script src="rpt-sum.js?v=20261005a"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1628;--bg2:#0f2038;--bg3:#132840;
  --border:rgba(var(--green-rgb),0.15);
  --green:var(--green);--red:#ef5350;--yellow:#f5c842;
  --blue:#63b3ed;--purple:#a78bfa;--orange:#fb923c;
  --text:#e1f4ee;--text2:#8a9ab5;--radius:12px;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;gap:12px;
}
.tb-title{font-size:18px;font-weight:800;color:var(--green);}
.tb-sub{font-size:12px;color:var(--text2);margin-top:2px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:10px;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;border:none;transition:all .2s;
}
.btn-primary{background:var(--green);color:var(--bg);}
.btn-primary:hover{background:var(--green2);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-sm{padding:7px 14px;font-size:12px;}

.page{padding:24px 28px;max-width:1300px;margin:0 auto;}

/* Filters bar */
.filters-bar{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;
  margin-bottom:20px;
  display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;align-items:end;
}
.filter-group label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.3px;}
.filter-group input,.filter-group select{
  width:100%;padding:9px 11px;
  background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  font-family:'Cairo',sans-serif;font-size:13px;
}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--green);}

/* Quick presets */
.preset-row{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;
}
.preset-btn{
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);
  padding:6px 12px;border-radius:18px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;transition:all .15s;
}
.preset-btn:hover{border-color:var(--green);color:var(--green);}
.preset-btn.active{background:var(--green-dim,rgba(var(--green-rgb),0.12));border-color:var(--green);color:var(--green);}

/* Calc-basis toggle */
.basis-toggle{
  display:flex;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:3px;
  margin-bottom:20px;
}
.basis-btn{
  flex:1;padding:10px 12px;background:transparent;border:none;
  color:var(--text2);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;
  border-radius:8px;cursor:pointer;transition:all .15s;
}
.basis-btn:hover{color:var(--text);}
.basis-btn.active{background:var(--green);color:var(--bg);}
/* v310: شرحُ الأساس صار لافتةً مقروءة (كان 11px مائلاً بـ--text2 — المالك لم يستطع قراءته) */
.basis-help{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.7;color:var(--text);
  background:var(--blue-soft);border:1px solid var(--blue-bd);   /* v376: unified tokens */
  border-radius:10px;padding:10px 12px;margin-top:8px;}
.basis-help .ic{flex:none;font-size:14px;line-height:1.4;}
.basis-help b{color:var(--blue-fg);font-weight:800;}
.basis-help .eq{display:block;margin-top:3px;color:var(--text2);font-size:11.5px;font-variant-numeric:tabular-nums;}

/* Summary stats */
.summary-row{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;margin-bottom:24px;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
}
.stat-card .lbl{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;letter-spacing:.3px;}
.stat-card .val{font-size:22px;font-weight:800;color:var(--text);font-family:'Cairo',sans-serif;}
.stat-card .sub{font-size:11px;color:var(--text2);margin-top:3px;}
/* v307: مقارنة بالفترة السابقة */
.stat-card .delta{font-size:10.5px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}
.stat-card .delta span{font-weight:500;color:var(--text3,var(--text2));}
.stat-card .delta.good{color:var(--green);}
.stat-card .delta.bad{color:var(--red);}
.stat-card .delta.flat{color:var(--text2);}
.stat-card.green{border-color:rgba(var(--green-rgb),0.35);}
.stat-card.green .val{color:var(--green);}
.stat-card.blue{border-color:var(--blue-bd);}
.stat-card.blue .val{color:var(--blue);}
.stat-card.orange{border-color:var(--orange-bd);}
.stat-card.orange .val{color:var(--orange);}

/* Provider cards */
.providers-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(380px, 1fr));
  gap:16px;
}
.prov-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.prov-card .color-bar{height:5px;width:100%;}
.prov-body{padding:18px 20px;}
.prov-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.prov-avatar{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#fff;flex-shrink:0;
}
.prov-name{font-size:15px;font-weight:800;color:var(--text);line-height:1.2;}
.prov-role{font-size:11px;color:var(--text2);margin-top:3px;}

.prov-rows{
  background:var(--bg);border-radius:8px;padding:12px 14px;
  border:1px solid rgba(var(--green-rgb),0.06);
  margin-bottom:12px;
}
.prov-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;padding:5px 0;
}
.prov-row .k{color:var(--text2);font-weight:600;}
.prov-row .v{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
.prov-row.divider{border-top:1px dashed rgba(var(--green-rgb),0.15);margin-top:4px;padding-top:8px;}
.prov-row.remaining{
  margin-top:4px;padding:5px 7px;border-radius:8px;border:1px solid transparent;
}
.prov-row.remaining.warn{background:var(--yellow-soft);border-color:var(--yellow-bd);}
.prov-row.remaining.warn .k,.prov-row.remaining.warn .v{color:var(--yellow-ink);}
.prov-row.remaining.ok{background:var(--green-soft);border-color:var(--green-bd);}
.prov-row.remaining.ok .k,.prov-row.remaining.ok .v{color:var(--green-fg);}
/* v306: رصيد مقدَّم لصالح العيادة (الطبيب قبض أكثر من مستحقه التراكمي) — أزرق لا أحمر: ليس خطأً بل حالة ذمّة */
.prov-row.remaining.info{background:var(--blue-soft);border-color:var(--blue-bd);}
.prov-row.remaining.info .k,.prov-row.remaining.info .v{color:var(--blue-fg);}
.prov-row .hint{display:block;font-size:9.5px;font-weight:500;color:var(--text3,var(--text2));margin-top:1px;}

.payout-box{
  background:rgba(var(--green-rgb),0.08);border:1px solid rgba(var(--green-rgb),0.3);
  border-radius:8px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.payout-box .lbl{font-size:11px;color:var(--text2);font-weight:600;}
.payout-box .amt{font-size:18px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;}
/* v306: صندوق الرصيد الختامي بثلاث حالات (مرآة تسمية ذمّة المخبر في labs.html) */
.payout-box.bal-warn{background:var(--yellow-soft);border-color:var(--yellow-bd);}
.payout-box.bal-warn .amt{color:var(--yellow-ink);}
.payout-box.bal-info{background:var(--blue-soft);border-color:var(--blue-bd);}
.payout-box.bal-info .amt{color:var(--blue-fg);}
.payout-box .sub{font-size:10px;color:var(--text2);margin-top:2px;}

.prov-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
/* v477: أزرارُ بطاقة الطبيب على طقم أزرار الصفوف (.sy-acts-grid) — «💵 تسجيل دفعة» أخضرُ الفعل الأساسي والباقي محايد */
/* v308: كشف حساب الطبيب */
/* v452: بطاقةُ الراتب الثابت — تمييزٌ بصريٌّ كي لا تُخلط بحساب الحصّة */
.prov-row.sal-row{background:var(--blue-soft);border:1px solid var(--blue-bd);border-radius:10px;padding:8px 10px;margin:6px 0;}
.prov-row.sal-row .k{color:var(--text);font-weight:700;}
.prov-row.sal-row .hint b{color:var(--blue-ink,var(--blue));}
.ledger-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.ledger-chip{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
.ledger-chip .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
.ledger-chip .l{font-size:10.5px;color:var(--text2);margin-top:2px;}
.ledger-chip.warn .v{color:var(--yellow);} .ledger-chip.info .v{color:var(--blue);} .ledger-chip.ok .v{color:var(--green);}
.ledger-tbl td.sub{font-size:10.5px;color:var(--text2);}
.ledger-tbl tr.open td,.ledger-tbl tr.close td{font-weight:800;background:rgba(var(--green-rgb),0.06);}
/* v452: المعنى قبل اللون — ما **يزيد** مستحقَّ الطبيب أخضرُ بإشارة +، وما
   **ينقصه** (خصمُ مخبر · دفعةٌ سُدّدت له) أحمرُ بإشارة −، ومفتاحُ الألوان
   مكتوبٌ فوق الجدول. كان الخصمُ برتقالياً والدفعةُ خضراءَ فيُقرأ العكس. */
.ledger-tbl .pos{color:var(--green);font-weight:700;}
.ledger-tbl .neg,.ledger-tbl .pay{color:var(--red);font-weight:700;}
.ledger-tbl th{white-space:nowrap;}
.ledger-tbl td.num,.ledger-tbl th.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.ledger-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11px;color:var(--text2);
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:10px;line-height:1.7;}
.ledger-legend b{font-weight:800;}
.ledger-legend .g{color:var(--green);} .ledger-legend .r{color:var(--red);}

/* Details modal & sessions table */
.modal-overlay.show{display:flex;}
.modal-box.small{max-width:480px;}
.modal-head h3{font-size:16px;font-weight:800;color:var(--green);}
.modal-close:hover{background:var(--bg3);color:var(--red);}
#detailsBody { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table thead th{
  background:var(--bg3);color:var(--text2);font-weight:700;
  padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);
  font-size:11px;letter-spacing:.3px;
}
.data-table tbody td{
  padding:9px 10px;border-bottom:1px solid var(--border);   /* v295 */
  color:var(--text);
}
.data-table tbody tr:hover{background:rgba(var(--green-rgb),0.03);}
.data-table .num{font-variant-numeric:tabular-nums;text-align:left;}

.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:10px 12px;
  background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  font-family:'Cairo',sans-serif;font-size:14px;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--green);}

/* Payout history */
.payout-history-item{
  background:var(--bg);border:1px solid rgba(var(--green-rgb),0.08);
  border-radius:8px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;
  font-size:12px;
}
.payout-history-item .meta{color:var(--text2);}
.payout-history-item .amt{color:var(--green);font-weight:800;font-variant-numeric:tabular-nums;}
.payout-history-item{flex-wrap:wrap;gap:8px 12px;}
.payout-history-item > div:first-child{flex:1 1 auto;min-width:0;}
.payout-history-item .phi-when{font-size:12px;color:var(--text);}

/* Empty state */
.empty-state{
  background:var(--bg2);border:2px dashed var(--border);
  border-radius:var(--radius);padding:60px 20px;
  text-align:center;color:var(--text2);
}
.empty-state .ic{font-size:48px;margin-bottom:12px;opacity:.6;}
.empty-state .ttl{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;}

/* Toast */

/* Print-only styling for payout slip */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; inset: 0; padding: 30px; }
}

@media (max-width:768px){
  .topbar{padding:12px 16px;flex-wrap:wrap;gap:10px;}
  .page{padding:16px;}
  .providers-grid{grid-template-columns:1fr;}
}
/* v299: press feedback */
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .6; cursor: wait; }
/* v539: أقسامُ التقارير (تبويبات) + تبويبُ العلاجات (rpt-treat.js) */
.rpt-tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);}
.rpt-tabs::-webkit-scrollbar{display:none;}
.rpt-tab{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;
  color:var(--text2);padding:10px 14px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.rpt-tab:hover{color:var(--text);}
.rpt-tab.on{color:var(--green);border-bottom-color:var(--green);}
/* v543 (صورة المالك من الآيفون): خمسةُ تبويبات لا تتسع لعرض الهاتف، والشريطُ كان يتمرّر أفقياً بلا
   شريطِ تمرير ولا أيّ إشارة ⇒ «الحضور والغياب» و«الاحتفاظ» خارج الشاشة كلياً. تحت 720px من عرض القسم
   (container query — #695) تصير التبويباتُ شبكةَ أزرارٍ ظاهرةً كلُّها، والنصُّ يلتفّ ولا يُقصّ. */
.rpt-tabs-wrap{container-type:inline-size;}
@container (max-width:720px){
  .rpt-tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(108px,100%),1fr));gap:6px;overflow:visible;border-bottom:0;}
  .rpt-tab{border:1px solid var(--border);border-radius:10px;margin:0;padding:8px 6px;white-space:normal;text-align:center;line-height:1.35;
    background:var(--bg2);min-width:0;}
  .rpt-tab.on{background:rgba(var(--green-rgb),0.12);border-color:var(--green);}
}
body:not([data-rpt-tab="prov"]) #basisToggle,body:not([data-rpt-tab="prov"]) #basisHelp,
body:not([data-rpt-tab="prov"]) #summaryRow,body:not([data-rpt-tab="prov"]) #provList{display:none !important;}
.rt-host{container-type:inline-size;}
.rt-host .stat-card{min-width:0;}
.rt-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;min-width:0;}
.rt-h{font-size:14px;font-weight:800;color:var(--text);margin:0 0 10px;}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.rt-head .rt-h{margin:0;}
.rt-sort{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;flex:none;}
.rt-sort-btn{background:transparent;border:0;padding:5px 12px;font-family:'Cairo',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;}
.rt-sort-btn.on{background:rgba(var(--green-rgb),0.12);color:var(--green);font-weight:700;}
.rt-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px;}
.rt-cat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0;}
.rt-cat-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;}
.rt-cat-name{font-weight:700;color:var(--text);min-width:0;overflow-wrap:anywhere;}
.rt-cat-val{font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;font-size:12px;}
.rt-cat-val b{color:var(--green);margin-inline-start:4px;}
.rt-bar{height:6px;background:var(--bg3);border-radius:4px;margin:7px 0 6px;overflow:hidden;}
.rt-bar i{display:block;height:100%;background:var(--green);border-radius:4px;}
.rt-cat-sub{font-size:11px;color:var(--text2);}
.rt-note{margin-top:10px;font-size:12px;color:var(--text2);background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:8px 10px;line-height:1.8;}
.rt-note a{color:var(--green);font-weight:700;}
.rt-note b{color:var(--text);}
.rt-list{display:flex;flex-direction:column;}
.rt-row{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(0,1fr));gap:8px;align-items:center;
  width:100%;padding:9px 8px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);
  font-family:'Cairo',sans-serif;font-size:12.5px;text-align:right;}
.rt-list.hp .rt-row{grid-template-columns:minmax(0,2.2fr) repeat(5,minmax(0,1fr));}
button.rt-row{cursor:pointer;}
button.rt-row:hover{background:rgba(var(--green-rgb),0.04);}
.rt-row .n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;}
.rt-th{font-size:11px;color:var(--text2);font-weight:700;background:var(--bg3);border-radius:8px 8px 0 0;}
.rt-tf{font-weight:800;background:rgba(var(--green-rgb),0.06);border-bottom:0;border-radius:0 0 8px 8px;}
.rt-name{display:flex;flex-direction:column;min-width:0;}
.rt-name b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rt-name small{font-size:10.5px;color:var(--text2);}
.rt-pn{display:block;font-size:10px;color:var(--text2);font-weight:500;}
.rt-d{font-size:11px;font-weight:700;}
.rt-d,.rt-cat-val b{display:inline-block;direction:ltr;unicode-bidi:isolate;}   /* «▲ 25%» لا «%25 ▲» بسياقٍ عربي */
.rt-d.up{color:var(--green);} .rt-d.down{color:var(--red);} .rt-d.flat{color:var(--text2);} .rt-d.new{color:var(--blue);}
.rt-dl{font-size:10.5px;margin-top:4px;} .rt-dl span{color:var(--text2);font-weight:500;}

<script>
'use strict';

// ─── State ───
var currentUser = null;
var doctors = [];           // clinic_doctors
var sessions = [];          // ledger_sessions in date range
var payments = [];          // ledger_payments in date range
var paymentSplits = [];     // payment_splits in date range (Migration 3) — empty on legacy DBs
var splitSessionStatus = {}; // id→status for each session referenced by a split (canonical earned-split rule)
var labOrders = [];         // lab_orders for cost matching
var payouts = [];           // provider_payouts for history
// v306: كل ما سبق بداية الفترة (جلسات/دفعات/توزيعات/مخابر) لحساب الرصيد المرحَّل.
// null = تعذّر التحميل ⇒ الصفحة ترتدّ حرفياً لسلوك «الفترة وحدها» بلا رصيد مرحَّل.
var priorCtx = null;
var patientNames = {};      // patient_id → name (per-session breakdown only; never financial)
var basis = 'production';   // 'production' | 'net' | 'collection'
var _payoutModalCur = null; // F3: عملة مودال الدفعة المقفولة لحظة الفتح — يقرؤها سجل الدفعات بمساري الحفظ/الحذف

// ─── Helpers ───

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Phase 6 X: Provider type prefix helper. Returns the emoji prefix (with
// trailing space) for non-default provider types. Empty string for doctors
// (the default, no prefix needed) and any unknown value (defensive).
function providerTypePrefix(pt) {
  if (pt === 'hygienist') return '🩺 ';
  if (pt === 'assistant') return '🤝 ';
  if (pt === 'secretary') return '👩‍💼 ';
  if (pt === 'other') return '👥 ';
  return '';  // doctor or unknown → no prefix
}

// Phase 3 Feature G: format the "tooth" column for both tooth-based and regional sessions.
// Tooth-based: show the FDI number. Regional: show a compact Arabic label.
var __QLBL_PR = {'UR':'علوي يمين','UL':'علوي يسار','LL':'سفلي يسار','LR':'سفلي يمين'};
var __ALBL_PR = {'U':'الفك العلوي','L':'الفك السفلي'};
function formatSessionToothCell(s) {
  if (s.tooth_num) return escapeHtml(String(s.tooth_num));
  if (s.quadrant && __QLBL_PR[s.quadrant]) return '<span style="font-size:11px;color:var(--text-muted,#8da0bd);">ربع ' + __QLBL_PR[s.quadrant] + '</span>';
  if (s.arch && __ALBL_PR[s.arch]) return '<span style="font-size:11px;color:var(--text-muted,#8da0bd);">' + __ALBL_PR[s.arch] + '</span>';
  return '—';
}

// Patient name cell for the per-session breakdown (details modal + printed slip).
// Display-only: it never feeds a number. Falls back to "—" when the name map is
// empty (load failure) or the patient row no longer exists.
function sessionPatientCell(s) {
  var nm = (s && s.patient_id) ? patientNames[s.patient_id] : '';
  return nm ? escapeHtml(nm) : '—';
}

function fmt(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-US');
}

// M125: تسمية عملة الرسم — طبقة العملة النشطة إن وُجدت، وإلا عملة العيادة (M107).
var _renderCur = null;
function fmtCurLabel() {
  if (_renderCur === 'USD') return '$';
  if (_renderCur === 'SYP') return 'ل.س';
  return curLbl();
}
function fmtSY(n) {
  var v = Math.round((Number(n) || 0) * 100) / 100;
  if (v % 1 === 0) return fmt(v) + ' ' + fmtCurLabel();
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + fmtCurLabel();
}

function initials(name) {
  if (!name) return '?';
  var parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
}

function toDay(d) {
  d = d || new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// ─── TIMESTAMPTZ timezone safety (parity with accounting.html) ───
// date_sent on lab_orders is TIMESTAMPTZ. PostgREST .gte/.lte compare the UTC
// instant, so a Syria-local date typed by the user can be off by up to a day.
// Pattern: widen the UTC query window by ±1 day, then trim precisely client-side
// using the row's LOCAL calendar date.
function widenStartUtc(isoDay) {
  if (!isoDay) return isoDay;
  var d = new Date(isoDay + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString();
}
function widenEndUtc(isoDay) {
  if (!isoDay) return isoDay;
  var d = new Date(isoDay + 'T23:59:59.999Z');
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString();
}
function inLocalRange(timestamptz, from, to) {
  if (!timestamptz) return false;
  var d = new Date(timestamptz);
  if (isNaN(d.getTime())) return false;
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  var localDay = y + '-' + m + '-' + day;
  return localDay >= from && localDay <= to;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ─── Date presets ───
// v307: جدولٌ واحد بدل سلسلة if — كل فترة دالةٌ نقية (now → {from,to}) قابلةٌ للاختبار.
// «آخر N أشهر» تقويمية: من أول الشهر (الحالي − (N−1)) حتى اليوم (كـQuickBooks/Xero).
function _mStart(y, m) { return new Date(y, m, 1); }
function _mEnd(y, m)   { return new Date(y, m + 1, 0); }
var PRESETS = [
  { key: 'this_month',   label: 'هذا الشهر',     range: function(n){ return { from: _mStart(n.getFullYear(), n.getMonth()), to: n }; } },
  { key: 'last_month',   label: 'الشهر الماضي',  range: function(n){ return { from: _mStart(n.getFullYear(), n.getMonth() - 1), to: _mEnd(n.getFullYear(), n.getMonth() - 1) }; } },
  { key: 'this_week',    label: 'هذا الأسبوع',   range: function(n){ var f = new Date(n); f.setDate(n.getDate() - n.getDay()); return { from: f, to: n }; } },
  { key: 'last_30',      label: 'آخر 30 يوم',    range: function(n){ var f = new Date(n); f.setDate(n.getDate() - 30); return { from: f, to: n }; } },
  { key: 'last_3m',      label: 'آخر 3 أشهر',    range: function(n){ return { from: _mStart(n.getFullYear(), n.getMonth() - 2), to: n }; } },
  { key: 'this_quarter', label: 'هذا الربع',     range: function(n){ var q = Math.floor(n.getMonth() / 3) * 3; return { from: _mStart(n.getFullYear(), q), to: n }; } },
  { key: 'last_quarter', label: 'الربع الماضي',  range: function(n){ var q = Math.floor(n.getMonth() / 3) * 3 - 3; return { from: _mStart(n.getFullYear(), q), to: _mEnd(n.getFullYear(), q + 2) }; } },
  { key: 'last_6m',      label: 'آخر 6 أشهر',    range: function(n){ return { from: _mStart(n.getFullYear(), n.getMonth() - 5), to: n }; } },
  { key: 'this_year',    label: 'هذه السنة',     range: function(n){ return { from: new Date(n.getFullYear(), 0, 1), to: n }; } },
  { key: 'last_12m',     label: 'آخر 12 شهر',    range: function(n){ return { from: _mStart(n.getFullYear(), n.getMonth() - 11), to: n }; } },
  { key: 'last_year',    label: 'السنة الماضية', range: function(n){ return { from: new Date(n.getFullYear() - 1, 0, 1), to: new Date(n.getFullYear() - 1, 11, 31) }; } },
  { key: 'all',          label: 'كل الفترات',    range: function(n){ return { from: new Date(2020, 0, 1), to: n }; } }
];
function presetRange(key, now) {
  var p = PRESETS.filter(function(x){ return x.key === key; })[0] || PRESETS[PRESETS.length - 1];
  var r = p.range(now || new Date());
  return { from: toDay(r.from), to: toDay(r.to) };
}
function renderPresetRow() {
  var row = document.getElementById('presetRow');
  if (!row) return;
  row.innerHTML = PRESETS.map(function(p){
    return '<button class="preset-btn" data-preset="' + p.key + '" onclick="setPreset(\'' + p.key + '\')">' + p.label + '</button>';
  }).join('');
}
function markPreset(key) {
  document.querySelectorAll('.preset-btn').forEach(function(b){
    b.classList.toggle('active', !!key && b.getAttribute('data-preset') === key);
  });
}
function activePresetKey() {
  var b = document.querySelector('.preset-btn.active');
  return b ? b.getAttribute('data-preset') : '';
}
function setPreset(p) {
  var r = presetRange(p);
  document.getElementById('fromDate').value = r.from;
  document.getElementById('toDate').value   = r.to;
  markPreset(p);
  onFilterChange();
}

/* DeepCode #1 (v553): قائمةُ الأطباء تُجلب مبكراً مع بيانات الفترة (الاستعلامُ نفسُه حرفياً)؛ loadAll يتبنّاها مرةً واحدة. */
var _prDocsEarly = null;
function _prDoctorsQuery() {
  return window.sb.from('clinic_doctors')
    .select('*')
    .eq('owner_id', currentUser.id)
    .order('is_owner', { ascending: false })
    .order('created_at', { ascending: true });

async function loadAll() {
  loadTrtCatalog();   // v539: كتالوجُ العلاجات للتصنيف — بالتوازي ولا يؤخّر تبويبَ الأطباء (#687)
  // 1. Load clinic doctors
  var _de = _prDocsEarly; _prDocsEarly = null;
  var dRes = _de ? _prTake(await _de) : await _prDoctorsQuery();
  if (dRes.error) {
    if (dRes.error.code === 'PGRST204' || (dRes.error.message && dRes.error.message.indexOf('clinic_doctors') >= 0)) {
      document.getElementById('provList').innerHTML =
        '<div class="empty-state"><div class="ic">⚙️</div>' +
        '<div class="ttl">يجب تشغيل تحديث قاعدة البيانات أولاً</div>' +
        '<div style="margin-top:12px;font-size:13px;">شغّل SQL الخاص بالأطباء المتعددين في Supabase أولاً.</div></div>';
      return;
    }
    showToast('⚠️ فشل تحميل الأطباء');
    return;
  }
  doctors = dRes.data || [];

  // Populate provider filter dropdown - respects inactive toggle
  var sel = document.getElementById('providerFilter');
  var current = sel.value || 'all';
  var inactiveModeForDropdown = document.getElementById('inactiveFilter').value;
  var doctorsForDropdown = doctors.filter(function(d){
    return inactiveModeForDropdown === 'show' || d.is_active !== false;
  });
  var allLabel = inactiveModeForDropdown === 'show' ? 'كل الأطباء' : 'كل الأطباء النشطين';
  sel.innerHTML = '<option value="all">' + allLabel + '</option>' + doctorsForDropdown.map(function(d){
    var typePrefix = providerTypePrefix(d.provider_type);
    var lbl = typePrefix + d.name + (d.is_owner ? ' ⭐' : '') + (d.is_active === false ? ' (معطل)' : '');
    return '<option value="' + d.id + '">' + escapeHtml(lbl) + '</option>';
  }).join('');
  // v307: طبيبٌ من الرابط يُطبَّق مرةً واحدة بعد بناء القائمة.
  if (_urlProvider) { current = _urlProvider; _urlProvider = null; }
  // Restore selection if still valid; otherwise reset to all
  if (current === 'all' || doctorsForDropdown.find(function(d){ return d.id === current; })) {
    sel.value = current;
  } else {
    sel.value = 'all';
  }

  // Phase 4: apply Doctor mode lock BEFORE loadFilteredData to prevent
  // a brief flicker where the doctor would see all providers' data.
  // applyDoctorModeFilter sets sel.value to their id and disables changes,
  // so loadFilteredData filters from the start.
  if (window.SyDentLock && window.SyDentLock.isDoctor() && typeof applyDoctorModeFilter === 'function') {
    applyDoctorModeFilter();
  } else {
    await loadFilteredData();
  }
}

/* DeepCode #1 (v553): الجلبُ المبكر — بياناتُ الفترة تُطلَق مع بداية الإقلاع بالتوازي مع ذاكرتي القفل وقائمة الأطباء

var _prEarly = null;
function _prWinKey() {

}
function _prStartEarly() {
  var open, gate = new Promise(function (r) { open = r; });
  _prEarly = { key: _prWinKey(), open: open, p: null };
  _prEarly.p = _loadFilteredDataCore(gate).catch(function (e) { console.warn('early report load:', e); });
}
function _prCancelEarly() {   /* الطبيبُ المعطَّل: لا رسمَ أبداً للجلب المبكر */
  if (!_prEarly) return;
  var e = _prEarly; _prEarly = null; e.open(false);
}
async function loadFilteredData() {
  if (_prEarly) {
    var e = _prEarly; _prEarly = null;
    if (e.key === _prWinKey()) { e.open(true); return e.p; }
    e.open(false); await e.p;

async function _loadFilteredDataCore(gate) {

     تُطلَق الآن معاً وكلُّ مجموعةٍ بجسمها ومعالجة أخطائها حرفياً؛ التبعياتُ داخل المجموعة باقيةٌ بترتيبها:
     الجلسات ← أسماءُ مرضاها · الدفعات ← توزيعاتُها ← حالاتُ جلسات التوزيعات. الرسمُ بعد اكتمالها كلها. */

      console.error('sessions load:', sErr);

        // Fallback if status column missing
        sessions = await _fetchAllPR(function(){

            .eq('doctor_id', currentUser.id).gte('date', from).lte('date', to);
        });
      } catch (sErr2) {
        console.error('sessions load (fallback):', sErr2);
        sessions = [];

    // Patient names for the per-session breakdown. Bounded by the sessions actually

// ═══════════════════════════════════════════════════════════════════════════
// v306 — الرصيد المرحَّل (running balance) — مرآة كشف حساب المخبر (labs.html)
// المشكلة: البطاقة كانت تقارن مستحق الفترة (بتاريخ الجلسة) بدفعات تُطابَق
// بتداخل فترتها، فدفعةُ تموز المسجَّلة 02/08 تسقط كاملةً على آب الذي إنتاجه صفر
// ⇒ «المتبقي −180,000» وهمي. الحل المحاسبي: افتتاحي + مستحق الفترة − مدفوع
// بالفترة = ختامي، فالرصيدُ الختامي لا يتغيّر بطريقة تقطيع الفترات.
// المحرّك computeProviderStats/computePayout لا يُمسّ حرفاً: يُشغَّل على سياق
// «ما قبل الفترة» بتبديل المصفوفات العامة ثم إرجاعها (نمط withCurrencyLayer).
// الدفعات تُؤرَّخ بيوم التسديد المحلي (paid_at) لا بتداخل الفترة — كما يؤرَّخ
// سداد المخبر بـpay_date — فلا تُعدّ دفعةٌ في نافذتين.
// ═══════════════════════════════════════════════════════════════════════════
// جلب كل الصفوف بصفحات 1000 (حدّ PostgREST الافتراضي) — «ما قبل الفترة» قد يمتد سنوات.
/* DeepCode #1 (v552): وعدٌ ⇒ {r}|{e} فلا يصير رفضاً غير ملتقَط وهو ينتظر دوره، ثم يُرمى خطؤه بدوره. */
function _prSettle(p) { return Promise.resolve(p).then(function (r) { return { r: r }; }, function (e) { return { e: e }; }); }
function _prTake(x) { if (x.e) throw x.e; return x.r; }
async function _fetchAllPR(buildQuery) {
  var PAGE = 1000, out = [], off = 0;
  for (;;) {
    var res = await buildQuery().order('id').range(off, off + PAGE - 1);
    if (res.error) throw res.error;
    var rows = res.data || [];
    out = out.concat(rows);
    if (rows.length < PAGE) break;
    off += PAGE;
  }
  return out;
}
// v307: جالبٌ واحد لأي نافذة [lo, hi] (lo اختياري = بلا حدّ سفلي) بنفس دلالة النافذة
// الحيّة: جلسات بتاريخها، دفعات بتاريخها (والتوزيعات عبر دفعتها)، مخابر بـdate_sent محلياً.
// يخدم سياقين: «ما قبل الفترة» (الرصيد المرحَّل) و«الفترة السابقة» (المقارنة).
async function fetchCtx(lo, hi, statusList, withTreat) {
  var uid = currentUser.id;
  // v539: سياقُ «الفترة السابقة» يحمل هويةَ العلاج أيضاً لمقارنة تبويب العلاجات (قراءةٌ عرضية، لا رقمٌ مالي).
  var sCols = 'id,cost,provider_id,patient_id,status,currency,date' + (withTreat ? ',type,treatment_key,description' : '');
  /* DeepCode #1 (v552): القراءاتُ الأربع مستقلة — تُطلَق معاً (جولةٌ لا أربع) وتُحسَم بالترتيب نفسه،
     فأولُ خطأٍ يُرمى هو نفسُه كما كان؛ والتوزيعاتُ (embed) خطؤها يذهب لمسارها البديل كما كان. */
  var _cS = _prSettle(_fetchAllPR(function(){
    var q = window.sb.from('ledger_sessions')
      .select(sCols)
      .eq('doctor_id', uid).lte('date', hi).in('status', statusList);
    return lo ? q.gte('date', lo) : q;
  }));
  var _cP = _prSettle(_fetchAllPR(function(){
    var q = window.sb.from('ledger_payments')
      .select('id,patient_id,amount,currency,date')
      .eq('doctor_id', uid).lte('date', hi);
    return lo ? q.gte('date', lo) : q;
  }));
  var _cSp = _prSettle(_fetchAllPR(function(){
      var q = window.sb.from('payment_splits')
        .select('id,payment_id,session_id,provider_id,amount,is_unearned,currency,ledger_payments!inner(date),ledger_sessions(status)')
        .eq('doctor_id', uid).lte('ledger_payments.date', hi);
      return lo ? q.gte('ledger_payments.date', lo) : q;
    }));
  var _cL = _prSettle(_fetchAllPR(function(){
    var q = window.sb.from('lab_orders')
      .select('id,cost,status,date_sent,provider_id,currency')
      .eq('doctor_id', uid).neq('status', 'rejected').lte('date_sent', widenEndUtc(hi));
    return lo ? q.gte('date_sent', widenStartUtc(lo)) : q;
  }));
  var pSessions = _prTake(await _cS);
  var pPayments = _prTake(await _cP);
  // التوزيعات مع حالة جلستها بطلبٍ واحد (embed)؛ إن رفضه الخادم ⇒ المسار المقطَّع نفسه المستعمل بالنافذة.
  var pSplits = [], pStatus = {};
  try {
    var rows = _prTake(await _cSp);
    rows.forEach(function(r){
      pSplits.push({ payment_id: r.payment_id, session_id: r.session_id, provider_id: r.provider_id,
                     amount: r.amount, is_unearned: r.is_unearned, currency: r.currency });
      if (r.session_id && r.ledger_sessions) pStatus[r.session_id] = r.ledger_sessions.status || 'completed';
    });
  } catch (embedErr) {
    console.warn('ctx splits embed fallback:', embedErr);
    var pids = pPayments.map(function(p){ return p.id; }), CH = 150;
    for (var i = 0; i < pids.length; i += CH) {
      var sr = await window.sb.from('payment_splits')
        .select('payment_id,session_id,provider_id,amount,is_unearned,currency')
        .eq('doctor_id', uid).in('payment_id', pids.slice(i, i + CH));
      if (sr.error) throw sr.error;
      pSplits = pSplits.concat(sr.data || []);
    }
    var sidSet = {}; pSplits.forEach(function(sp){ if (sp.session_id) sidSet[sp.session_id] = 1; });
    var sids = Object.keys(sidSet);
    for (var j = 0; j < sids.length; j += CH) {
      var st = await window.sb.from('ledger_sessions').select('id,status')
        .eq('doctor_id', uid).in('id', sids.slice(j, j + CH));
      if (st.error) throw st.error;
      (st.data || []).forEach(function(row){ pStatus[row.id] = row.status || 'completed'; });
    }
  }
  var pLabs = _prTake(await _cL).filter(function(lo_){
    // نفس نمط «وسّع ثم قصّ» باليوم المحلي (date_sent TIMESTAMPTZ).
    var d = lo_.date_sent ? new Date(lo_.date_sent) : null;
    if (!d || isNaN(d.getTime())) return false;
    var day = toDay(d);
    return day <= hi && (!lo || day >= lo);
  });
  return { sessions: pSessions, payments: pPayments, paymentSplits: pSplits,
           labOrders: pLabs, splitSessionStatus: pStatus, from: lo, to: hi };
}
function _dayShift(isoDay, n) {
  var d = new Date(isoDay + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toDay(d);
}
async function loadPriorContext(from, statusList) {
  priorCtx = null;
  if (!from) return;
  // «كل الفترات» يبدأ 2020-01-01 — لا شيء قبله ⇒ سياق فارغ (افتتاحي = −ما دُفع قبله = 0).
  if (from <= '2020-01-01') {
    priorCtx = { sessions: [], payments: [], paymentSplits: [], labOrders: [], splitSessionStatus: {}, from: null, to: _dayShift(from, -1) };
    return;
  }
  try {
    // v542: هويةُ الجلسة (type/description) تلزم تبويبَي المرضى الجدد والاحتفاظ كي لا يُعدّ رصيدٌ سابق أو رسمُ غيابٍ قديم «زيارة».
    priorCtx = await fetchCtx(null, _dayShift(from, -1), statusList, true);
  } catch (e) {
    console.warn('loadPriorContext:', e);
    priorCtx = null;
    showToast('⚠️ تعذّر حساب الرصيد السابق — تُعرض أرقام الفترة وحدها');
  }
}
// v307: الفترةُ السابقة بنفس الطول مباشرةً قبل الفترة (دلالة «Previous period» في QuickBooks).
// «كل الفترات» بلا سابقة. فشلُها صامت (المقارنة زينةٌ تحليلية لا رقمٌ ماليّ).
var prevCtx = null;
function prevWindow(from, to) {
  if (!from || !to || from <= '2020-01-01' || to < from) return null;
  var len = Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000); // أيام − 1
  var pTo = _dayShift(from, -1);
  return { from: _dayShift(pTo, -len), to: pTo };
}
async function loadPrevContext(from, to, statusList) {
  prevCtx = null;
  var w = prevWindow(from, to);
  if (!w) return;
  try { prevCtx = await fetchCtx(w.from, w.to, statusList, true); }
  catch (e) { console.warn('loadPrevContext:', e); prevCtx = null; }
}
// تشغيل دالةٍ على سياقٍ بديل (مفلترٍ بالعملة) بتبديل المصفوفات العامة ثم إرجاعها — نمط withCurrencyLayer.
function withCtx(ctx, cur, fn) {
  var full = { sessions: sessions, payments: payments, paymentSplits: paymentSplits,
               labOrders: labOrders, splitSessionStatus: splitSessionStatus };
  try {
    sessions      = cur ? _filterCur(ctx.sessions, cur)      : ctx.sessions;
    payments      = cur ? _filterCur(ctx.payments, cur)      : ctx.payments;
    paymentSplits = cur ? _filterCur(ctx.paymentSplits, cur) : ctx.paymentSplits;
    labOrders     = cur ? _filterCur(ctx.labOrders, cur)     : ctx.labOrders;
    splitSessionStatus = ctx.splitSessionStatus || {};
    return fn();
  } finally {
    sessions = full.sessions; payments = full.payments; paymentSplits = full.paymentSplits;
    labOrders = full.labOrders; splitSessionStatus = full.splitSessionStatus;
  }
}

// يوم التسديد المحلي لدفعة طبيب (paid_at TIMESTAMPTZ)؛ صفٌّ قديم بلا paid_at يرتدّ لنهاية فترته.
function _payoutDay(po) {
  var d = (po && po.paid_at) ? new Date(po.paid_at) : null;
  if (d && !isNaN(d.getTime())) return toDay(d);
  return (po && po.period_end) || '';
}
// v382: الجزءُ المحسوب على حصّة الإنتاج من دفعةٍ ما — عبر SyDentPayroll (مصدرٌ واحد
// مع صفحة الرواتب). هذا التقرير دفترُ حصّة الإنتاج حصراً: راتبُ الطبيب الثابت
// ومكافأتُه ودفعاتُ نموذج «بدون» لا تُخصم منه. كانت الدفعةُ تُطرح كاملةً فطبيبُ
// الراتب الثابت يظهر «مقدَّم لصالح العيادة» بقيمة راتبه بعد كل شهر.
function _payoutShareOf(po) {
  var d = doctors.find(function(x){ return x.id === po.provider_id; });
  var model = (d && d.compensation_model) || 'percentage';
  return window.SyDentPayroll.payoutParts(po, model, function (p) {
    if (!d) return 0;
    var salCur = (d.salary_currency === 'USD') ? 'USD' : 'SYP';
    if (_rowCur(p) !== salCur) return 0;
    return window.SyDentPayroll.prorateSalary(d.monthly_salary, p.period_start, p.period_end, _rowCur(p));
  }).share;
}
// دفعات الطبيب المسدَّدة داخل النافذة (تقرأ `payouts` — مفلترةٌ بالعملة داخل الغلاف).
function payoutsPaidInWindow(provId, from, to) {
  return payouts.filter(function(po){
    if (po.provider_id !== provId) return false;
    var day = _payoutDay(po);
    return day >= from && day <= to;
  }).reduce(function(sum, po){ return sum + _payoutShareOf(po); }, 0);
}
// مستحقُّ كل ما قبل الفترة (بالأساس المختار) — null = غير متاح / المالك.
function computeOpeningDue(d) {
  if (!priorCtx || !d || d.is_owner) return null;
  return withCtx(priorCtx, _renderCur, function(){ return computePayout(d, computeProviderStats(d.id)); });
}
// الرصيد الافتتاحي = مستحق كل ما قبل الفترة (بالأساس المختار) − كل ما دُفع قبلها.
// null = غير متاح (priorCtx مفقود، أو المالك — دافعٌ لا مستفيد فلا ذمّة له).
function computeOpeningBalance(d, from) {
  var due = computeOpeningDue(d);
  if (due === null) return null;
  var paidBefore = payouts.filter(function(po){
    return po.provider_id === d.id && _payoutDay(po) < from;
  }).reduce(function(sum, po){ return sum + _payoutShareOf(po); }, 0);
  return due - paidBefore;
}
// تسمية الرصيد الثلاثية (مرآة بطاقة المخبر: مستحق له / رصيد لصالح العيادة / مسدَّد).
// العتبة بالوحدة الصغرى (سنت/ليرة) لا 0.5 — كي لا تُقرأ 40 سنتاً «مسدَّد».
// v309: حالة الرصيد السابق (بداية الفترة) — صفرٌ هنا يعني «لا تاريخ قبل الفترة» لا «سُدّد».
function openingState(v) {
  var r = Math.round((Number(v) || 0) * 100) / 100;
  if (Math.abs(r) < 0.005) return { cls: '',     txt: 'لا حركات قبل الفترة',    val: 0 };
  if (r > 0)               return { cls: 'warn', txt: 'مستحق للطبيب',            val: r };
  return                          { cls: 'info', txt: 'مقدَّم لصالح العيادة',    val: -r };
}
function balanceState(v) {
  var r = Math.round((Number(v) || 0) * 100) / 100;
  if (Math.abs(r) < 0.005) return { cls: 'ok',   txt: 'مسدَّد — لا مستحق',            val: 0 };
  if (r > 0)               return { cls: 'warn', txt: 'مستحق للطبيب',                 val: r };
  return                          { cls: 'info', txt: 'رصيد مقدَّم لصالح العيادة',     val: -r };
}

// ─── Lab cost attribution (Migration 73) ───
// Lab cost is attributed to the treating provider via the explicit provider_id
// column stored on each lab_order at write time — NO session matching. `labOrders`
// is already filtered to the active window (by date_sent) at load time, so summing
// here is window-correct and deterministic regardless of the filter. Matches
// OpenDental (labcase.ProvNum stored on the lab). provId === '_unassigned'
// aggregates orders with no provider_id, so they never silently fall onto the owner.
function providerLabCost(provId) {
  var sum = 0;
  for (var i = 0; i < labOrders.length; i++) {
    var lo = labOrders[i];
    var match = (provId === '_unassigned') ? !lo.provider_id : lo.provider_id === provId;
    if (match) sum += Number(lo.cost) || 0;
  }
  return sum;
}

// Populate splitSessionStatus for every distinct session_id referenced by the loaded
// splits. Fetched independently of the range-filtered `sessions` array because a split's
// session may be completed-but-out-of-range (must still count as earned) or planned (must
// count as unearned) — neither is reliably present in `sessions`. Chunked to keep the
// PostgREST .in() URL within length limits. Parity with accounting.html.
async function loadSplitSessionStatuses() {
  splitSessionStatus = {};
  var idSet = {};
  for (var i = 0; i < paymentSplits.length; i++) {
    var sid = paymentSplits[i].session_id;
    if (sid) idSet[sid] = true;
  }
  var ids = Object.keys(idSet);
  if (!ids.length) return;
  var CHUNK = 150;
  for (var c = 0; c < ids.length; c += CHUNK) {
    var slice = ids.slice(c, c + CHUNK);
    try {
      var res = await window.sb.from('ledger_sessions')
        .select('id, status')
        .eq('doctor_id', currentUser.id)
        .in('id', slice);
      if (res.error) {
        // On error, leave these ids unmapped → splitIsEarned treats them as NOT-completed
        // (conservative: avoids inflating collection). A pre-Migration-3 DB has no splits anyway.
        var msg = (res.error.message || '').toLowerCase();
        var missing = res.error.code === '42P01' || res.error.code === 'PGRST205' ||
                      msg.indexOf('ledger_sessions') !== -1;
        if (!missing) console.warn('loadSplitSessionStatuses:', res.error);
        continue;
      }
      (res.data || []).forEach(function(row){
        // Legacy sessions with empty/null status fold to 'completed' (system-wide convention).
        splitSessionStatus[row.id] = row.status || 'completed';
      });
    } catch(e) { console.warn('loadSplitSessionStatuses threw:', e); }
  }
}

// Canonical earned-split test (parity with accounting.html / patient-profile.html
// computeFinancials): a split is EARNED collection only when it is not unearned AND it
// sits on a COMPLETED session. Non-unearned splits on planned sessions (or with no
// session_id) are mobile credit — money received for work not yet done — not collected
// revenue. Without this, legacy un-healed prepayments-on-planned-sessions would overstate
// a provider's collection figure relative to the clinic accounting page.
function splitIsEarned(sp) {
  if (!sp || sp.is_unearned) return false;
  return !!sp.session_id && splitSessionStatus[sp.session_id] === 'completed';
}

// ─── Compute provider stats ───
// For a given provider, compute production/lab/net from sessions and allocated
// collection from payments based on the provider's share of patient production.
// Lab cost is attributed via the explicit provider_id column (Migration 73), so no
// matchedSet is needed any more.
// ═══════════════════════════════════════════════════════════════════════════
// M125 — تعدد العملات: طبقة القسمة (مرآة مبدأ accounting.html)
// المحرّك (computeProviderStats/computePayout) لا يُمسّ — يعمل داخل شريحة
// عملة واحدة بتبديل المصفوفات العامة ثم إرجاعها، فالتخصيص النسبي للـlegacy
// يجري على مستوى (مريض، عملة) بالبناء، وصفر جمع عابر للعملات بأي مسار —
// بما فيه مسارات النقر (التفاصيل/الطباعة/الدفعة) عبر أغلفة العملة.
function _rowCur(r) { return (r && r.currency === 'USD') ? 'USD' : 'SYP'; }
function _filterCur(arr, cur) {
  return (arr || []).filter(function(r){ return _rowCur(r) === cur; });
}
function withCurrencyLayer(cur, fn) {
  var full = { sessions: sessions, payments: payments, paymentSplits: paymentSplits,
               labOrders: labOrders, payouts: payouts };
  sessions      = _filterCur(full.sessions, cur);
  payments      = _filterCur(full.payments, cur);
  paymentSplits = _filterCur(full.paymentSplits, cur);
  labOrders     = _filterCur(full.labOrders, cur);
  payouts       = _filterCur(full.payouts, cur);
  var prev = _renderCur;
  _renderCur = cur;
  try { fn(); } finally {
    sessions = full.sessions; payments = full.payments; paymentSplits = full.paymentSplits;
    labOrders = full.labOrders; payouts = full.payouts;
    _renderCur = prev;
  }
}
function _activeCursPR() {
  var act = [];
  ['SYP', 'USD'].forEach(function(cur){
    var has = [sessions, payments, paymentSplits, labOrders, payouts].some(function(arr){
      return (arr || []).some(function(r){ return _rowCur(r) === cur; });
    });
    if (has) act.push(cur);
  });
  // ترتيب الطبقات يتبع عملة العيادة الافتراضية (سابقة v200) لا قائمةً مثبّتة —
  // المصدرُ الواحد `SyDentCurBag.active`، وأيُّ خطأ يُبقي الترتيبَ المثبَّت.
  try {
    act = window.SyDentCurBag.active({
      SYP: (act.indexOf('SYP') !== -1) ? 1 : 0,
      USD: (act.indexOf('USD') !== -1) ? 1 : 0
    });
  } catch (e) {}
  return act;
}
function renderCurrencyHeaderPR(cur) {
  var label = (cur === 'USD') ? 'حساب الدولار ($)' : 'حساب الليرة السورية (ل.س)';
  var ico = (cur === 'USD') ? '\ud83d\udcb5' : '\ud83d\udcb0';
  return '<div style="display:flex;align-items:center;gap:10px;margin:26px 0 14px;">' +
    '<span style="font-weight:800;font-size:17px;">' + ico + ' ' + label + '</span>' +
    '<span style="flex:1;height:1px;background:var(--border, rgba(120,150,180,.35));"></span>' +
  '</div>';
}

function computeProviderStats(provId) {
  // 1. Sessions belonging to this provider
  var provSessions = sessions.filter(function(s){
    if (provId === '_unassigned') return !s.provider_id;
    return s.provider_id === provId;
  });
  var sessionCount = provSessions.length;
  var production = provSessions.reduce(function(sum, s){ return sum + (Number(s.cost) || 0); }, 0);

  // 2. Lab cost: explicit per-provider attribution via provider_id (Migration 73).
  // No matchedSet needed — each lab_order carries exactly one provider_id, so it is
  // counted once by construction, regardless of the filter window.
  var labCost = providerLabCost(provId);

  var net = production - labCost;

  // 3. Collection allocation.
  // Preferred (Migration 3+): sum payment_splits.amount where provider_id matches.
  // This is exact — each split records the actual amount that flowed to a
  // specific session under a specific provider, computed FIFO when the payment
  // was made. Matches OpenDental's "Daily Payments Report — Show splits by
  // provider separately" semantics.
  // Fallback (legacy / pre-Migration-3 / payments without splits): proportional
  // ratio of patient production. Kept so old payments don't disappear from
  // reports.
  var collection = 0;
  // Build a set of payment_ids that have at least one split, so we know which
  // payments to allocate via splits vs proportional fallback.
  var paymentIdsWithSplits = {};
  for (var k = 0; k < paymentSplits.length; k++) {
    paymentIdsWithSplits[paymentSplits[k].payment_id] = true;
  }
  // Part A — splits-based attribution (exact).
  // Canonical earned-split rule: count a split only if it is earned (not unearned AND on a
  // completed session). Unearned credit and allocations on planned sessions are excluded —
  // matching accounting.html so per-provider collection can't exceed clinic revenue.
  for (var i = 0; i < paymentSplits.length; i++) {
    var sp = paymentSplits[i];
    if (!splitIsEarned(sp)) continue;
    var matchesProv = (provId === '_unassigned')
      ? !sp.provider_id
      : sp.provider_id === provId;
    if (matchesProv) collection += Number(sp.amount) || 0;
  }
  // Part B — proportional fallback for payments without splits (legacy data).
  // Filter payments to only those NOT covered by splits, then apply the old
  // ratio formula on this subset.
  var legacyPayments = payments.filter(function(p){
    return !paymentIdsWithSplits[p.id];
  });
  if (legacyPayments.length) {
    var byPatient = {};
    sessions.forEach(function(s){
      if (!byPatient[s.patient_id]) byPatient[s.patient_id] = { total: 0, provTotal: 0 };
      byPatient[s.patient_id].total += Number(s.cost) || 0;
      if ((provId === '_unassigned' && !s.provider_id) || s.provider_id === provId) {
        byPatient[s.patient_id].provTotal += Number(s.cost) || 0;
      }
    });
    var legacyPaymentsByPatient = {};
    legacyPayments.forEach(function(p){
      legacyPaymentsByPatient[p.patient_id] =
        (legacyPaymentsByPatient[p.patient_id] || 0) + (Number(p.amount) || 0);
    });
    Object.keys(byPatient).forEach(function(pid){
      var rec = byPatient[pid];
      if (rec.total <= 0 || rec.provTotal <= 0) return;
      var ratio = rec.provTotal / rec.total;
      collection += (legacyPaymentsByPatient[pid] || 0) * ratio;
    });
  }

  return {
    sessionCount: sessionCount,
    production: production,
    labCost: labCost,
    net: net,
    collection: collection,
    sessions: provSessions
  };
}

/* v545: مجاميعُ العيادة للنافذة المحمّلة حالياً (أو داخل withCtx/withCurrencyLayer) — مصدرٌ واحد لملخّص تبويب
   الأطباء ولتبويب «ملخّص الفترة». المخبر = كلُّ طلبات النافذة (مفلترةٌ بـdate_sent عند التحميل) = Σ مخبر البطاقات + غيرُ المسنَد. */
function clinicTotals() {
  var lab = 0;
  for (var li = 0; li < labOrders.length; li++) lab += Number(labOrders[li].cost) || 0;
  return {
    sessions: sessions.length,
    production: sessions.reduce(function(sum, s){ return sum + (Number(s.cost) || 0); }, 0),
    collection: payments.reduce(function(sum, p){ return sum + (Number(p.amount) || 0); }, 0),
    lab: lab
  };
}

function getShareBase(stats) {
  if (basis === 'net') return stats.net;
  if (basis === 'collection') return stats.collection;
  return stats.production;
}

function computePayout(provider, stats) {
  var sharePct = resolveSharePercent(provider);
  var PRm = window.SyDentPayroll;
  var hist = provider && provider.share_history;
  // v384: سجلٌّ فارغ (أو ما قبل Migration 144) ⇒ نسبةٌ ثابتة — المسارُ السابق حرفياً.
  if (!PRm || !PRm.normalizeHistory(hist).length) {
    var base = getShareBase(stats);
    return Math.max(0, base * sharePct / 100);
  }
  return Math.max(0, _shareWeighted(provider.id, hist, sharePct, stats));
}
// v384: الحصّةُ بسجلّ النسب — كلُّ جلسةٍ × النسبةِ السارية بتاريخها (أساسُ الإنتاج
// دقيقٌ حرفياً). أساسا «الصافي» و«التحصيل» يطبّقان النسبةَ الفعلية المرجَّحة بإنتاج
// الفترة على المخبر/التحصيل (لا تاريخَ نسبةٍ طبيعياً لدفعةٍ تسدّد جلساتٍ متعددة).
function _shareWeighted(provId, hist, sharePct, stats) {
  var PRm = window.SyDentPayroll;
  var prodRaw = 0, prodShare = 0;
  sessions.forEach(function(s){
    if (s.provider_id !== provId) return;
    var c = Number(s.cost) || 0;
    prodRaw += c;
    prodShare += c * PRm.rateAt(hist, sharePct, s.date) / 100;
  });
  if (basis === 'production') return prodShare;
  // لا إنتاجَ بالفترة ⇒ النسبةُ الأحدث بالسجل (لا DOM هنا — تعمل داخل withCtx للرصيد السابق أيضاً)
  var effRate = prodRaw > 0 ? (prodShare / prodRaw) : (PRm.rateAt(hist, sharePct, '9999-12-31') / 100);
  if (basis === 'net') return prodShare - (stats.labCost || 0) * effRate;
  return (stats.collection || 0) * effRate;   // collection
}

// Resolve effective share% for a provider, handling null/empty/invalid values.
// Owner with no share set → 100% (so owner-as-only-doctor still works).
// Non-owner with no share set → 0%.
function resolveSharePercent(provider) {
  var raw = provider.share_percent;
  if (raw === null || raw === undefined || raw === '') {
    return provider.is_owner ? 100 : 0;
  }
  var n = Number(raw);
  if (!isFinite(n)) return provider.is_owner ? 100 : 0;
  return n;
}

// Format share% for display (handles "not set" case)
function formatSharePctDisplay(provider) {
  var raw = provider.share_percent;
  if (raw === null || raw === undefined || raw === '' || !isFinite(Number(raw))) {
    return provider.is_owner ? '100% (افتراضي)' : '— لم تُحدد —';
  }
  return Number(raw) + '%';
}

// ─── Render ───
// v307: قائمةُ الأطباء الظاهرين — مُستخرَجة حرفياً من _renderLayerPR لتخدم التصدير أيضاً.
function getVisibleDoctors() {
  var providerFilter = document.getElementById('providerFilter').value;
  // Phase 4 + 5: Defense-in-depth — in Doctor mode, force the filter to
  // the logged doctor's id regardless of what the dropdown says. Prevents
  // any race / edge case from leaking other providers' data. Uses the
  // Phase 5 effective doctor id resolver (falls back to employee.doctor_id
  // if LS_DOCTOR_ID is empty — common in Phase 5 employee-locked devices).
  if (window.SyDentLock && window.SyDentLock.isDoctor()) {
    var lockedDid = (typeof window.SyDentLock.getEffectiveDoctorId === 'function')
      ? window.SyDentLock.getEffectiveDoctorId()
      : window.SyDentLock.getDoctorId();
    if (lockedDid) providerFilter = lockedDid;
  }
  var inactiveMode = document.getElementById('inactiveFilter').value; // 'hide' | 'show'
  // Phase 6 R: provider_type filter. 'all' = no filter (current behavior).
  // Otherwise restrict the displayed doctors to the picked type. On
  // pre-migration installs, doctors won't have a provider_type field at all,
  // so we treat undefined as 'doctor' (the legacy default) to keep the
  // 'أطباء فقط' filter useful even before Migration 13 runs.
  var providerTypeFilterEl = document.getElementById('providerTypeFilter');
  var providerTypeFilter = providerTypeFilterEl ? providerTypeFilterEl.value : 'all';
  var visibleDoctors = doctors.filter(function(d){
    // Hide inactive unless explicitly showing them OR they're specifically picked
    if (inactiveMode === 'hide' && d.is_active === false && providerFilter !== d.id) return false;
    if (providerFilter !== 'all' && d.id !== providerFilter) return false;
    if (providerTypeFilter !== 'all') {
      var dType = d.provider_type || 'doctor'; // pre-migration → doctor
      if (dType !== providerTypeFilter) return false;
    }
    return true;
  });
  return { list: visibleDoctors, providerFilter: providerFilter };
}

function _renderLayerPR() {
  var _vis = getVisibleDoctors();
  var visibleDoctors = _vis.list;
  var providerFilter = _vis.providerFilter;

  // Detect unassigned sessions (no provider_id)
  var hasUnassigned = sessions.some(function(s){ return !s.provider_id; });

  if (!visibleDoctors.length && !hasUnassigned) {
    document.getElementById('summaryRow').innerHTML = '';
    document.getElementById('provList').innerHTML =
      '<div class="empty-state"><div class="ic">👨‍⚕️</div>' +
      '<div class="ttl">لا يوجد أطباء بعد</div>' +
      '<div style="margin-top:6px;">أضف أطباء العيادة من صفحة "أطباء العيادة" أولاً.</div></div>';
    return;
  }

  // ─── Summary stats ───
  // v545: المجاميعُ الأربعة من clinicTotals() — مصدرٌ واحد مع «ملخّص الفترة» (#684).
  var _ct = clinicTotals();
  var totalSessions = _ct.sessions;
  var totalProduction = _ct.production;
  var totalCollection = _ct.collection;
  var totalLab = _ct.lab;

  // Total payouts across all visible doctors
  var totalPayouts = 0;
  // Cache provider stats to avoid duplicate work in cards loop below
  var providerStatsCache = {};
  visibleDoctors.forEach(function(d){
    var stats = computeProviderStats(d.id);
    providerStatsCache[d.id] = stats;
    totalPayouts += computePayout(d, stats);
  });

  // v307: الفترةُ السابقة — نفسُ المجاميع الخمسة على prevCtx (داخل طبقة العملة نفسها).
  var prev = null;
  if (prevCtx) {
    prev = withCtx(prevCtx, _renderCur, function(){
      var t = clinicTotals();
      var pay = 0; visibleDoctors.forEach(function(d){ pay += computePayout(d, computeProviderStats(d.id)); });
      t.payouts = pay;
      return t;
    });
  }
  function deltaHtml(cur, prv, invert) {
    if (!prev) return '';
    if (!(prv > 0)) return (cur > 0) ? '<div class="delta flat">— لا سابق للمقارنة</div>' : '';
    var pct = (cur - prv) / prv * 100;
    var up = pct >= 0;
    var good = invert ? !up : up;            // المخبر: الانخفاضُ هو الجيّد
    var cls = Math.abs(pct) < 0.5 ? 'flat' : (good ? 'good' : 'bad');
    var arrow = Math.abs(pct) < 0.5 ? '=' : (up ? '▲' : '▼');
    return '<div class="delta ' + cls + '" title="الفترة السابقة ' + escapeHtml(prevCtx.from) + ' ← ' + escapeHtml(prevCtx.to) + '">'
      + arrow + ' ' + Math.abs(pct).toFixed(0) + '% <span>مقابل الفترة السابقة</span></div>';
  }

  // Doctor mode: show ONLY this doctor's own report (the provider card below).
  // Hide the clinic-wide aggregate summary (sessions/production/lab/collection/
  // payouts) — a doctor-employee must never see other providers' or whole-clinic
  // totals. Data is fetched tenant-wide and scoped client-side, so the summary
  // row would otherwise leak clinic totals. Matches Dentrix/OpenDental provider
  // self-service scoping. Provider card below already shows all of this doctor's
  // own numbers, so no information is lost.
  var summaryEl = document.getElementById('summaryRow');
  if (window.SyDentLock && window.SyDentLock.isDoctor()) {
    summaryEl.innerHTML = '';
    summaryEl.style.display = 'none';
  } else {
    summaryEl.style.display = '';
    summaryEl.innerHTML =
    '<div class="stat-card blue">'
      + '<div class="lbl">عدد الجلسات</div>'
      + '<div class="val">' + fmt(totalSessions) + '</div>'
      + '<div class="sub">في الفترة المحددة</div>'
      + deltaHtml(totalSessions, prev && prev.sessions)
    + '</div>'
    + '<div class="stat-card green">'
      + '<div class="lbl">إجمالي الإنتاج</div>'
      + '<div class="val">' + fmtSY(totalProduction) + '</div>'
      + '<div class="sub">قيمة كل ما سُجّل</div>'
      + deltaHtml(totalProduction, prev && prev.production)
    + '</div>'
    + '<div class="stat-card orange">'
      + '<div class="lbl">إجمالي المخبر</div>'
      + '<div class="val">' + fmtSY(totalLab) + '</div>'
      + '<div class="sub">من طلبات lab_orders</div>'
      + deltaHtml(totalLab, prev && prev.lab, true)
    + '</div>'
    + '<div class="stat-card blue">'
      + '<div class="lbl">إجمالي التحصيل</div>'
      + '<div class="val">' + fmtSY(totalCollection) + '</div>'
      + '<div class="sub">المدفوعات في الفترة</div>'
      + deltaHtml(totalCollection, prev && prev.collection)
    + '</div>'
    + '<div class="stat-card green">'
      + '<div class="lbl">مستحق الأطباء</div>'
      + '<div class="val">' + fmtSY(totalPayouts) + '</div>'
      + '<div class="sub">حسب الأساس المُختار</div>'
      + deltaHtml(totalPayouts, prev && prev.payouts)
    + '</div>';
  }

  // ─── Provider cards ───
  var html = '<div class="providers-grid">';

  visibleDoctors.forEach(function(d){
    var stats = providerStatsCache[d.id];  // Use cached version with deduped labs
    var payout = computePayout(d, stats);
    var sharePctDisplay = formatSharePctDisplay(d);
    // v384: نسبٌ متغيّرة داخل الفترة تُقال صراحةً (كل جلسة بنسبة تاريخها)
    var _wFrom = document.getElementById('fromDate').value, _wTo = document.getElementById('toDate').value;
    var _ratesIn = (window.SyDentPayroll && _wFrom && _wTo) ? window.SyDentPayroll.ratesInRange(d.share_history, resolveSharePercent(d), _wFrom, _wTo) : [];
    if (_ratesIn.length > 1) sharePctDisplay = escapeHtml(_ratesIn.map(function(r){ return r + '%'; }).join(' ← ')) + ' (متغيّرة بالفترة)';

    // F5 (قاعدة #195): اللون يُحقن بسمة style — يُقبل hex أو var(--*) حصراً وإلا الافتراضي.
    var color = /^#[0-9a-fA-F]{3,8}$/.test(d.color || '') || /^var\(--[a-zA-Z0-9-]+\)$/.test(d.color || '')
      ? d.color : '#0d8577';
    var basisLabel = basis === 'production' ? 'الإنتاج' : (basis === 'net' ? 'الصافي' : 'التحصيل');
    var baseValue = getShareBase(stats);

    // v306: الدفعات تُؤرَّخ بيوم التسديد (لا بتداخل الفترة) + رصيد مرحَّل من قبل الفترة.
    var from = document.getElementById('fromDate').value;
    var to   = document.getElementById('toDate').value;
    var paidInRange = payoutsPaidInWindow(d.id, from, to);
    var opening = computeOpeningBalance(d, from);          // null = غير متاح / المالك
    var closing = (opening === null) ? (payout - paidInRange) : (opening + payout - paidInRange);
    var closingSt = balanceState(closing);

    var ledgerHtml = '';
    if (opening !== null && Math.abs(opening) >= 0.005) {
      var opSt = openingState(opening);
      ledgerHtml += '<div class="prov-row"><span class="k">رصيد سابق قبل ' + escapeHtml(from) + '<span class="hint">' + opSt.txt + '</span></span>'
        + '<span class="v" style="color:var(--' + (opSt.cls === 'warn' ? 'yellow' : 'blue') + ');">' + (opSt.cls === 'warn' ? '+' : '−') + fmtSY(opSt.val) + '</span></div>';
    }
    if (paidInRange > 0) {
      ledgerHtml += '<div class="prov-row"><span class="k">المدفوع للطبيب بالفترة<span class="hint">بتاريخ التسديد — حصّة الإنتاج من الدفعات</span></span><span class="v">' + fmtSY(paidInRange) + '</span></div>';
    }
    // صفّ الرصيد الملوَّن يظهر فقط حين يوجد ما يُسوَّى (دفعة بالفترة أو رصيد مرحَّل) — وإلا فالصندوق يكفي.
    var remainingHtml = '';
    if (opening === null ? paidInRange > 0 : (paidInRange > 0 || Math.abs(opening) >= 0.005)) {
      remainingHtml = '<div class="prov-row remaining ' + closingSt.cls + '">'
        + '<span class="k">' + closingSt.txt + '</span>'
        + '<span class="v">' + (closingSt.cls === 'ok' ? '✓' : fmtSY(closingSt.val)) + '</span>'
      + '</div>';
    }

    // v382: نموذجُ التعويض يُقال صراحةً — هذا التقرير دفترُ حصّة الإنتاج، والراتبُ الثابت
    // يُحسب ويُسجَّل من صفحة الرواتب (بأيام الشهر الفعلية) ولا يدخل بالرصيد أدناه.
    // كان طبيبُ الراتب الثابت يظهر «مستحق 0» ثم «مقدَّم لصالح العيادة» بعد دفع راتبه.
    var compensationHtml = '';
    var _cm = d.compensation_model || 'percentage';
    if ((_cm === 'salary' || _cm === 'hybrid') && !d.is_owner) {
      var _sal = Number(d.monthly_salary) || 0;
      /* v452: كان سطراً رمادياً يضيع بين الأرقام، فيُقرأ الراتبُ كأنه داخلٌ
         بالرصيد أدناه (بلاغ المالك). صار بطاقةً زرقاء بوسمٍ صريح. */
      compensationHtml = '<div class="prov-row sal-row"><span class="k">💼 راتب ثابت' + (_cm === 'hybrid' ? ' (إضافةً للنسبة)' : '')
        + '<span class="hint"><b>لا يدخل بالرصيد أدناه</b> — يُحسب ويُسجَّل من صفحة الرواتب</span></span>'
        + '<span class="v">' + (_sal > 0 ? escapeHtml(_fmtRowAmt({ amount: _sal, currency: d.salary_currency })) + ' / شهر' : 'لم يُحدَّد') + '</span></div>';
    } else if (_cm === 'none' && !d.is_owner) {
      compensationHtml = '<div class="prov-row"><span class="k">التعويض<span class="hint">بلا حساب تلقائي — يُدخَل يدوياً من صفحة الرواتب ولا يُخصم من الحصّة</span></span>'
        + '<span class="v">بدون</span></div>';
    }

    var avgSessionValue = stats.sessionCount > 0 ? stats.production / stats.sessionCount : 0;
    // نسبة التحصيل تُعرض فقط حين يوجد إنتاج بالفترة: نقدٌ عابر للفترات ÷ إنتاج فترة واحدة
    // بلا إنتاج = «(0%)» أو «(462%)» مضلِّل.
    var collectionRateHtml = stats.production > 0
      ? ' <span style="color:var(--text2);font-size:10px;">(' + (stats.collection / stats.production * 100).toFixed(0) + '%)</span>'
      : '';
    var inactiveBadge = d.is_active === false
      ? ' <span class="tone tone-red" style="display:inline-block;border-width:1px;border-style:solid;padding:0 5px;border-radius:8px;font-size:9px;font-weight:700;">معطل</span>'
      : '';

    html += '<div class="prov-card">'
      + '<div class="color-bar" style="background:' + color + ';"></div>'
      + '<div class="prov-body">'
        + '<div class="prov-head">'
          + '<div class="prov-avatar" style="background:' + color + ';">' + escapeHtml(initials(d.name)) + '</div>'
          + '<div style="flex:1;">'
            + '<div class="prov-name">'
              + providerTypePrefix(d.provider_type)
              + escapeHtml(d.name) + (d.is_owner ? ' ⭐' : '') + inactiveBadge
            + '</div>'
            + '<div class="prov-role">' + (d.role ? escapeHtml(d.role) + ' • ' : '') + 'نسبة: ' + sharePctDisplay + '</div>'
          + '</div>'
        + '</div>'

        + '<div class="prov-rows">'
          + '<div class="prov-row"><span class="k">عدد الجلسات</span><span class="v">' + fmt(stats.sessionCount) + '</span></div>'
          + '<div class="prov-row"><span class="k">متوسط قيمة الجلسة</span><span class="v">' + fmtSY(avgSessionValue) + '</span></div>'
          + '<div class="prov-row"><span class="k">الإنتاج</span><span class="v">' + fmtSY(stats.production) + '</span></div>'
          + '<div class="prov-row"><span class="k">تكلفة المخبر</span><span class="v">' + fmtSY(stats.labCost) + '</span></div>'
          + '<div class="prov-row"><span class="k">الصافي بعد المخبر</span><span class="v">' + fmtSY(stats.net) + '</span></div>'
          + '<div class="prov-row"><span class="k">التحصيل النقدي بالفترة<span class="hint">ما قُبض بالفترة لجلساته المكتملة — بأي تاريخ</span></span><span class="v">' + fmtSY(stats.collection) + collectionRateHtml + '</span></div>'
          + '<div class="prov-row divider"><span class="k">أساس الحساب (' + basisLabel + ')</span><span class="v">' + fmtSY(baseValue) + '</span></div>'
          + '<div class="prov-row"><span class="k">مستحق الفترة<span class="hint">' + sharePctDisplay + ' × ' + basisLabel + '</span></span><span class="v">' + fmtSY(payout) + '</span></div>'
          + compensationHtml
          + ledgerHtml
          + remainingHtml
        + '</div>'

        // v306: الصندوق = الرصيد الختامي حتى نهاية الفترة (ما يُسوَّى فعلاً)، لا مستحق الفترة وحده.
        // المالك دافعٌ لا مستفيد ⇒ يبقى صندوقه «مستحق الفترة» كما كان.
        + (opening === null
          ? '<div class="payout-box">'
              + '<div><div class="lbl">💵 مستحق الطبيب</div><div class="sub">' + sharePctDisplay + ' × ' + basisLabel + '</div></div>'
              + '<div class="amt">' + fmtSY(payout) + '</div>'
            + '</div>'
          : '<div class="payout-box bal-' + closingSt.cls + '">'
              + '<div><div class="lbl">💵 الرصيد حتى ' + escapeHtml(to) + (_cm === 'percentage' || d.is_owner ? '' : ' — حصّة الإنتاج فقط') + '</div>'
                + '<div class="sub">' + closingSt.txt + ' · سابق + مستحق الفترة − مدفوع'
                + (_cm === 'salary' ? ' · الراتبُ الثابت يُسوّى من صفحة الرواتب'
                   : (_cm === 'hybrid' ? ' · الراتبُ الثابت خارجَه' : '')) + '</div></div>'
              + '<div class="amt">' + fmtSY(closingSt.val) + '</div>'
            + '</div>')

        + '<div class="prov-actions sy-acts sy-acts-grid">'
          + '<button class="sy-act" onclick="showDetails(\'' + d.id + '\',\'' + (_renderCur || '') + '\')">📋 التفاصيل</button>'
          + '<button class="sy-act" onclick="printSlip(\'' + d.id + '\',\'' + (_renderCur || '') + '\')">🖨️ طباعة كشف</button>'
          // v308: كشف الحساب (القيد الزمني برصيد جارٍ) — للمستفيد لا للمالك الدافع.
          + (!d.is_owner ? '<button class="sy-act" onclick="openLedger(\'' + d.id + '\',\'' + (_renderCur || '') + '\')">📒 كشف حساب</button>' : '')
          // المالك هو الدافع لا المستفيد (مرآة قاعدة payouts.html): أرباحه سحبٌ من حقوق الملكية
          // لا مصروفاً — ودفعةٌ مسجَّلة له كانت ستدخل مصاريف المحاسبة وتُنقص صافي الربح خطأً.
          + ((poIsOwner() && !d.is_owner) ? '<button class="sy-act sy-act-primary" onclick="openPayoutModal(\'' + d.id + '\',\'' + (_renderCur || '') + '\')">💵 تسجيل دفعة</button>' : '')
        + '</div>'
      + '</div>'
    + '</div>';
  });

  // Add unassigned card if relevant and "all" is selected. Show it when there are
  // unassigned sessions OR unassigned lab cost / collection, so an unassigned lab
  // (provider_id NULL) never silently disappears from the per-provider view while

  if (providerFilter === 'all') {
    var stats = computeProviderStats('_unassigned');
    if (stats.sessionCount > 0 || stats.labCost > 0 || stats.collection > 0) {
      html += '<div class="prov-card">'
        + '<div class="color-bar" style="background:var(--text3);"></div>'

              + '<div class="prov-role">جلسات/مخابر قديمة أو أُدخلت قبل تحديد الطبيب</div>'
            + '</div>'
          + '</div>'
          + '<div class="prov-rows">'
            + '<div class="prov-row"><span class="k">عدد الجلسات</span><span class="v">' + fmt(stats.sessionCount) + '</span></div>'
            + '<div class="prov-row"><span class="k">الإنتاج</span><span class="v">' + fmtSY(stats.production) + '</span></div>'

    document.getElementById('detailsBody').innerHTML =
      '<div class="empty-state" style="padding:30px 20px;"><div class="ic">📋</div>' +
      '<div class="ttl">لا توجد جلسات في هذه الفترة</div></div>';
    openModal('detailsModal');
    return;
  }

  // Resolve effective share% via helper (handles null/empty/owner fallback correctly)
  var sharePct = resolveSharePercent(d);

  // Lab cost is attributed per-provider now (provider_id), not per-session. For this
  // per-session breakdown we distribute the provider's total lab cost proportionally

      : '';

      + '<td>' + escapeHtml(SyDT.numDate(s.date) || '—') + '</td>'
      + '<td>' + sessionPatientCell(s) + '</td>'
      + '<td>' + escapeHtml(s.type || '—') + ' ' + statusBadge + '</td>'
      + '<td>' + formatSessionToothCell(s) + '</td>'
      + '<td class="num">' + fmtSY(s.cost) + '</td>'
      + '<td class="num" style="color:var(--orange);">' + (sLabCost > 0 ? fmtSY(sLabCost) : '—') + '</td>'

    : '';

  document.getElementById('detailsBody').innerHTML = collectionNote
    + '<table class="data-table">'
      + '<thead><tr>'
        + '<th>التاريخ</th><th>المريض</th><th>العلاج</th><th>السن</th>'
        + '<th class="num">السعر</th><th class="num">المخبر</th><th class="num">نصيب الطبيب</th>'
      + '</tr></thead>'
      + '<tbody>' + rows + '</tbody>'
    + '</table>';

// ═══════════════════════════════════════════════════════════════════════════
// v308 — كشف حساب الطبيب (قيدٌ زمني برصيدٍ جارٍ) — مرآة كشف المخبر (labs.html) مع رصيد افتتاحي.
// افتتاحي (computeOpeningBalance) → حركات الفترة تصاعدياً → ختامي. الحركات:

//   تحصيل: كل توزيع مكتسب +amount×نسبة بتاريخ دفعته (+ سطرٌ واحد للدفعات القديمة بلا توزيع)؛

// مجموعُ الحركات غير النقدية يُطابَق حرفياً مع computePayout (سطرُ «تسوية» عند القصّ على الصفر

var _ledgerLast = null;
function buildProviderLedger(d) {
  var from = document.getElementById('fromDate').value;
  var to   = document.getElementById('toDate').value;
  var pct  = resolveSharePercent(d);
  var stats = computeProviderStats(d.id);
  var due   = computePayout(d, stats);
  var paid  = payoutsPaidInWindow(d.id, from, to);
  var opening = computeOpeningBalance(d, from);
  var entries = [];
  var pctTxt = pct + '%';
  var match = function(pid){ return pid === d.id; };

  if (basis === 'collection') {
    var payById = {};
    payments.forEach(function(p){ payById[p.id] = p; });
    var withSplit = {};
    paymentSplits.forEach(function(sp){ withSplit[sp.payment_id] = true; });
    paymentSplits.forEach(function(sp){
      if (!splitIsEarned(sp) || !match(sp.provider_id)) return;
      var pm = payById[sp.payment_id] || {};
      var pn = pm.patient_id ? (patientNames[pm.patient_id] || '') : '';
      entries.push({ day: pm.date || '', ts: pm.created_at || '', id: String(sp.payment_id || ''), ord: 1,
        kind: 'earn', label: 'تحصيل' + (pn ? ' — ' + pn : ''), sub: pctTxt + ' × ' + fmtSY(sp.amount),
        amt: (Number(sp.amount) || 0) * pct / 100 });
    });
    var legacy = stats.collection - paymentSplits.reduce(function(a, sp){
      return a + ((splitIsEarned(sp) && match(sp.provider_id)) ? (Number(sp.amount) || 0) : 0); }, 0);
    if (Math.abs(legacy) >= 0.005) {
      entries.push({ day: to, ts: '', id: '', ord: 2, kind: 'earn', label: 'دفعات بلا توزيع (تخصيص نسبي)',
        sub: pctTxt + ' × ' + fmtSY(legacy), amt: legacy * pct / 100 });
    }
  } else {
    stats.sessions.forEach(function(s){
      var nm = s.patient_id ? (patientNames[s.patient_id] || '') : '';
      entries.push({ day: s.date || '', ts: s.created_at || '', id: String(s.id || ''), ord: 1, kind: 'earn',
        label: (s.type || s.description || 'جلسة') + (nm ? ' — ' + nm : ''),
        sub: pctTxt + ' × ' + fmtSY(s.cost) + (s.tooth_num ? ' · سن ' + s.tooth_num : '') + (s.status === 'planned' ? ' · مخططة' : ''),
        amt: (Number(s.cost) || 0) * pct / 100 });
    });
    if (basis === 'net') {
      labOrders.forEach(function(lo){
        if (!match(lo.provider_id)) return;
        var d_ = lo.date_sent ? new Date(lo.date_sent) : null;
        var nm = lo.patient_id ? (patientNames[lo.patient_id] || '') : '';
        entries.push({ day: (d_ && !isNaN(d_.getTime())) ? toDay(d_) : '', ts: lo.date_sent || '', id: String(lo.id || ''), ord: 2, kind: 'lab',
          label: 'خصم مخبر' + (nm ? ' — ' + nm : '') + (lo.tooth_num ? ' · سن ' + lo.tooth_num : ''),
          sub: pctTxt + ' × ' + fmtSY(lo.cost), amt: -((Number(lo.cost) || 0) * pct / 100) });

    }
  }
  // مطابقة حرفية مع مستحق البطاقة (القصّ على الصفر عند صافٍ سالب، أو فروق تقريب).
  var earnSum = entries.reduce(function(a, e){ return a + e.amt; }, 0);
  var residual = Math.round((due - earnSum) * 100) / 100;
  if (Math.abs(residual) >= 0.005) {
    entries.push({ day: to, ts: '\uffff', id: '', ord: 3, kind: 'adj',
      label: residual > 0 ? 'تسوية' : 'تسوية — الصافي السالب يُقصّ عند الصفر', sub: 'ليتطابق مع مستحق الفترة', amt: residual });
  }

    if (po.provider_id !== d.id) return;
    var day = _payoutDay(po);
    if (day < from || day > to) return;
    // v382: حصّةُ الإنتاج من الدفعة فقط (الراتبُ الثابت والمكافأة خارج هذا الدفتر)
    var shareAmt = _payoutShareOf(po);
    var fullAmt  = Number(po.amount) || 0;
    if (shareAmt <= 0) return;
    var partial  = Math.abs(shareAmt - fullAmt) > 0.005;
    entries.push({ day: day, ts: po.paid_at || '', id: String(po.id || ''), ord: 4, kind: 'pay',
      label: (partial ? 'حصّة الإنتاج من دفعة للطبيب' : 'دفعة للطبيب') + (po.notes ? ' — ' + po.notes : ''),
      sub: ((po.period_start && po.period_end) ? 'عن ' + po.period_start + ' ← ' + po.period_end : '')
         + (partial ? ' · إجمالي الدفعة ' + fmtSY(fullAmt) + ' (الباقي راتب/مكافأة)' : ''),
      amt: -shareAmt });
  });
  entries.sort(function(a, b){
    if (a.day !== b.day) return a.day.localeCompare(b.day);
    if (a.ord !== b.ord) return a.ord - b.ord;
    if (a.ts !== b.ts) return a.ts.localeCompare(b.ts);
    return a.id.localeCompare(b.id);

  entries.forEach(function(e){ bal += e.amt; e.bal = bal; });

           closing: closing, entries: entries, curLbl: fmtCurLabel() };
}
