/* ── v618 mobile/network: MIRROR intake.html ↔ portal.html ↔ book.html byte-for-byte (prove-portal · prove-public-mobile) ──
   (1) Sentry loads async (a slow/blocked CDN no longer holds the page) and never receives the
       link token (any 64-hex run is scrubbed from events and breadcrumbs) nor the page (replays off).
   (2) withTimeout: a hanging request on a weak mobile link ends in the retry screen, not an endless spinner. */
window.sentryOnLoad = function(){
  try {
    var scrub = function(o){ try { return JSON.parse(JSON.stringify(o).replace(/[0-9a-fA-F]{64}/g, '[token]')); } catch (e) { return null; } };
    Sentry.init({ sendDefaultPii: false, replaysSessionSampleRate: 0, replaysOnErrorSampleRate: 0,
      beforeSend: function(ev){ return scrub(ev); }, beforeBreadcrumb: function(b){ return scrub(b); } });
  } catch (e) {}
};
window.withTimeout = function(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
};
</script>

/* M181: theme — same key as the app (sydent_theme) so the owner's phone follows his choice; the patient's own choice persists on his phone */
(function(){
  var KEY = 'sydent_theme';
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#0a1628' : '#ffffff');
    var b = document.getElementById('themeBtn'); if (b) { b.textContent = t === 'dark' ? '☀️' : '🌙'; b.setAttribute('aria-label', t === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن'); }
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === 'dark' ? 'dark' : 'light');
  window.toggleTheme = function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  };
  document.addEventListener('DOMContentLoaded', function(){ apply(document.documentElement.getAttribute('data-theme') || 'light'); });
})();
</script>

    + '<textarea id="fMeds" maxlength="' + LIMITS.meds + '" rows="3" placeholder="مثال: ميتفورمين 500 مرتين يومياً…" oninput="countSync(\'fMeds\')"></textarea><span class="cnt" id="fMedsCnt"></span>'
    + '</div>';

  h += '<div class="card"><div class="step-title"><span class="n">5</span>سبب الزيارة</div>'
    + '<p class="step-hint">ما الذي يزعجك؟ منذ متى؟</p>'
    + '<textarea id="fComplaint" maxlength="' + LIMITS.complaint + '" rows="3" placeholder="مثال: ألم في الضرس السفلي الأيسر منذ أسبوع، يزداد مع البارد…" oninput="countSync(\'fComplaint\')"></textarea><span class="cnt" id="fComplaintCnt"></span>'
    + '</div>';

  h += '<div class="card"><div class="step-title"><span class="n">6</span>الإقرار' + (INFO && INFO.ask_signature ? ' والتوقيع' : '') + '</div>'
    + '<div class="consent" id="fConsent" role="checkbox" aria-checked="false" tabindex="0" onclick="toggleConsent(this)" onkeydown="if(event.key===\' \'||event.key===\'Enter\'){event.preventDefault();toggleConsent(this);}">'
    + '<span class="bx" aria-hidden="true">✓</span>'
    + '<span class="t">أقرّ بأن المعلومات أعلاه صحيحة وكاملة حسب علمي، وأتعهد بإبلاغ العيادة بأي تغيير في حالتي الصحية.</span></div>'
    + (INFO && INFO.ask_signature
        ? '<label>التوقيع <span class="opt">(اختياري — ارسم بإصبعك)</span></label>'
          + '<div class="sig-wrap" id="sigWrap"><canvas class="sig" id="sigPad" aria-label="لوحة التوقيع"></canvas><div class="sig-ph">وقّع هنا</div></div>'
          + '<div class="sig-tools"><span>يمكنك تخطّي التوقيع.</span><button type="button" class="lnk" onclick="sigClear()">مسح التوقيع</button></div>'
        : '')
    + '<div class="hp-field" aria-hidden="true"><label>website</label><input type="text" id="hpWeb" tabindex="-1" autocomplete="off"></div>'
    + '<div class="err" id="errBox"></div>'
    + '<button type="button" class="btn btn-go" id="btnSend" onclick="submitForm()">إرسال الاستمارة</button>'
    + '</div>';
  app(h);
  ['fMedOther','fAlgOther','fMeds','fComplaint'].forEach(countSync);
  if (INFO && INFO.ask_signature) sigInit();
}
function todayYmd(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

/* ── Signature pad (optional) ── */
var _sig = { c:null, ctx:null, drawing:false, has:false, last:null };
function sigInit(){
  var c = document.getElementById('sigPad');
  if (!c) return;
  _sig.c = c; _sig.ctx = c.getContext('2d');
  sigResize();
  c.addEventListener('pointerdown', sigDown);
  c.addEventListener('pointermove', sigMove);
  c.addEventListener('pointerup', sigUp);
  c.addEventListener('pointercancel', sigUp);
  c.addEventListener('pointerleave', sigUp);
  window.addEventListener('resize', sigResize);
}
function sigResize(){
  var c = _sig.c; if (!c) return;
  var ratio = Math.min(2, window.devicePixelRatio || 1);
  var w = c.clientWidth || 300, hgt = c.clientHeight || 170;
  var keep = _sig.has ? c.toDataURL('image/png') : null;
  c.width = Math.round(w * ratio); c.height = Math.round(hgt * ratio);
  var ctx = _sig.ctx;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1c1917';
  if (keep) { var img = new Image(); img.onload = function(){ ctx.drawImage(img, 0, 0, w, hgt); }; img.src = keep; }
}
function sigPos(e){
  var r = _sig.c.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function sigDown(e){
  e.preventDefault();
  _sig.drawing = true; _sig.last = sigPos(e);
  try { _sig.c.setPointerCapture(e.pointerId); } catch(_e) {}
}
function sigMove(e){
  if (!_sig.drawing) return;
  e.preventDefault();
  var p = sigPos(e), ctx = _sig.ctx;
  ctx.beginPath(); ctx.moveTo(_sig.last.x, _sig.last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  _sig.last = p;
  if (!_sig.has) { _sig.has = true; var w = document.getElementById('sigWrap'); if (w) w.classList.add('has'); }
}
function sigUp(){ _sig.drawing = false; }
function sigClear(){
  if (!_sig.c) return;
  _sig.has = false;
  _sig.ctx.save(); _sig.ctx.setTransform(1,0,0,1,0,0); _sig.ctx.clearRect(0, 0, _sig.c.width, _sig.c.height); _sig.ctx.restore();
  var w = document.getElementById('sigWrap'); if (w) w.classList.remove('has');
}
function sigData(){
  if (!_sig.c || !_sig.has) return null;
  try {
    /* downscale to a small white-background PNG — keeps the payload well under the DB cap.
       v620: the pad's own proportions (a phone pad is ~2:1, not 3:1) — a forced 600×200 stretched every
       phone signature 1.55× wide. Width 600, height follows the pad (100–400). */
    var cw = _sig.c.clientWidth || 300, ch = _sig.c.clientHeight || 170;
    var H = Math.max(100, Math.min(400, Math.round(600 * ch / cw)));
    var out = document.createElement('canvas'); out.width = 600; out.height = H;
    var o = out.getContext('2d'); o.fillStyle = '#ffffff'; o.fillRect(0, 0, 600, H);
    o.drawImage(_sig.c, 0, 0, 600, H);
    var d = out.toDataURL('image/png');
    return d.length <= 120000 ? d : null;
  } catch(_e) { return null; }
}

/* ── Submit ── */
function chipsOf(g){
  return Array.prototype.slice.call(document.querySelectorAll('.chip.on[data-g="' + g + '"]')).map(function(el){ return el.getAttribute('data-k'); });
}
function showErr(msg){
  var e = document.getElementById('errBox'); if (!e) return;
  e.textContent = msg; e.style.display = msg ? 'block' : 'none';
  if (msg) e.scrollIntoView({ block:'center', behavior:'smooth' });
}
async function submitForm(){
  var btn = document.getElementById('btnSend');
  showErr('');
  // honeypot: bots that fill it get a silent "success" with zero RPC traffic
  var hp = document.getElementById('hpWeb');
  if (hp && hp.value) { screenDone(new Date().toISOString()); return; }
  var consent = document.getElementById('fConsent');
  if (!consent || !consent.classList.contains('on')) { showErr('يرجى تأكيد الإقرار أولاً.'); return; }
  var dobEl = document.getElementById('fDob');
  var dob = dobEl ? (dobEl.value || '') : '';
  if (dob && (dob < '1900-01-01' || dob > todayYmd())) { showErr('تاريخ الميلاد غير صحيح.'); return; }
  var answers = {
    consent: true,
    med: chipsOf('med'), alg: chipsOf('alg'), extra: chipsOf('extra'),
    med_other: (document.getElementById('fMedOther').value || '').trim().slice(0, LIMITS.med_other),
    alg_other: (document.getElementById('fAlgOther').value || '').trim().slice(0, LIMITS.alg_other),
    meds:      (document.getElementById('fMeds').value || '').trim().slice(0, LIMITS.meds),
    complaint: (document.getElementById('fComplaint').value || '').trim().slice(0, LIMITS.complaint),
    dob: dob || null
  };
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  try {
    if (!sb) throw new Error('vendor');   /* v618: a hanging send ends in the retry message; re-sending is safe (already_submitted ⇒ done) */
    var res = await withTimeout(sb.rpc('intake_submit', { p_token: TOKEN, p_answers: answers, p_signature: sigData() }), 30000);
    if (res.error) throw res.error;
    screenDone(new Date().toISOString());
    try { window.scrollTo({ top:0, behavior:'smooth' }); } catch(_e) {}
  } catch (e) {
    var m = (e && e.message) || '';
    if (m.indexOf('already_submitted') !== -1) { screenDone(null); return; }
    if (m.indexOf('expired') !== -1) { screenDead('انتهت صلاحية الرابط', ERR_MAP.expired, '⌛'); return; }
    if (m.indexOf('bad_token') !== -1 || m.indexOf('unavailable') !== -1) { screenDead('الرابط غير متاح', errOf(e), '🔗'); return; }
    showErr(errOf(e));
    btn.disabled = false; btn.textContent = 'إرسال الاستمارة';
  }
}

/* ── Boot ── */
(async function boot(){
  var m = (location.search || '').match(/[?&]t=([0-9a-fA-F]{64})/);
  TOKEN = m ? m[1].toLowerCase() : null;
  if (!TOKEN) { screenDead('الرابط غير صالح', ERR_MAP.bad_token, '🔗'); return; }
  try {
    if (!sb) throw new Error('vendor');   /* v618 */
    var res = await withTimeout(sb.rpc('intake_info', { p_token: TOKEN }), 25000);
    if (res.error) throw res.error;
    var row = Array.isArray(res.data) ? res.data[0] : res.data;
    if (!row) { screenDead('الرابط غير متاح', ERR_MAP.bad_token + ' أو أن الاستمارة غير متاحة حالياً لدى العيادة.', '🔗'); return; }
    INFO = row;
    document.title = 'استمارة المريض — ' + (row.clinic_name || '');
    if (row.status !== 'pending') { screenDone(row.submitted_at); return; }
    if (row.expired) { screenDead('انتهت صلاحية الرابط', ERR_MAP.expired, '⌛'); return; }
    screenForm();
  } catch (e) {
    app('<div class="card center"><div class="big-icon">⚠️</div><h1>تعذّر التحميل</h1><p class="sub" style="margin-top:8px;">تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p>'
      + '<button type="button" class="btn btn-go" onclick="location.reload()">إعادة المحاولة</button></div>');
  }
})();
</script>
