name: Supabase Backup

# ─────────────────────────────────────────────────────────────────────────────
# الهدف: نسخة احتياطية يومية تلقائية لقاعدة بيانات Supabase وملفات المرضى،
#   كلّها على Cloudflare R2 (bucket: sydent-backups) — بلا ريبو نسخ ولا PAT.
#
#   • قاعدة البيانات: supabase db dump (الأدوار + المخطّط + البيانات، بما فيها
#     مخطّط auth) → tar.gz → تشفير AES-256 (openssl، PBKDF2) بكلمة سرّ لا يعرفها
#     إلا أسرار GitHub → db/<STAMP>.tar.gz.enc على R2. النسخ الأقدم من 30 يوماً
#     تُحذف تلقائياً. بلا كلمة السرّ لا يُفتح الملف — حتى لو تسرّب الـ bucket.
#   • ملفات المرضى (bucket patient-files): نسخ إضافي فقط إلى patient-files/
#     على R2 — لا يُحذف منها شيء أبداً.
#   • الاستعادة المجرَّبة آلياً: .github/workflows/dr-restore-test.yml.
#
# ⚠️ مقفول افتراضياً: لا يعمل إطلاقاً ما لم يكن متغيّر المستودع
#   BACKUP_ENABLED = 'true' (Settings → Secrets and variables → Actions → Variables).
#
# الأسرار المطلوبة (Settings → Secrets and variables → Actions → Secrets):
#   • SUPABASE_DB_URL  — Session pooler (IPv4):
#       postgresql://postgres.<ref>:<PASSWORD>@aws-1-<region>.pooler.supabase.com:5432/postgres
#   • BACKUP_PASSPHRASE — كلمة سرّ طويلة عشوائية لتشفير نسخ قاعدة البيانات.
#       احفظ نسخة منها خارج GitHub: بدونها لا تُستعاد أي نسخة.
#   • SUPABASE_S3_ACCESS_KEY_ID / SUPABASE_S3_SECRET_ACCESS_KEY
#       من: Supabase → Storage → Configuration → S3 → Access keys.
#   • R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID
#       من: Cloudflare → R2 → Manage API Tokens (Object Read & Write على bucket
#       sydent-backups فقط). R2_ACCOUNT_ID = الجزء قبل .r2.cloudflarestorage.com.
#   • BETTERSTACK_HEARTBEAT_URL (اختياري) — نبضة نجاح يومية.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions (للاختبار الأول)
  schedule:
    - cron: '0 2 * * *'     # كل يوم 02:00 UTC

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # ⚠️ البوّابة: لا شيء يحدث ما لم يُضبط BACKUP_ENABLED='true' يدوياً.
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      KEEP_DAYS: '30'
      # المصدر: Supabase Storage عبر نقطته المتوافقة مع S3
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SUPABASE_ENDPOINT: https://${{ vars.SUPABASE_PROJECT_REF || 'nxkalpjrqvpglphmiuui' }}.storage.supabase.co/storage/v1/s3
      RCLONE_CONFIG_SUPABASE_REGION: ${{ vars.SUPABASE_REGION || 'eu-central-1' }}
      RCLONE_CONFIG_SUPABASE_NO_CHECK_BUCKET: "true"
      # الوجهة: Cloudflare R2 (bucket: sydent-backups)
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Check secrets
        env:
          S3_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACC: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ]   || missing="$missing SUPABASE_DB_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          [ -n "$S3_ID" ]  || missing="$missing SUPABASE_S3_ACCESS_KEY_ID"
          [ -n "$S3_KEY" ] || missing="$missing SUPABASE_S3_SECRET_ACCESS_KEY"
          [ -n "$R2_ID" ]  || missing="$missing R2_ACCESS_KEY_ID"
          [ -n "$R2_KEY" ] || missing="$missing R2_SECRET_ACCESS_KEY"
          [ -n "$R2_ACC" ] || missing="$missing R2_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::missing secrets:$missing"; exit 1; fi
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::BACKUP_PASSPHRASE must be at least 20 characters"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install rclone
        run: |
          set -euo pipefail
          # rclone: الأداة الموصى بها رسمياً من Supabase لنسخ كائنات Storage بالجملة.
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Create dump (roles + schema + data)
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d_%H%M)"
          DIR="work/${STAMP}"
          mkdir -p "$DIR"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$DIR/roles.sql"  --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$DIR/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$DIR/data.sql"   --data-only --use-copy
          for f in roles.sql schema.sql data.sql; do [ -s "$DIR/$f" ] || { echo "::error::$f is empty"; exit 1; }; done
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Encrypt and upload to R2
        run: |
          set -euo pipefail
          OUT="work/${STAMP}.tar.gz.enc"
          tar -C work -czf - "$STAMP" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$OUT"
          # the file must decrypt and list before it counts as a backup
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "$OUT" | tar -tzf - > /dev/null
          rclone copyto "$OUT" "r2:sydent-backups/db/${STAMP}.tar.gz.enc" --s3-no-check-bucket -v
          rclone check work "r2:sydent-backups/db" --one-way --size-only --include "${STAMP}.tar.gz.enc"
          rm -rf "work/${STAMP}"
          echo "✅ db/${STAMP}.tar.gz.enc ($(du -h "$OUT" | cut -f1))"

      - name: Remove database backups older than ${{ env.KEEP_DAYS }} days
        run: |
          set -euo pipefail
          rclone delete "r2:sydent-backups/db" --min-age "${KEEP_DAYS}d" --include "*.tar.gz.enc" -v
          echo "database backups kept:"; rclone lsf "r2:sydent-backups/db" | sort

      # ───────────────────────────────────────────────────────────────────────
      # ملفات الـ Storage (أشعة/صور/PDF المرضى) ليست داخل db dump (الـ dump يحوي
      # صفوف الميتاداتا فقط)، فهذه الخطوة تسدّ تلك الفجوة.
      # ───────────────────────────────────────────────────────────────────────
      - name: Backup Storage files (patient-files) to Cloudflare R2
        run: |
          set -euo pipefail
          SRC="supabase:patient-files"
          DST="r2:sydent-backups/patient-files"
          # copy (وليس sync): إضافي فقط — لا يحذف أبداً من R2 إن حُذف ملف من
          #   المصدر. حماية ضد الحذف العرضي/الكيدي لملفات المرضى.
          # --size-only: ملفات المرضى تُكتب مرة ولا تتغيّر، فمقارنة الحجم تكفي.
          rclone copy "$SRC" "$DST" \
            --size-only --transfers 4 --checkers 8 --fast-list --stats-one-line -v
          echo "Verifying every source object exists in R2…"
          rclone check "$SRC" "$DST" --one-way --size-only --fast-list
          echo "Storage backup to R2 complete:"
          rclone size "$DST"

      # نبضة نجاح (BetterStack Heartbeat): تُرسل فقط إذا نجحت كل الخطوات أعلاه.
      # آمنة قبل الإعداد: إن كان السرّ فارغاً تُتخطّى الخطوة بصمت بلا فشل.
      - name: Success heartbeat (BetterStack)
        if: ${{ success() }}
        env:
          HB_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
        run: |
          if [ -z "$HB_URL" ]; then echo "No heartbeat URL configured — skipping."; exit 0; fi
          curl -fsS --retry 3 --max-time 15 "$HB_URL" > /dev/null
          echo "Heartbeat sent."
