# ════════════════════════════════════════════════════════════════════════
# SyDent — finance-integrity.yml · فحصُ هوية المحاسبة الليلي (قراءة فقط)
#
# لماذا: الفحص اليدوي بـ13 أيلول 2026 كشف دفعتين بلا توزيع لم يرَهما أي حارس نصّي
#   (الحُرّاس يفحصون الكود، لا البيانات). هذا التشغيل يجعل ادّعاء «المحاسبة نظيفة»
#   مُراقَباً كل ليلة: 22 اختبار هوية على القاعدة الحيّة، أي عددٍ غير صفر = فشل أحمر.
# ماذا يفحص: scripts/finance-integrity.sql (المصدر الوحيد — نفس الملف يُشغَّل يدوياً
#   من SQL Editor). يشمل: مجموع التوزيعات = الدفعة · دفعات بلا توزيع · عملة التوزيع =
#   الدفعة = الجلسة · مكتسب على مخطّط · تغطية زائدة · أيتام · رصيد مقدّم راكد · انحراف
#   الطبيب/التاريخ · العملات الفارغة · ذمم المخابر · عابر المستأجرين.
# لا يكتب شيئاً — SELECT فقط. الفشل ينبّه ولا يُصلح: الإصلاح قرارُ المالك.
# السرّ: SUPABASE_DB_URL نفسه المستعمل بـschema-snapshot وbackup.
# ════════════════════════════════════════════════════════════════════════
name: finance-integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'        # يومياً 02:30 UTC — بعد النسخ الاحتياطي (02:00)

permissions:
  contents: read

concurrency:
  group: finance-integrity
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: تشغيل اختبارات الهوية (22 بنداً)
        run: |
          set -o pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F '|' -f scripts/finance-integrity.sql | tee /tmp/fi.txt
          echo "──────────────"
          BAD=$(awk -F'|' '$2 != "0" {print}' /tmp/fi.txt)
          TOTAL=$(wc -l < /tmp/fi.txt)
          if [ "$TOTAL" -lt 22 ]; then echo "❌ الفحص أعاد $TOTAL بنداً فقط (متوقع 22) — الاستعلام لم يكتمل"; exit 1; fi
          if [ -n "$BAD" ]; then
            echo "❌ هوية المحاسبة مخروقة — بنودٌ غير صفرية:"; echo "$BAD"; exit 1
          fi
          echo "✅ هوية المحاسبة سليمة: $TOTAL/$TOTAL صفر."
