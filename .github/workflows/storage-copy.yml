# ════════════════════════════════════════════════════════════════════════
# SyDent — storage-copy.yml · نقل ملفات عيادات (Storage) بين مشروعين
# ════════════════════════════════════════════════════════════════════════
# scripts/storage-copy.py: the files under <owner uuid>/ in patient-files and
# payment-receipts, source → target. Pairs with db-copy.yml (rows first, files
# after). The service keys are read inside the runner and never printed.
# Manual only. The confirm input must repeat the target ref.
# ════════════════════════════════════════════════════════════════════════
name: Storage Copy Files

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Source project ref'
        required: true
      to_ref:
        description: 'Target project ref'
        required: true
        default: 'nxkalpjrqvpglphmiuui'
      confirm:
        description: 'Type the target ref again to confirm'
        required: true
      ids:
        description: 'Account uuids, comma separated'
        required: true
      dry_run:
        description: 'Count files only, write nothing'
        type: boolean
        default: true

concurrency:
  group: storage-copy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm
        env:
          REF: ${{ inputs.to_ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "$CONFIRM" ]; then echo "⛔ confirmation does not match the target ref"; exit 1; fi

      - uses: actions/checkout@v5

      - name: Copy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FROM: ${{ inputs.from_ref }}
          TO: ${{ inputs.to_ref }}
          IDS: ${{ inputs.ids }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$DRY" = "true" ]; then extra="--dry-run"; fi
          python3 scripts/storage-copy.py --from "$FROM" --to "$TO" --ids "$IDS" $extra
