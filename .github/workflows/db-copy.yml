# ════════════════════════════════════════════════════════════════════════
# SyDent — db-copy.yml · نقل حسابات عيادات من مشروع Supabase لمشروع تاني
# ════════════════════════════════════════════════════════════════════════
# scripts/db-copy.py: chosen auth users (with their password hashes, so people
# keep their email and password) and every clinic row they own, source → target,
# through the Management API. Run with list first to pick the accounts.
# Upsert only, never deletes; safe to re-run. The rows stay inside the runner —
# the log shows table names, row counts and masked emails only.
#
# Manual only. The confirm input must repeat the target ref.
# Secret: SUPABASE_ACCESS_TOKEN with database access to BOTH projects.
# ════════════════════════════════════════════════════════════════════════
name: DB Copy Accounts

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Source project ref'
        required: true
        default: 'peeydqtjwklixphuzvzg'
      to_ref:
        description: 'Target project ref'
        required: true
        default: 'nxkalpjrqvpglphmiuui'
      confirm:
        description: 'Type the target ref again to confirm'
        required: true
      list:
        description: 'Only list the source accounts (masked emails, counts) — writes nothing'
        type: boolean
        default: false
      files:
        description: 'Copy the Storage files of the ids instead of their rows (run after the rows)'
        type: boolean
        default: false
      drop_missing:
        description: 'With files: remove the target document rows whose file exists nowhere'
        type: boolean
        default: false
      ids:
        description: 'Accounts to copy: uuids from the list, comma separated'
        required: false
        default: ''
      emails:
        description: 'Or the accounts by email (comma separated)'
        required: false
        default: ''
      dry_run:
        description: 'Count rows only, write nothing'
        type: boolean
        default: false

concurrency:
  group: db-copy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm
        env:
          REF: ${{ inputs.to_ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "$CONFIRM" ]; then echo "⛔ confirmation does not match the target ref"; exit 1; fi

      - uses: actions/checkout@v5

      - name: Copy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FROM: ${{ inputs.from_ref }}
          TO: ${{ inputs.to_ref }}
          EMAILS: ${{ inputs.emails }}
          IDS: ${{ inputs.ids }}
          LIST: ${{ inputs.list }}
          FILES: ${{ inputs.files }}
          DROP: ${{ inputs.drop_missing }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$LIST" = "true" ]; then python3 scripts/db-copy.py --from "$FROM" --to "$TO" --list; exit 0; fi
          if [ "$FILES" = "true" ]; then
            if [ "$DROP" = "true" ]; then
              if [ "$DRY" = "true" ]; then python3 scripts/storage-copy.py --from "$FROM" --to "$TO" --ids "$IDS" --drop-missing --dry-run
              else python3 scripts/storage-copy.py --from "$FROM" --to "$TO" --ids "$IDS" --drop-missing; fi
              exit 0
            fi
            if [ "$DRY" = "true" ]; then python3 scripts/storage-copy.py --from "$FROM" --to "$TO" --ids "$IDS" --dry-run
            else python3 scripts/storage-copy.py --from "$FROM" --to "$TO" --ids "$IDS"; fi
            exit 0
          fi
          extra=""
          if [ -n "$IDS" ]; then extra="--ids $IDS"; fi
          if [ -n "$EMAILS" ]; then extra="$extra --emails $EMAILS"; fi
          if [ "$DRY" = "true" ]; then extra="$extra --dry-run"; fi
          python3 scripts/db-copy.py --from "$FROM" --to "$TO" $extra
