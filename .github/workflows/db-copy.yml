# ════════════════════════════════════════════════════════════════════════
# SyDent — db-copy.yml · نقل حسابات عيادات من مشروع Supabase لمشروع تاني
# ════════════════════════════════════════════════════════════════════════
# scripts/db-copy.py: auth users (with their password hashes, so people keep
# their email and password) and their clinic rows, source → target, through
# the Management API. Upsert only, never deletes; safe to re-run. The rows
# stay inside the runner — the log shows table names and row counts only.
#
# Manual only. The confirm input must repeat the target ref.
# Secret: SUPABASE_ACCESS_TOKEN with database access to BOTH projects.
# ════════════════════════════════════════════════════════════════════════
name: DB Copy Accounts

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Source project ref'
        required: true
        default: 'peeydqtjwklixphuzvzg'
      to_ref:
        description: 'Target project ref'
        required: true
        default: 'nxkalpjrqvpglphmiuui'
      confirm:
        description: 'Type the target ref again to confirm'
        required: true
      emails:
        description: 'Only these accounts (comma separated) — empty = every account'
        required: false
        default: ''
      dry_run:
        description: 'Count rows only, write nothing'
        type: boolean
        default: false

concurrency:
  group: db-copy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm
        env:
          REF: ${{ inputs.to_ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "$CONFIRM" ]; then echo "⛔ confirmation does not match the target ref"; exit 1; fi

      - uses: actions/checkout@v5

      - name: Copy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FROM: ${{ inputs.from_ref }}
          TO: ${{ inputs.to_ref }}
          EMAILS: ${{ inputs.emails }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          extra=""
          if [ -n "$EMAILS" ]; then extra="--emails $EMAILS"; fi
          if [ "$DRY" = "true" ]; then extra="$extra --dry-run"; fi
          python3 scripts/db-copy.py --from "$FROM" --to "$TO" $extra
