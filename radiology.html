<script src="theme.js?v=20261010a"></script>
<style>
/* C1: كتلة التصوير الشعاعي — أرشيف موحّد لصور الأشعة والصور السريرية لكل المرضى.
   المصدر جدول patient_documents نفسه (تبويب «الملفات» بملف المريض)، فما في
   migration ولا تخزين جديد. الألوان كلها من توكنات theme.css. */
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Kufi Arabic','Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; overflow-x:hidden; }
.main { flex:1; margin-right:var(--sb-width,240px); display:flex; flex-direction:column; min-height:100vh; min-width:0; }
.topbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:50; }
.topbar-title { font-size:20px; font-weight:800; flex:1; }
.topbar-sub { font-size:12px; color:var(--text2); font-weight:500; margin-top:2px; }
.content { padding:24px 28px 40px; flex:1; }

.rx-tabs { display:inline-flex; gap:4px; padding:4px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; margin-bottom:18px; position:relative; }
.rx-tab { position:relative; z-index:1; padding:8px 18px; border:0; background:none; color:var(--text2); font:inherit; font-size:13px; font-weight:700; border-radius:9px; cursor:pointer; transition:color .25s ease; }
.rx-tab.active { color:var(--on-accent); }
.rx-tab-pill { position:absolute; top:4px; bottom:4px; border-radius:9px; background:var(--green); transition:right .35s var(--sy-ease,ease), width .35s var(--sy-ease,ease); }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
.stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
.stat-label { font-size:12px; color:var(--text2); font-weight:600; }
.stat-num { font-size:24px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }

.rx-filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
.rx-filters input, .rx-filters select { background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:9px 12px; font:inherit; font-size:13px; transition:border-color .2s ease, box-shadow .2s ease; }
.rx-filters input { flex:1; min-width:200px; }
.rx-filters input:focus, .rx-filters select:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(var(--green-rgb),.15); }

.rx-month { font-size:13px; font-weight:800; color:var(--text2); margin:22px 2px 10px; display:flex; align-items:center; gap:10px; }
.rx-month::after { content:''; flex:1; height:1px; background:var(--border); }
.rx-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.rx-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; text-align:right; font:inherit; color:inherit; padding:0;
  animation:syRise .45s var(--sy-ease,ease) backwards; transition:transform .25s var(--sy-ease,ease), box-shadow .25s ease, border-color .25s ease; }
.rx-card:hover { transform:translateY(-3px); border-color:rgba(var(--green-rgb),.4); box-shadow:0 14px 30px -16px rgba(var(--green-rgb),.5); }
.rx-thumb { aspect-ratio:4/3; background:var(--bg3); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--text2); }
.rx-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .5s var(--sy-ease,ease); opacity:0; }
.rx-thumb img.ok { opacity:1; transition:opacity .35s ease, transform .5s var(--sy-ease,ease); }
.rx-card:hover .rx-thumb img { transform:scale(1.06); }
.rx-thumb svg { width:38px; height:38px; opacity:.6; }
.rx-meta { padding:10px 12px; }
.rx-pt { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rx-sub { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:11px; color:var(--text2); }
.rx-chip { background:rgba(var(--green-rgb),.12); color:var(--green); border-radius:999px; padding:1px 8px; font-weight:700; }

.empty { text-align:center; padding:60px 20px; color:var(--text2); }
.empty svg { width:52px; height:52px; opacity:.5; margin-bottom:10px; }
.empty-title { font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
.empty-sub { font-size:13px; line-height:1.8; max-width:420px; margin:0 auto; }
.skel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.skel-grid .sy-skel { aspect-ratio:4/3.9; border-radius:14px; }

/* العارض */
.rx-viewer { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.92); display:none; flex-direction:column; color:#fff; }
.rx-viewer.show { display:flex; animation:syPageIn .25s ease; }
.rx-vbar { display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap; }
.rx-vtitle { flex:1; min-width:0; }
.rx-vtitle b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rx-vtitle span { font-size:12px; opacity:.7; }
.rx-vbtn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; border-radius:10px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; text-decoration:none; transition:background .2s ease, transform .15s ease; }
.rx-vbtn:hover { background:rgba(255,255,255,.2); }
.rx-vbtn:active { transform:scale(.95); }
.rx-vbtn.on { background:var(--green); border-color:var(--green); }
.rx-stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
.rx-stage.drag { cursor:grabbing; }
.rx-stage img { max-width:92%; max-height:92%; user-select:none; -webkit-user-drag:none; transition:filter .2s ease; will-change:transform; }
.rx-nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; font-size:20px; display:flex; align-items:center; justify-content:center; padding:0; }
.rx-nav.prev { right:14px; } .rx-nav.next { left:14px; }
.rx-tools { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; padding:12px 16px 16px; font-size:12px; }
.rx-tools label { display:flex; align-items:center; gap:8px; opacity:.9; }
.rx-tools input[type=range] { width:120px; accent-color:var(--green); }

@media (max-width:820px) {
  .main { margin-right:0; }
  .topbar { padding:12px 16px; }
  .content { padding:16px; }
  .rx-grid, .skel-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
}
</style>
</head>
<body>
<div class="main" id="sbMainContent">
  <div class="topbar">
    <div class="topbar-title">التصوير الشعاعي<div class="topbar-sub">كل صور الأشعة والصور السريرية لمرضى العيادة بمكان واحد</div></div>
  </div>
  <div class="content">
    <div class="rx-tabs" role="tablist" id="rxTabs">
      <span class="rx-tab-pill" id="rxPill"></span>
      <button class="rx-tab" role="tab" data-cat="xray" onclick="rxSetCat('xray')">أشعة</button>
      <button class="rx-tab" role="tab" data-cat="clinical_photo" onclick="rxSetCat('clinical_photo')">صور سريرية</button>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-label">إجمالي الصور</div><div class="stat-num" id="stTotal">—</div></div>
      <div class="stat-card"><div class="stat-label">هالشهر</div><div class="stat-num" id="stMonth">—</div></div>
      <div class="stat-card"><div class="stat-label">عدد المرضى</div><div class="stat-num" id="stPatients">—</div></div>
      <div class="stat-card"><div class="stat-label">مربوطة بسن</div><div class="stat-num" id="stTooth">—</div></div>
    </div>

    <div class="rx-filters">
      <input type="search" id="rxSearch" placeholder="🔍  بحث باسم المريض أو اسم الملف…" oninput="rxRender()" aria-label="بحث">
      <select id="rxPeriod" onchange="rxRender()" aria-label="الفترة">
        <option value="all">كل الفترات</option>
        <option value="30">آخر 30 يوم</option>
        <option value="90">آخر 3 أشهر</option>
        <option value="365">آخر سنة</option>
      </select>
      <select id="rxTooth" onchange="rxRender()" aria-label="السن"><option value="">كل الأسنان</option></select>
    </div>

    <div id="rxArea"><div class="skel-grid"><div class="sy-skel"></div><div class="sy-skel"></div><div class="sy-skel"></div><div class="sy-skel"></div></div></div>
  </div>
</div>

<div class="rx-viewer" id="rxViewer" role="dialog" aria-modal="true" aria-label="عارض الصور">
  <div class="rx-vbar">
    <div class="rx-vtitle"><b id="rxVName"></b><span id="rxVSub"></span></div>
    <a class="rx-vbtn" id="rxVProfile" href="#">ملف المريض</a>
    <a class="rx-vbtn" id="rxVDownload" href="#" target="_blank" rel="noopener">فتح الأصل</a>
    <button class="rx-vbtn" onclick="rxClose()" aria-label="إغلاق">✕</button>
  </div>
  <div class="rx-stage" id="rxStage">
    <img id="rxVImg" alt="">
    <button class="rx-vbtn rx-nav prev" onclick="rxStep(-1)" aria-label="السابقة">›</button>
    <button class="rx-vbtn rx-nav next" onclick="rxStep(1)" aria-label="التالية">‹</button>
  </div>
  <div class="rx-tools">
    <button class="rx-vbtn" onclick="rxZoom(1.25)" aria-label="تكبير">＋</button>
    <button class="rx-vbtn" onclick="rxZoom(0.8)" aria-label="تصغير">－</button>
    <label>السطوع <input type="range" id="rxBright" min="40" max="200" value="100" oninput="rxApply()"></label>
    <label>التباين <input type="range" id="rxContrast" min="40" max="250" value="100" oninput="rxApply()"></label>
    <button class="rx-vbtn" id="rxInvert" onclick="rxToggleInvert()">عكس الألوان</button>
    <button class="rx-vbtn" onclick="rxReset()">إعادة ضبط</button>
  </div>
</div>

<link rel="stylesheet" href="theme.css?v=20261010a">
<script src="/vendor/supabase-2.110.8.min.js"></script>
<script src="supabase-init.js?v=20261010a"></script>
<script src="sy-modal.js?v=20261010a"></script>
<script src="sidebar.js?v=20261010a"></script>
<script>
var RX_CATS = { xray: 'أشعة', clinical_photo: 'صور سريرية' };
var rxCat = (new URLSearchParams(location.search).get('cat') === 'clinical_photo') ? 'clinical_photo' : 'xray';
var rxDocs = [];        // كل صفوف patient_documents للتصنيفين
var rxNames = {};       // patient_id → الاسم
var rxUrls = {};        // storage_path → رابط موقّع
var rxList = [];        // المعروض حالياً بعد الفلترة
var rxIdx = -1;
var rxView = { s: 1, x: 0, y: 0, inv: false };

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function rxIsImg(d) { return /^image\//.test(d.mime_type || ''); }
// التاريخ أرقام بس (قرار المالك v487) — عبر المُنسّق الموحّد SyDT.
function rxDate(iso) { return window.SyDT ? window.SyDT.numDate(iso) : String(iso || '').slice(0, 10); }
function rxMonthKey(iso) {
  var d = new Date(iso);
  return isNaN(d.getTime()) ? '' : (d.getMonth() + 1) + '/' + d.getFullYear();
}

function rxPlacePill() {
  var act = document.querySelector('.rx-tab.active'), pill = document.getElementById('rxPill');
  if (!act || !pill) return;
  var box = document.getElementById('rxTabs').getBoundingClientRect(), r = act.getBoundingClientRect();
  pill.style.right = (box.right - r.right) + 'px';
  pill.style.width = r.width + 'px';
}
function rxSetCat(cat) {
  rxCat = cat;
  document.querySelectorAll('.rx-tab').forEach(function (b) {
    var on = b.getAttribute('data-cat') === cat;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  rxPlacePill();
  try { history.replaceState(null, '', cat === 'xray' ? 'radiology.html' : 'radiology.html?cat=' + cat); } catch (e) {}
  // العنصر الفعّال بالقائمة الجانبية يتبع التبويب
  document.querySelectorAll('.sb-item[href^="radiology.html"]').forEach(function (a) {
    var on = (a.getAttribute('href') === 'radiology.html') === (cat === 'xray');
    a.classList.toggle('active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  rxFillTeeth();
  rxRender();
}

function rxFillTeeth() {
  var sel = document.getElementById('rxTooth'), cur = sel.value, seen = {};
  rxDocs.forEach(function (d) { if (d.category === rxCat && d.tooth_num) seen[d.tooth_num] = 1; });
  var teeth = Object.keys(seen).sort(function (a, b) { return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0); });
  sel.innerHTML = '<option value="">كل الأسنان</option>' + teeth.map(function (t) {
    return '<option value="' + escapeHtml(t) + '">السن ' + escapeHtml(t) + '</option>';
  }).join('');
  if (seen[cur]) sel.value = cur;
}

function rxStats(all) {
  var now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth(), 1), pts = {}, month = 0, tooth = 0;
  all.forEach(function (d) {
    pts[d.patient_id] = 1;
    if (new Date(d.created_at) >= m0) month++;
    if (d.tooth_num) tooth++;
  });
  document.getElementById('stTotal').textContent = all.length;
  document.getElementById('stMonth').textContent = month;
  document.getElementById('stPatients').textContent = Object.keys(pts).length;
  document.getElementById('stTooth').textContent = tooth;
}

function rxIcon(isImg) {
  return isImg
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
}

function rxRender() {
  var all = rxDocs.filter(function (d) { return d.category === rxCat; });
  rxStats(all);
  var q = (document.getElementById('rxSearch').value || '').trim().toLowerCase();
  var days = document.getElementById('rxPeriod').value;
  var tooth = document.getElementById('rxTooth').value;
  var since = days === 'all' ? 0 : Date.now() - parseInt(days, 10) * 864e5;
  rxList = all.filter(function (d) {
    if (since && new Date(d.created_at).getTime() < since) return false;
    if (tooth && d.tooth_num !== tooth) return false;
    if (q) {
      var hay = ((rxNames[d.patient_id] || '') + ' ' + (d.file_name || '') + ' ' + (d.note || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var area = document.getElementById('rxArea');
  if (!rxList.length) {
    area.innerHTML = '<div class="empty">' + rxIcon(true)
      + '<div class="empty-title">' + (all.length ? 'ما في نتائج' : 'لسا ما في ' + escapeHtml(RX_CATS[rxCat])) + '</div>'
      + '<div class="empty-sub">' + (all.length
          ? 'جرّب تغيّر البحث أو الفترة أو السن.'
          : 'الصور بتنرفع من ملف المريض ← تبويب «الملفات» بتصنيف «' + escapeHtml(RX_CATS[rxCat] === 'أشعة' ? 'أشعة' : 'صورة سريرية') + '»، وبتظهر هون تلقائياً.')
      + '</div></div>';
    return;
  }
  var html = '', lastMonth = '', idx = 0;
  rxList.forEach(function (d, i) {
    var mk = rxMonthKey(d.created_at);
    if (mk !== lastMonth) {
      if (lastMonth) html += '</div>';
      html += '<div class="rx-month">' + escapeHtml(mk) + '</div><div class="rx-grid">';
      lastMonth = mk; idx = 0;
    }
    var isImg = rxIsImg(d), url = rxUrls[d.storage_path];
    var thumb = (isImg && url)
      ? '<img loading="lazy" src="' + escapeHtml(url) + '" alt="" onload="this.classList.add(\'ok\')">'
      : rxIcon(isImg);
    html += '<button type="button" class="rx-card" style="animation-delay:' + Math.min(idx++, 12) * 0.035 + 's" onclick="rxOpen(' + i + ')">'
      + '<div class="rx-thumb">' + thumb + '</div>'
      + '<div class="rx-meta"><div class="rx-pt">' + escapeHtml(rxNames[d.patient_id] || 'مريض') + '</div>'
      + '<div class="rx-sub"><span>' + escapeHtml(rxDate(d.created_at)) + '</span>'
      + (d.tooth_num ? '<span class="rx-chip">سن ' + escapeHtml(d.tooth_num) + '</span>' : '')
      + '</div></div></button>';
  });
  area.innerHTML = html + '</div>';
}

/* ── العارض ── */
function rxApply() {
  var img = document.getElementById('rxVImg');
  img.style.transform = 'translate(' + rxView.x + 'px,' + rxView.y + 'px) scale(' + rxView.s + ')';
  img.style.filter = 'brightness(' + document.getElementById('rxBright').value + '%) contrast('
    + document.getElementById('rxContrast').value + '%)' + (rxView.inv ? ' invert(1)' : '');
}
function rxZoom(f) { rxView.s = Math.min(8, Math.max(0.5, rxView.s * f)); if (rxView.s <= 1) { rxView.x = 0; rxView.y = 0; } rxApply(); }
function rxToggleInvert() { rxView.inv = !rxView.inv; document.getElementById('rxInvert').classList.toggle('on', rxView.inv); rxApply(); }
function rxReset() {
  rxView = { s: 1, x: 0, y: 0, inv: false };
  document.getElementById('rxBright').value = 100;
  document.getElementById('rxContrast').value = 100;
  document.getElementById('rxInvert').classList.remove('on');
  rxApply();
}
async function rxOpen(i) {
  var d = rxList[i];
  if (!d) return;
  var url = rxUrls[d.storage_path] || (window.SyDentFiles ? await window.SyDentFiles.signedUrl(d.storage_path) : null);
  if (!url) { if (window.showToast) showToast('⚠️ تعذّر فتح الملف'); return; }
  if (!rxIsImg(d)) { window.open(url, '_blank', 'noopener'); return; }
  rxIdx = i;
  document.getElementById('rxVName').textContent = rxNames[d.patient_id] || 'مريض';
  document.getElementById('rxVSub').textContent = rxDate(d.created_at) + (d.tooth_num ? ' · السن ' + d.tooth_num : '') + (d.note ? ' · ' + d.note : '');
  document.getElementById('rxVProfile').href = 'patient-profile.html?id=' + encodeURIComponent(d.patient_id);
  document.getElementById('rxVDownload').href = url;
  document.getElementById('rxVImg').src = url;
  rxReset();
  document.getElementById('rxViewer').classList.add('show');
  document.body.classList.add('sy-modal-lock');
}
function rxClose() {
  document.getElementById('rxViewer').classList.remove('show');
  document.body.classList.remove('sy-modal-lock');
  rxIdx = -1;
}
function rxStep(dir) {
  if (rxIdx < 0) return;
  for (var j = rxIdx + dir; j >= 0 && j < rxList.length; j += dir) {
    if (rxIsImg(rxList[j])) { rxOpen(j); return; }
  }
}
(function rxStageEvents() {
  var stage = document.getElementById('rxStage'), drag = null;
  stage.addEventListener('wheel', function (e) { e.preventDefault(); rxZoom(e.deltaY < 0 ? 1.12 : 0.89); }, { passive: false });
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    drag = { x: e.clientX - rxView.x, y: e.clientY - rxView.y };
    stage.classList.add('drag');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) { if (!drag) return; rxView.x = e.clientX - drag.x; rxView.y = e.clientY - drag.y; rxApply(); });
  stage.addEventListener('pointerup', function () { drag = null; stage.classList.remove('drag'); });
  stage.addEventListener('dblclick', function () { rxZoom(rxView.s > 1 ? 1 / rxView.s : 2); });
  document.addEventListener('keydown', function (e) {
    if (rxIdx < 0) return;
    if (e.key === 'Escape') rxClose();
    else if (e.key === 'ArrowLeft') rxStep(1);
    else if (e.key === 'ArrowRight') rxStep(-1);
  });
})();

/* ── التحميل ── */
async function rxLoad() {
  var res = await window.SyDentFetchAll(function () {
    return window.sb.from('patient_documents')
      .select('id,patient_id,storage_path,file_name,mime_type,category,note,tooth_num,created_at')
      .in('category', ['xray', 'clinical_photo']);
  });
  if (res.error) {
    document.getElementById('rxArea').innerHTML = '<div class="empty"><div class="empty-title">تعذّر تحميل الصور</div><div class="empty-sub">تأكد من الاتصال وجرّب تحدّث الصفحة.</div></div>';
    return;
  }
  rxDocs = (res.data || []).sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });

  var ids = Object.keys(rxDocs.reduce(function (m, d) { m[d.patient_id] = 1; return m; }, {}));
  for (var i = 0; i < ids.length; i += 200) {
    var pr = await window.sb.from('patients').select('id,name').in('id', ids.slice(i, i + 200));
    (pr.data || []).forEach(function (p) { rxNames[p.id] = p.name; });
  }
  var paths = rxDocs.filter(rxIsImg).map(function (d) { return d.storage_path; });
  for (var k = 0; k < paths.length; k += 100) {
    Object.assign(rxUrls, await window.SyDentFiles.signedUrls(paths.slice(k, k + 100), 3600));
  }
  rxSetCat(rxCat);
}

document.addEventListener('DOMContentLoaded', async function () {
  if (typeof initSidebar === 'function') initSidebar(rxCat === 'xray' ? 'radiology' : 'radiology-photos');
  var btn = document.createElement('button');
  btn.className = 'sb-hamburger';
  btn.id = 'sbHamburgerBtn';
  btn.setAttribute('aria-label', 'القائمة');
  btn.innerHTML = '<span></span><span></span><span></span>';
  btn.onclick = function () { window.sbToggle(); };
  window._sbBtn = btn;
  var topbar = document.querySelector('.topbar');
  if (topbar) topbar.insertBefore(btn, topbar.firstChild);

  rxSetCat(rxCat);
  window.addEventListener('resize', rxPlacePill);
  await new Promise(function (r) { setTimeout(r, 80); });
  var u = await window.sb.auth.getUser();
  if (!u || !u.data || !u.data.user) { location.href = 'auth.html'; return; }
  try { await rxLoad(); }
  catch (e) {
    console.warn('[radiology] load failed', e);
    document.getElementById('rxArea').innerHTML = '<div class="empty"><div class="empty-title">تعذّر تحميل الصور</div></div>';
  }
});
</script>
</body>
</html>
